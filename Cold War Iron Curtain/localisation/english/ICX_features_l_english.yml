l_english:
 ICX_arms_market_category:0 "International Arms Market"
 ICX_arms_market_category_desc:0 "Sell surplus weapons from our stockpile to buyers abroad. Used equipment sells for §Y60%§! of the market price.\n\nOur arms sales so far: §G$[?ICX_arms_sales_total|2]B§!\nRoyalties from our arms industry last month: §G$[?ICX_arms_royalties|3]B§! (paid when other countries buy weapons made by our bloc)"
 ICX_national_category:0 "National Initiatives"
 ICX_national_category_desc:0 "Government programmes that cost money or political power and pay off in stability, war support, manpower or income."
 ICX_sell_rifles:0 "Sell 2 000 Small Arms (60% of §G$[?global.WPTierOne|2]B§!)"
 ICX_sell_rifles_desc:0 "Sell 2 000 small arms from our stockpile on the international market. We receive §G60%§! of the market price (currently $[?global.WPTierOne|2]B for a new batch). Needs at least 2 000 in the stockpile."
 ICX_sell_support:0 "Sell 250 Support Equipment (60% of §G$[?global.WPTierOne|2]B§!)"
