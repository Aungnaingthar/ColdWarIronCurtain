 ICX_cost_ICX_public_works:0 "£dollar2  §Y0.3B§!"
 ICX_public_works:0 "Public Works Programme"
 ICX_public_works_desc:0 "Hire the unemployed to build roads, schools and wells. Costs §Y$0.30B§!."
 ICX_military_parade:0 "Military Parade"
 ICX_military_parade_desc:0 "March the army through the capital to rally the nation."
 ICX_recruitment_drive:0 "Recruitment Drive"
 ICX_recruitment_drive_desc:0 "Posters, radio and village visits bring volunteers to the colours."
 ICX_cost_ICX_anti_corruption:0 "£dollar2  §Y0.1B§!"
 ICX_anti_corruption:0 "Anti-Corruption Drive"
 ICX_anti_corruption_desc:0 "Investigate officials and recover stolen funds. For one year: more political power and stability. Costs §Y$0.10B§!."
 ICX_cost_ICX_literacy:0 "£dollar2  §Y0.2B§!"
 ICX_literacy:0 "National Literacy Campaign"
 ICX_literacy_desc:0 "Teachers and students go to the villages. For one year, research is faster. Costs §Y$0.20B§!."
 ICX_cost_ICX_tourism:0 "£dollar2  §Y0.15B§!"
 ICX_tourism:0 "Tourism Campaign"
 ICX_tourism_desc:0 "Advertise our beaches, temples and cities abroad. For two years, tourism earns §G$0.02B§! a month. Costs §Y$0.15B§!."
 ICX_bonds:0 "Issue Government Bonds"
 ICX_bonds_desc:0 "Borrow §G$1.00B§! from our own citizens now. We repay §Y$1.20B§!: §Y$0.05B§! a month for two years."
 ICX_privatise:0 "Sell State Assets"
 ICX_privatise_desc:0 "Sell state hotels, shops and small factories to private owners. Brings §G$0.50B§! but angers workers."
 ICX_cost_ICX_emergency_relief:0 "£dollar2  §Y0.2B§!"
 ICX_emergency_relief:0 "Emergency Relief Fund"
 ICX_emergency_relief_desc:0 "Send food and medicine to regions hit by floods, drought or war. Costs §Y$0.20B§!."
