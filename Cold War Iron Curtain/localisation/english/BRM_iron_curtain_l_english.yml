l_english:
 BRM_tatmadaw:0 "The Tatmadaw"
 BRM_tatmadaw_desc:0 "Born from the Burma Independence Army of 1941, the Tatmadaw is now all that stands between the government in Rangoon and the many armed groups that want to overthrow it."
 BRM_counterinsurgency:0 "Counter-Insurgency Doctrine"
 BRM_counterinsurgency_desc:0 "Our war is fought in paddy fields, river deltas and jungle hills, not on open plains. The army must learn to fight insurgents."
 BRM_light_infantry_divisions:0 "Light Infantry Divisions"
 BRM_light_infantry_divisions_desc:0 "Mobile, lightly equipped divisions in the mould of the later 77th Light Infantry Division can move quickly through any terrain in the Union."
 BRM_long_range_patrols:0 "Long-Range Jungle Patrols"
 BRM_long_range_patrols_desc:0 "Small teams that live in the jungle for weeks can find rebel camps that whole battalions miss."
 BRM_mountain_warfare:0 "Mountain Warfare in the Northern Hills"
 BRM_mountain_warfare_desc:0 "The Kachin, Chin and Shan hills rise to more than 3,000 metres. Our soldiers must learn to fight, march and supply themselves there."
 BRM_peoples_war_doctrine:0 "People's War"
 BRM_peoples_war_doctrine_desc:0 "Every village a fortress, every farmer a soldier. If Burma is invaded, the whole nation will resist."
 BRM_conventional_defence:0 "Conventional Defence"
 BRM_conventional_defence_desc:0 "A professional army of regular divisions, artillery and armour can meet any invader at the border."
 BRM_people_militias:0 "The People's Militias"
 BRM_people_militias_desc:0 "Local self-defence militias, the Pyusawhti and later the Ka Kwe Ye, can hold villages and free the regular army to campaign."
 BRM_burma_rifles:0 "Traditions of the Burma Rifles"
 BRM_burma_rifles_desc:0 "The veterans of the old Burma Rifles, the Kachin Rifles and the Chin Rifles bring hard-won experience to the new army."
 BRM_riverine_operations:0 "Delta Riverine Operations"
 BRM_riverine_operations_desc:0 "In the Irrawaddy Delta the rivers are the roads. Infantry and river craft must learn to fight together."
 BRM_jungle_masters:0 "Masters of Jungle Warfare"
 BRM_jungle_masters_desc:0 "Few armies in the world know the jungle as well as the Tatmadaw."
 BRM_ka_pa_sa:0 "Directorate of Defence Industries"
 BRM_ka_pa_sa_desc:0 "Ka Pa Sa, the Directorate of Defence Industries, will free the Tatmadaw from depending on foreign arms dealers."
 BRM_fritz_werner:0 "The Fritz Werner Agreement"
 BRM_fritz_werner_desc:0 "The West German firm Fritz Werner has offered to build modern arms factories in Burma. These factories will let us make our own rifles."
 BRM_ba63_rifle:0 "The BA-63 Rifle"
 BRM_ba63_rifle_desc:0 "Under licence from West Germany, Burma builds its own version of the G3 battle rifle, the BA-63."
 BRM_ordnance_factories:0 "The Ordnance Factories"
 BRM_ordnance_factories_desc:0 "New factories for ammunition, mortars and light artillery spread across central Burma."
 BRM_self_reliant_arms:0 "Self-Reliant Arms Production"
 BRM_self_reliant_arms_desc:0 "Burma should be able to arm its soldiers without asking any foreign power for help."
 BRM_ma_rifles:0 "The MA Rifle Series"
 BRM_ma_rifles_desc:0 "Burma's own MA-series rifles replace foreign designs."
 BRM_artillery_corps:0 "The Artillery Corps"
 BRM_artillery_corps_desc:0 "Light artillery and mortars that mules and men can carry over the hills."
 BRM_armoured_corps:0 "The Armoured Corps"
 BRM_armoured_corps_desc:0 "From a few old Comet and Stuart tanks to a real armoured force."
 BRM_motor_transport:0 "Motor Transport Battalions"
 BRM_motor_transport_desc:0 "Trucks and jeeps, many of them assembled at home, let the army move quickly along the new roads."
 BRM_mechanised_infantry:0 "Mechanised Infantry"
 BRM_mechanised_infantry_desc:0 "Armoured personnel carriers and mechanised infantry give the Tatmadaw a strong mobile reserve."
 BRM_defence_services_academy:0 "The Defence Services Academy"
 BRM_defence_services_academy_desc:0 "Founded in 1955, the Defence Services Academy at Maymyo will train the officers of the future."
 BRM_officer_training:0 "Officer Training School, Bahtoo"
 BRM_officer_training_desc:0 "Short courses at Bahtoo turn experienced sergeants and graduates into junior officers."
 BRM_national_service:0 "National Service"
 BRM_national_service_desc:0 "A conscription law will give the army all the soldiers it needs."
 BRM_volunteer_army:0 "An All-Volunteer Army"
 BRM_volunteer_army_desc:0 "Better pay and housing will fill the ranks with volunteers who want to serve."
 BRM_regional_commands:0 "Regional Military Commands"
 BRM_regional_commands_desc:0 "Each region gets its own command, able to fight without waiting for orders from Rangoon."
 BRM_military_intelligence:0 "Military Intelligence Service"
 BRM_military_intelligence_desc:0 "An intelligence service to watch the borders and find out the rebels' plans before they act."
 BRM_supply_corps:0 "Supply and Transport Corps"
 BRM_supply_corps_desc:0 "An army in the hills marches on rice and mules. A proper supply corps will keep it fed."
 BRM_army_medical_corps:0 "Army Medical Corps"
 BRM_army_medical_corps_desc:0 "Malaria killed more soldiers in Burma than bullets. Doctors and medicine will save thousands of lives."
 BRM_signal_corps:0 "Signal Corps"
 BRM_signal_corps_desc:0 "Radios link every battalion to its commanders."
 BRM_armed_forces_day:0 "Armed Forces Day"
 BRM_armed_forces_day_desc:0 "Every year on 27 March, the anniversary of the 1945 rising against the Japanese, the nation honours its soldiers."
 BRM_modern_tatmadaw:0 "A Modern Tatmadaw"
 BRM_modern_tatmadaw_desc:0 "From a rebel army of 1941 to a modern national defence force: the Tatmadaw has come of age."
 BRM_tatmadaw_21st_century:0 "A 21st-Century Army"
 BRM_tatmadaw_21st_century_desc:0 "Drones, modern communications and professional training for a new century."
 BRM_ubaf:0 "Union of Burma Air Force"
 BRM_ubaf_desc:0 "A handful of Spitfires, Seafires and transports make up the young air force. It needs proper bases and trained pilots."
 BRM_spitfire_squadrons:0 "Spitfire and Seafire Squadrons"
 BRM_spitfire_squadrons_desc:0 "Second-hand Spitfires from Israel and Seafires from Britain form the first fighter squadrons."
 BRM_sea_fury:0 "Sea Fury Squadrons"
 BRM_sea_fury_desc:0 "Hawker Sea Furies, bought from Britain in 1957, are the backbone of the air force's ground attack force."
 BRM_jet_age:0 "Enter the Jet Age"
 BRM_jet_age_desc:0 "Vampire and T-33 jet trainers bring Burmese pilots into the jet age."
 BRM_f7_fighters:0 "Chengdu F-7 Fighters"
 BRM_f7_fighters_desc:0 "Chinese-built F-7 jets, based on the MiG-21, give the air force a modern supersonic fighter."
 BRM_mig29:0 "MiG-29 Fulcrums"
 BRM_mig29_desc:0 "From 2001 the MiG-29 brings a true fourth-generation fighter to Burmese skies."
 BRM_su30:0 "Su-30 Flankers"
 BRM_su30_desc:0 "Long-range multirole Su-30SME fighters arrive in the 2020s."
 BRM_air_transport:0 "Dakota Transport Wing"
 BRM_air_transport_desc:0 "C-47 Dakotas are the lifeline of garrisons in the hills that no road can reach."
 BRM_helicopters:0 "Helicopter Squadrons"
 BRM_helicopters_desc:0 "Alouette and later Mi-17 helicopters carry troops and wounded to and from the jungle."
 BRM_coin_air:0 "Counter-Insurgency Air Support"
 BRM_coin_air_desc:0 "Armed Pilatus PC-7 and PC-9 trainers support the army against the insurgents."
 BRM_ground_attack:0 "Nanchang A-5 Attack Aircraft"
 BRM_ground_attack_desc:0 "Chinese A-5 attack jets give the air force a real strike force."
 BRM_air_bases:0 "Mingaladon, Meiktila and Hmawbi"
 BRM_air_bases_desc:0 "Lengthen and modernise the runways at the country's three main air bases."
 BRM_air_academy:0 "Air Force Academy, Meiktila"
 BRM_air_academy_desc:0 "A home-grown academy will train our own pilots and engineers."
 BRM_aircraft_plant:0 "Aircraft Production Base"
 BRM_aircraft_plant_desc:0 "A factory at Meiktila will assemble trainers and repair the air force's aircraft."
 BRM_radar_network:0 "National Radar Network"
 BRM_radar_network_desc:0 "Radar stations will watch the skies from Kawthaung to Myitkyina."
 BRM_air_defence:0 "Air Defence Command"
 BRM_air_defence_desc:0 "Anti-aircraft guns and missiles protect the cities and bases."
 BRM_modern_air_force:0 "A Modern Air Force"
 BRM_modern_air_force_desc:0 "The Union of Burma Air Force can now defend the nation's skies."
 BRM_riverine_navy:0 "The Riverine Navy"
 BRM_riverine_navy_desc:0 "The Irrawaddy and its delta are the arteries of the Union. A navy of patrol boats and river gunboats will keep them open."
 BRM_river_gunboats:0 "Yugoslav River Gunboats"
 BRM_river_gunboats_desc:0 "Y-301 class gunboats, built with Yugoslav help, patrol the Irrawaddy and Chindwin."
 BRM_delta_flotillas:0 "Delta Patrol Flotillas"
 BRM_delta_flotillas_desc:0 "Fast boats cut the rebels' supply lines across the creeks of the Delta."
 BRM_naval_infantry:0 "Naval Infantry"
 BRM_naval_infantry_desc:0 "Sailors trained to fight ashore, to clear the creeks and islands."
 BRM_amphibious_operations:0 "Amphibious Operations"
 BRM_amphibious_operations_desc:0 "Joint landings along the Arakan and Tenasserim coasts."
 BRM_sinmalaik_dockyard:0 "Sinmalaik Naval Dockyard"
 BRM_sinmalaik_dockyard_desc:0 "Expand the naval dockyard at Sinmalaik in Rangoon to build and repair our own ships."
 BRM_patrol_craft:0 "Home-Built Patrol Craft"
 BRM_patrol_craft_desc:0 "Burmese yards start building their own patrol boats."
 BRM_anawrahta_corvettes:0 "Anawrahta-Class Corvettes"
 BRM_anawrahta_corvettes_desc:0 "The first warships designed and built in Burma enter service in 2001."
 BRM_aung_zeya_frigate:0 "The Frigate Aung Zeya"
 BRM_aung_zeya_frigate_desc:0 "Launched in 2008 and built at home, the frigate Aung Zeya is the pride of the navy."
 BRM_first_submarine:0 "The First Submarine"
 BRM_first_submarine_desc:0 "In 2020 the Kilo-class submarine UMS Minye Theinkhathu makes Burma a submarine power."
 BRM_andaman_patrol:0 "Andaman Sea Patrol"
 BRM_andaman_patrol_desc:0 "Smugglers, pirates and foreign fishing fleets work our long coast from Arakan to Tenasserim. The navy must patrol it."
 BRM_naval_training:0 "Naval Training Command"
 BRM_naval_training_desc:0 "A proper naval school for officers and ratings."
 BRM_offshore_protection:0 "Protect the Offshore Gas Fields"
 BRM_offshore_protection_desc:0 "The gas fields of the Andaman Sea need guarding."
 BRM_maritime_boundary:0 "The Maritime Boundary Ruling"
 BRM_maritime_boundary_desc:0 "In 2012 an international tribunal settles the sea boundary with Bangladesh. The disputed waters are now open for gas exploration."
 BRM_coastal_defence:0 "Coastal Defences"
 BRM_coastal_defence_desc:0 "Coastal guns and radar guard the mouths of the rivers and the approaches to Rangoon."
 BRM_naval_aviation:0 "Naval Aviation"
 BRM_naval_aviation_desc:0 "Helicopters on the new frigates extend the navy's eyes far out to sea."
 BRM_bay_of_bengal_navy:0 "A Navy for the Bay of Bengal"
 BRM_bay_of_bengal_navy_desc:0 "From river gunboats to a real sea-going navy."
 BRM_end_civil_war:0 "Ending the Civil War"
 BRM_end_civil_war_desc:0 "Communists of the Red Flag and the White Flag, mutinous PVO units, the Karen National Defence Organisation and many others are in arms against Rangoon. Some call us the 'Rangoon Government'. The Union must be saved."
 BRM_crush_insurrections:0 "Crush the Insurrections"
 BRM_crush_insurrections_desc:0 "General Ne Win's counter-offensives relieved Insein in 1949. Later the Four Cuts (Pya Ley Pya) cut the rebels off from food, money, intelligence and recruits. Only force will save the Union."
 BRM_panglong_spirit:0 "The Spirit of Panglong"
 BRM_panglong_spirit_desc:0 "At Panglong in 1947, Aung San promised the frontier peoples a place in the Union as equals. If we honour that promise, the guns may fall silent without more bloodshed."
 BRM_white_flag_communists:0 "The White Flag Communists"
 BRM_white_flag_communists_desc:0 "Thakin Than Tun's Communist Party of Burma has fought from the Pegu Yomas since 1948. Whether we beat it, buy it off or bring it into government, its rebellion must end."
 BRM_karen_question:0 "The Karen Question"
 BRM_karen_question_desc:0 "The Karen National Union rose in January 1949 and nearly took Rangoon. It still dreams of an independent Kawthoolei. A lasting answer to the Karen question is the key to peace in the Delta."
 BRM_kachin_chin_hills:0 "The Kachin and Chin Hills"
 BRM_kachin_chin_hills_desc:0 "The Kachin and Chin peoples gave the old Burma Rifles some of its finest soldiers. They must believe that the Union belongs to them too."
 BRM_shan_states:0 "The Shan States"
 BRM_shan_states_desc:0 "The Shan saophas, the hereditary princes, kept their old rights at Panglong, along with the right to leave the Union after ten years. We must settle their future before the Shan States slip away."
 BRM_nationalities_settlement:0 "A Settlement Among Nationalities"
 BRM_nationalities_settlement_desc:0 "Bamar, Karen, Kachin, Chin, Shan, Mon, Rakhine and Karenni must all find their place under one flag."
 BRM_expel_kmt:0 "Expel the Kuomintang Remnants"
 BRM_expel_kmt_desc:0 "General Li Mi's defeated Nationalist Chinese armies have dug into Shan State. They live off the opium trade and draw the wrath of Beijing. They must go: by the UN evacuations of 1953 and 1961, or by force of arms."
 BRM_golden_triangle:0 "The Golden Triangle"
 BRM_golden_triangle_desc:0 "Where Burma, Thailand and Laos meet, opium is the only currency that matters. Warlords grow rich on it and corrupt our officials."
 BRM_dismantle_opium:0 "Dismantle the Opium Networks"
 BRM_dismantle_opium_desc:0 "Crop substitution, honest local officials and steady pressure on the trafficking routes will finally break the warlords' grip on the hills."
 BRM_national_reconciliation:0 "National Reconciliation Convention"
 BRM_national_reconciliation_desc:0 "Leaders of the nationalities, the army and the government meet to put the long civil war behind them."
 BRM_union_restored:0 "The Union Restored"
 BRM_union_restored_desc:0 "For the first time since independence, the writ of the Union government runs from the Naga Hills to Victoria Point. Pyidaungsu: the Union is whole."
 BRM_union_of_burma:0 "The Union of Burma"
 BRM_union_of_burma_desc:0 "At 4:20 in the morning of 4 January 1948, an hour the astrologers chose, the Union Jack came down and Burma was free. A year later the young Union is fighting for its life."
 BRM_crossroads:0 "The Union at a Crossroads"
 BRM_crossroads_desc:0 "Parliamentary democracy, military rule, socialism or revolution: Burma's future is not yet written."
 BRM_afpfl_government:0 "U Nu's AFPFL Government"
 BRM_afpfl_government_desc:0 "Prime Minister U Nu leads the Anti-Fascist People's Freedom League. It is a broad coalition of nationalists and socialists, and the party that won independence."
 BRM_pyidawtha:0 "The Pyidawtha Plan"
 BRM_pyidawtha_desc:0 "'Pyidawtha', the Happy Land: an ambitious welfare state, drawn up with the American consultants Knappen Tippetts Abbett, promising homes, schools, clinics and factories for all."
 BRM_general_elections:0 "The General Elections"
 BRM_general_elections_desc:0 "The elections of 1951-52 and 1956 give the AFPFL a mandate from the people, even while the countryside is still at war."
 BRM_state_religion:0 "Buddhism as State Religion"
 BRM_state_religion_desc:0 "U Nu, a devout Buddhist, hosted the Sixth Buddhist Council at the Kaba Aye Pagoda and promised to make Buddhism the state religion. It is popular with the Bamar majority."
 BRM_secular_union:0 "A Secular Union"
 BRM_secular_union_desc:0 "The Kachin, Chin and Karen include many Christians. A Union that favours no faith will keep their trust."
 BRM_federal_seminar:0 "The Federal Seminar"
 BRM_federal_seminar_desc:0 "In 1962 the leaders of the states met in Rangoon to discuss a truly federal constitution. History cut the seminar short with a coup. This time it will finish its work."
 BRM_colombo_plan:0 "The Colombo Plan"
 BRM_colombo_plan_desc:0 "Burma joined the Colombo Plan in 1952. Commonwealth and American development aid can build the factories and train the engineers we need."
 BRM_democracy_endures:0 "The Democracy Endures"
 BRM_democracy_endures_desc:0 "There is no coup, no Revolutionary Council and no 'Burmese Way'. The Golden Land stays a parliamentary democracy and a beacon for Asia."
 BRM_ne_win_commander:0 "Ne Win, Commander-in-Chief"
 BRM_ne_win_commander_desc:0 "In February 1949, with Karen rebels at Insein, General Ne Win took command of the armed forces. The army that saves the Union will expect a say in running it."
 BRM_caretaker_government:0 "The Caretaker Government"
 BRM_caretaker_government_desc:0 "When the AFPFL split in 1958, U Nu asked Ne Win to form a caretaker government. The officers cleaned the streets of Rangoon, cut corruption, and got a taste for power."
 BRM_revolutionary_council:0 "The Revolutionary Council"
 BRM_revolutionary_council_desc:0 "On 2 March 1962 the army seized power, claiming that federalism would break up the Union. The Revolutionary Council now rules by decree."
 BRM_burmese_way:0 "The Burmese Way to Socialism"
 BRM_burmese_way_desc:0 "A blend of Marxism, Buddhism and nationalism: the Revolutionary Council's manifesto will steer Burma between East and West."
 BRM_found_bspp:0 "The Burma Socialist Programme Party"
 BRM_found_bspp_desc:0 "The Lanzin Party, the Burma Socialist Programme Party, becomes the only legal party, the vanguard of the Burmese Way."
 BRM_system_of_correlation:0 "The System of Correlation of Man and His Environment"
 BRM_system_of_correlation_desc:0 "The BSPP's philosophy of 1963 says that man and his surroundings shape each other. The state will explain it in every school and barracks."
 BRM_enterprise_nationalization:0 "Enterprise Nationalisation Law"
 BRM_enterprise_nationalization_desc:0 "From Burmah Oil to the corner shop, the commanding heights of the economy pass into the hands of the state."
 BRM_peoples_councils:0 "People's Councils"
 BRM_peoples_councils_desc:0 "Workers' and peasants' councils in every township bind the countryside to the Party."
 BRM_military_enterprises:0 "Military Economic Enterprises"
 BRM_military_enterprises_desc:0 "Following the old Defence Services Institute, the army runs its own shipping lines, banks and factories."
 BRM_socialist_republic:0 "The Socialist Republic of the Union of Burma"
 BRM_socialist_republic_desc:0 "The constitution of 1974 hands power from the Revolutionary Council to a civilian one-party state. The revolution is now law."
 BRM_pragmatic_socialism:0 "Pragmatic Socialism"
 BRM_pragmatic_socialism_desc:0 "Dogma has kept the shops empty. Quiet reforms let private traders and foreign partners back in, without giving up the Party's leadership."
 BRM_aung_gyi:0 "Aung Gyi's Memorandum"
 BRM_aung_gyi_desc:0 "Brigadier Aung Gyi, Ne Win's deputy, argued for a market economy and was forced out in 1963. In this history he wins the argument, and the Council."
 BRM_foreign_capital:0 "Invite Foreign Capital"
 BRM_foreign_capital_desc:0 "Japanese, British and American companies are welcome to build in Burma, provided Burmese partners share in the profits."
 BRM_professional_officers:0 "A Professional Officer Corps"
 BRM_professional_officers_desc:0 "Officers should be trained managers, not party bosses. The Defence Services Academy will produce a new generation of them."
 BRM_free_rice_trade:0 "Free the Rice Trade"
 BRM_free_rice_trade_desc:0 "Let farmers sell at fair prices and the paddy fields will fill again."
 BRM_technocrat_ministries:0 "Technocrat Ministries"
 BRM_technocrat_ministries_desc:0 "Engineers and economists, not ideologues, will run the ministries."
 BRM_developmental_state:0 "The Developmental State"
 BRM_developmental_state_desc:0 "Like the regimes in Seoul and Taipei, a disciplined government will drive growth from the top."
 BRM_irrawaddy_tiger:0 "The Irrawaddy Tiger"
 BRM_irrawaddy_tiger_desc:0 "Burma was once the richest land in Southeast Asia. With rice, oil, teak and gems, it can be again."
 BRM_stable_afpfl:0 "Ba Swe and the Stable AFPFL"
 BRM_stable_afpfl_desc:0 "When the AFPFL split, Ba Swe and Kyaw Nyein led the 'Stable' faction: socialists who want to build an industrial Burma through democratic planning."
 BRM_socialist_party:0 "The Burma Socialist Party"
 BRM_socialist_party_desc:0 "The Socialist Party, the backbone of the AFPFL, will turn its trade unions and peasant leagues into a modern mass party."
 BRM_trade_union_congress:0 "The Trade Union Congress"
 BRM_trade_union_congress_desc:0 "The Trade Union Congress (Burma) and the All-Burma Peasants' Organisation bring workers and farmers behind the government."
 BRM_industrial_development_corp:0 "Industrial Development Corporation"
 BRM_industrial_development_corp_desc:0 "Kyaw Nyein's state corporation will build steel, textiles, cement and pharmaceuticals."
 BRM_planned_industrialization:0 "Planned Industrialisation"
 BRM_planned_industrialization_desc:0 "Five-year plans approved by parliament, not dictated by generals."
 BRM_social_democratic_union:0 "A Social Democratic Union"
 BRM_social_democratic_union_desc:0 "Free elections and a planned economy: the Stable AFPFL's Burma shows that democracy and socialism can go together."
 BRM_talks_with_thakins:0 "Talks with the Thakins"
 BRM_talks_with_thakins_desc:0 "The Communists nearly reached Rangoon in 1949. Instead of fighting them to the end, why not bring them to the table?"
 BRM_unite_the_flags:0 "Unite the Red and White Flags"
 BRM_unite_the_flags_desc:0 "Thakin Soe's Red Flag and Thakin Than Tun's White Flag have quarrelled since 1946. United, they could sweep the country."
 BRM_peoples_revolution:0 "The People's Democratic Revolution"
 BRM_peoples_revolution_desc:0 "Rangoon falls to the revolution. Thakin Than Tun proclaims a People's Democracy."
 BRM_land_to_tiller:0 "Land to the Tiller"
 BRM_land_to_tiller_desc:0 "The Chettiar moneylenders' estates and the great landholdings are divided among the peasants."
 BRM_maoist_model:0 "The Chinese Model"
 BRM_maoist_model_desc:0 "Our comrades in Beijing fought a peasant war like ours. Mao's road is Burma's road."
 BRM_soviet_model:0 "The Soviet Model"
 BRM_soviet_model_desc:0 "Moscow has the factories, the engineers and the credit. Planned industry will lift Burma out of poverty."
 BRM_peoples_democratic_republic:0 "People's Democratic Republic of Burma"
 BRM_peoples_democratic_republic_desc:0 "The revolution is complete. The workers and peasants of every nationality rule the Golden Land."
 BRM_divided_world:0 "Burma in a Divided World"
 BRM_divided_world_desc:0 "Between Mao's China, India, the Western powers and Moscow, a small country has to choose its friends carefully."
 BRM_strict_neutrality:0 "Strict Neutrality"
 BRM_strict_neutrality_desc:0 "Burma refused to join SEATO and refused to take sides in the Cold War. Neutrality is our shield."
 BRM_pauk_phaw:0 "Pauk-Phaw Friendship"
 BRM_pauk_phaw_desc:0 "'Pauk-phaw' means kinsfolk. Burma was among the first countries to recognise the People's Republic of China. Close ties with our giant neighbour will keep us safe."
 BRM_western_partnership:0 "Western Partnership"
 BRM_western_partnership_desc:0 "Britain trained our army and America has money. Friendship with the West can rebuild what the war destroyed."
 BRM_moscow_friendship:0 "Friendship with Moscow"
 BRM_moscow_friendship_desc:0 "Khrushchev and Bulganin were cheered in Rangoon in 1955. The Soviet Union offers aid with few questions asked."
 BRM_bandung_spirit:0 "The Bandung Spirit"
 BRM_bandung_spirit_desc:0 "U Nu stood with Nehru, Sukarno and Zhou Enlai at Bandung in 1955. Asia and Africa will no longer be pawns."
 BRM_u_thant:0 "U Thant at the United Nations"
 BRM_u_thant_desc:0 "U Thant, a Burmese diplomat and former schoolteacher, became Secretary-General of the United Nations in 1961. The world listens when Burma speaks."
 BRM_southeast_asian_pact:0 "A Southeast Asian Pact"
 BRM_southeast_asian_pact_desc:0 "Neither SEATO nor the Warsaw Pact: a defensive league of the neutral states of Southeast Asia, led from Rangoon."
 BRM_boundary_treaty:0 "The Sino-Burmese Boundary Treaty"
 BRM_boundary_treaty_desc:0 "In 1960 Burma and China settled their long, undefined border peacefully, a rare success in Cold War Asia."
 BRM_chinese_aid:0 "Chinese Economic Aid"
 BRM_chinese_aid_desc:0 "A Chinese loan pays for textile mills, sugar refineries and bridges across the Irrawaddy and Salween."
 BRM_join_chinese_camp:0 "Brothers in Arms with Beijing"
 BRM_join_chinese_camp_desc:0 "Our kinsfolk to the north offer protection. We accept."
 BRM_japanese_reparations:0 "Japanese War Reparations"
 BRM_japanese_reparations_desc:0 "Under the treaty of 1954, Japan pays reparations in goods, machinery and engineering, paying back some of the ruin of 1942-45."
 BRM_american_arms:0 "American Military Aid"
 BRM_american_arms_desc:0 "The arms agreement of 1958 brings American rifles, trucks and training to the Tatmadaw."
 BRM_join_seato:0 "Join the Western Alliance"
 BRM_join_seato_desc:0 "Burma said no to SEATO in 1954. In this history Rangoon joins the Western camp."
 BRM_soviet_technical_aid:0 "Soviet Technical Aid"
 BRM_soviet_technical_aid_desc:0 "The new campus of the Rangoon Institute of Technology was a gift from the Soviet people. Soviet engineers will train our own."
 BRM_soviet_arms:0 "Soviet Arms Deliveries"
 BRM_soviet_arms_desc:0 "Soviet weapons arrive in Rangoon on easy credit."
 BRM_join_soviet_bloc:0 "Join the Socialist Camp"
 BRM_join_soviet_bloc_desc:0 "Burma takes its place beside Moscow in the socialist camp."
 BRM_rebuild_golden_land:0 "Rebuilding the Golden Land"
 BRM_rebuild_golden_land_desc:0 "The Second World War was fought across Burma twice. Rangoon is in ruins, the oil fields were blown up, and bridges and railways lie broken. Rebuilding starts now."
 BRM_rice_bowl:0 "The Rice Bowl of Asia"
 BRM_rice_bowl_desc:0 "Before the war Burma was the world's largest rice exporter. The State Agricultural Marketing Board will restore that trade."
 BRM_irrigation:0 "Irrawaddy Irrigation Works"
 BRM_irrigation_desc:0 "Canals, embankments and pumps will bring water to the dry zone of central Burma."
 BRM_land_reform:0 "Land Nationalisation"
 BRM_land_reform_desc:0 "The Land Nationalisation Act of 1948 promised to take land from absentee landlords and moneylenders and give it to the farmers who work it."
 BRM_agricultural_bank:0 "State Agricultural Bank"
 BRM_agricultural_bank_desc:0 "Cheap credit for farmers will break the grip of the moneylenders."
 BRM_fertilizer_plants:0 "Fertiliser Plants at Sale and Kyunchaung"
 BRM_fertilizer_plants_desc:0 "Natural gas from our own fields is turned into urea fertiliser, so the paddy fields grow more rice."
 BRM_green_revolution:0 "High-Yield Rice Varieties"
 BRM_green_revolution_desc:0 "New varieties of rice from the International Rice Research Institute double the harvest in the Delta."
 BRM_teak_board:0 "The State Timber Board"
 BRM_teak_board_desc:0 "Burma has most of the world's teak. The State Timber Board, founded in 1948, manages the forests and the timber trade."
 BRM_fisheries:0 "Andaman Sea Fisheries"
 BRM_fisheries_desc:0 "Fish and prawns from the Andaman Sea and the Delta feed the nation and earn foreign money."
 BRM_rangoon_port:0 "Port of Rangoon and the Irrawaddy Flotilla"
 BRM_rangoon_port_desc:0 "Rebuild the wharves of Rangoon and revive the river fleet that once carried goods up and down the Irrawaddy."
 BRM_railways:0 "Rebuild the Railways"
 BRM_railways_desc:0 "The Rangoon-Mandalay-Myitkyina line, cut in hundreds of places by war and sabotage, must run again."
 BRM_ava_bridge:0 "Bridges Across the Irrawaddy"
 BRM_ava_bridge_desc:0 "Rebuild the Ava Bridge, blown up in 1942, and build new bridges so that the two banks of the Irrawaddy become one economy."
 BRM_rural_roads:0 "Roads to Every Township"
 BRM_rural_roads_desc:0 "Feeder roads will let farmers bring their crops to market."
 BRM_expressway:0 "The Yangon-Mandalay Expressway"
 BRM_expressway_desc:0 "Opened in 2010, the expressway cuts the journey between the two great cities to a single day."
 BRM_electricity_board:0 "Electricity Supply Board"
 BRM_electricity_board_desc:0 "A single national board to plan and build power stations and transmission lines."
 BRM_baluchaung:0 "Baluchaung Hydropower Project"
 BRM_baluchaung_desc:0 "Built with Japanese reparations, the Lawpita falls power station in Karenni will light Rangoon and power its new factories."
 BRM_gas_power:0 "Gas-Fired Power Stations"
 BRM_gas_power_desc:0 "Our own natural gas will power the factories of Rangoon and Mandalay."
 BRM_rural_electrification:0 "Rural Electrification"
 BRM_rural_electrification_desc:0 "Light and power for the villages: schools that can open at night, and workshops in every township."
 BRM_yeywa_dam:0 "The Yeywa Dam"
 BRM_yeywa_dam_desc:0 "The country's largest hydropower plant, finished in 2010 on the Myitnge River."
 BRM_geological_survey:0 "Geological Survey of the Union"
 BRM_geological_survey_desc:0 "Before we can mine the hills, we need to know what lies under them."
 BRM_yenangyaung_oil:0 "The Yenangyaung Oil Fields"
 BRM_yenangyaung_oil_desc:0 "The Burmah Oil Company's wells at Yenangyaung and Chauk were wrecked in 1942. Rebuilt, they can supply the nation."
 BRM_mawchi_mine:0 "Reopen the Mawchi Mine"
 BRM_mawchi_mine_desc:0 "Before the war the Mawchi mine in Karenni was one of the richest tin and tungsten mines in the world."
 BRM_tenasserim_rubber:0 "Tenasserim Rubber Estates"
 BRM_tenasserim_rubber_desc:0 "The rubber plantations of Mon State and Tenasserim can be replanted and expanded."
 BRM_syriam_refinery:0 "The Syriam Oil Refinery"
 BRM_syriam_refinery_desc:0 "Rebuild the Syriam refinery near Rangoon, so we can refine our own crude oil."
 BRM_pinpet_iron:0 "The Pinpet Iron Ore Deposit"
 BRM_pinpet_iron_desc:0 "The iron ore deposit at Pinpet in Shan State can supply our own steel industry."
 BRM_mergui_tin:0 "Tin of Tenasserim"
 BRM_mergui_tin_desc:0 "The tin and tungsten mines along the Tenasserim coast can be reopened."
 BRM_monywa_copper:0 "The Monywa Copper Mines"
 BRM_monywa_copper_desc:0 "The copper deposits near Monywa are among the largest in Asia."
 BRM_jade_and_rubies:0 "Jade and Rubies"
 BRM_jade_and_rubies_desc:0 "The rubies of Mogok and the jade of Hpakant are famous around the world. Their revenues will fund the state."
 BRM_ywama_steel:0 "The Ywama Steel Mill"
 BRM_ywama_steel_desc:0 "A small steel mill near Rangoon is the first step towards heavy industry."
 BRM_state_industry:0 "State Industrial Corporations"
 BRM_state_industry_desc:0 "State-owned corporations will build the factories private capital will not."
 BRM_mixed_economy:0 "A Mixed Economy"
 BRM_mixed_economy_desc:0 "State planning for heavy industry, private enterprise for everything else."
 BRM_textile_mills:0 "The Thamaing Textile Mills"
 BRM_textile_mills_desc:0 "Burmese cotton spun and woven in Burmese mills. No more imported longyi cloth."
 BRM_pharmaceuticals:0 "Burma Pharmaceutical Industry"
 BRM_pharmaceuticals_desc:0 "The state pharmaceutical works will make the medicines the nation needs, from antimalarials to vaccines."
 BRM_cement_works:0 "The Thayetmyo Cement Works"
 BRM_cement_works_desc:0 "Cement for dams, bridges and factories."
 BRM_heavy_industries:0 "Heavy Industries Corporation"
 BRM_heavy_industries_desc:0 "Tractors, diesel engines and machine tools made in Burma."
 BRM_automobile_assembly:0 "Automobile Assembly"
 BRM_automobile_assembly_desc:0 "Assembly plants for Hino trucks and Mazda jeeps put Burmese vehicles on Burmese roads."
 BRM_industrial_zones:0 "Industrial Zones of Insein and Thamaing"
 BRM_industrial_zones_desc:0 "The spinning and weaving mills of Thamaing and the workshops of Insein become the core of a modern industrial district."
 BRM_electronics_assembly:0 "Export Factories"
 BRM_electronics_assembly_desc:0 "Garment and electronics factories in the industrial zones join Asia's supply chains."
 BRM_end_colonial_economy:0 "End the Colonial Economy"
 BRM_end_colonial_economy_desc:0 "No longer a supplier of rice, teak and oil for foreign empires: Burma now builds for itself."
 BRM_rangoon_university:0 "Rangoon University"
 BRM_rangoon_university_desc:0 "Rangoon University was the cradle of the independence movement. Well funded and free, it will produce the Union's scientists."
 BRM_rangoon_institute_tech:0 "Rangoon Institute of Technology"
 BRM_rangoon_institute_tech_desc:0 "A modern engineering school, the first in the country, to train the builders of the new Burma."
 BRM_atomic_energy_centre:0 "Union of Burma Atomic Energy Centre"
 BRM_atomic_energy_centre_desc:0 "Founded in 1955 to study the peaceful uses of atomic energy in medicine, farming and industry."
 BRM_regional_universities:0 "Mandalay and the Regional Universities"
 BRM_regional_universities_desc:0 "Mandalay University, independent from 1958, and new colleges in every state bring higher education to the whole Union."
 BRM_new_generation:0 "A New Generation"
 BRM_new_generation_desc:0 "The generation that won independence is growing old. New leaders, new problems and a changing world await the Union."
 BRM_crisis_of_1987:0 "The Crisis of 1987"
 BRM_crisis_of_1987_desc:0 "In September 1987 the government cancelled the 25, 35 and 75 kyat notes overnight, wiping out the savings of millions. Students are angry and the shops are empty."
 BRM_8888_uprising:0 "The 8888 Uprising"
 BRM_8888_uprising_desc:0 "On 8 August 1988 hundreds of thousands march for democracy across the country. The army must decide what to do."
 BRM_slorc:0 "The State Law and Order Restoration Council"
 BRM_slorc_desc:0 "On 18 September 1988 the army takes direct power again as SLORC. In 1989 the country's name becomes 'Myanmar' in English. The West answers with sanctions."
 BRM_8888_victory:0 "The People's Victory of 1988"
 BRM_8888_victory_desc:0 "The soldiers refuse to fire. Power passes peacefully to a transitional government, and Aung San Suu Kyi's National League for Democracy prepares for free elections."
 BRM_ceasefire_deals:0 "The Ceasefire Agreements"
 BRM_ceasefire_deals_desc:0 "From the United Wa State Army in 1989 to the Kachin Independence Organisation in 1994, one armed group after another agrees to stop fighting in return for local control."
 BRM_spdc:0 "The State Peace and Development Council"
 BRM_spdc_desc:0 "Senior General Than Shwe reorganises the junta as the SPDC in 1997 and plans a 'disciplined democracy'."
 BRM_naypyidaw:0 "Naypyidaw, the Abode of Kings"
 BRM_naypyidaw_desc:0 "In November 2005 the government moves to a new capital built in the middle of the country, far from the crowds of Yangon."
 BRM_constitution_2008:0 "The 2008 Constitution"
 BRM_constitution_2008_desc:0 "Approved in a referendum days after Cyclone Nargis, the new constitution creates the Republic of the Union of Myanmar, with a new flag and a quarter of parliament's seats kept for the army."
 BRM_thein_sein_reforms:0 "Thein Sein's Reforms"
 BRM_thein_sein_reforms_desc:0 "President Thein Sein surprises the world: political prisoners are freed, censorship ends, and the sanctions are lifted one by one."
 BRM_election_2015:0 "The 2015 General Election"
 BRM_election_2015_desc:0 "The National League for Democracy wins by a landslide, and the army accepts the result. The first civilian-led government in more than fifty years takes office."
 BRM_transition_holds:0 "The Transition Holds"
 BRM_transition_holds_desc:0 "There is no coup. The 2020 election result stands, and the generals and the elected government work out a slow, difficult partnership."
 BRM_state_administration_council:0 "The State Administration Council"
 BRM_state_administration_council_desc:0 "On 1 February 2021 the army arrests the elected leaders and seizes power. Strikes, protests and then armed resistance spread across the country."
 BRM_junta_elections:0 "The 2025-26 Elections"
 BRM_junta_elections_desc:0 "The military holds phased elections in December 2025 and January 2026 and hands power to a military-backed government. It hopes this will calm the country and end its isolation."
 BRM_federal_democracy_charter:0 "The Federal Democracy Charter"
 BRM_federal_democracy_charter_desc:0 "The National Unity Government and the ethnic armed organisations, strengthened by offensives such as Operation 1027, agree on a federal democratic union. In this history the army negotiates a handover."
 BRM_national_peace:0 "National Peace"
 BRM_national_peace_desc:0 "After years of war the guns finally fall silent. The Union starts to rebuild once more."
 BRM_1990_parliament:0 "The 1990 Parliament Convenes"
 BRM_1990_parliament_desc:0 "The NLD won more than 80 percent of the seats in the 1990 election. In this history, parliament actually meets."
 BRM_democratic_succession:0 "A Peaceful Succession"
 BRM_democratic_succession_desc:0 "Power passes peacefully to a new generation of elected leaders: the surest sign that Burmese democracy has taken root."
 BRM_second_generation_reforms:0 "Opening the Economy"
 BRM_second_generation_reforms_desc:0 "Controls on trade and foreign investment are relaxed, and the economy starts to grow faster."
 BRM_federal_constitution:0 "The Federal Constitution"
 BRM_federal_constitution_desc:0 "A new constitution makes Burma a true federation. Each state has its own parliament, its own laws and its own languages."
 BRM_socialist_camp_collapses:0 "The Socialist Camp Collapses"
 BRM_socialist_camp_collapses_desc:0 "The Berlin Wall has fallen, and Soviet aid is gone. The People's Democratic Republic must change or fall."
 BRM_market_socialism:0 "Market Socialism"
 BRM_market_socialism_desc:0 "Like Vietnam's Doi Moi, the Party keeps power but lets the market grow."
 BRM_multiparty_transition:0 "Multi-Party Transition"
 BRM_multiparty_transition_desc:0 "The Party gives up its monopoly and agrees to free elections."
 BRM_join_asean:0 "Join ASEAN"
 BRM_join_asean_desc:0 "In July 1997 Burma joins the Association of Southeast Asian Nations and takes its place among its neighbours."
 BRM_yadana_gas:0 "The Yadana and Yetagun Gas Fields"
 BRM_yadana_gas_desc:0 "Offshore gas from the Andaman Sea is piped to Thailand from 1998 and becomes the country's biggest export earner."
 BRM_shwe_gas:0 "The Shwe Gas Project"
 BRM_shwe_gas_desc:0 "Gas from the Shwe field off Rakhine flows to China through a new pipeline from 2013."
 BRM_kyaukphyu:0 "Kyaukphyu Deep-Sea Port"
 BRM_kyaukphyu_desc:0 "A deep-water port and economic zone on the Bay of Bengal, with Chinese money and Burmese terms."
 BRM_nargis_lessons:0 "Lessons of Cyclone Nargis"
 BRM_nargis_lessons_desc:0 "Cyclone Nargis killed about 140,000 people in the Delta in May 2008. Warning systems, shelters and stronger embankments must stop it happening again."
 BRM_mobile_revolution:0 "The Telecom Revolution"
 BRM_mobile_revolution_desc:0 "In 2014 a SIM card cost hundreds of dollars. Within two years it cost one or two. Tens of millions of people come online."
 BRM_thilawa_sez:0 "Thilawa Special Economic Zone"
 BRM_thilawa_sez_desc:0 "Built with Japan near Yangon and opened in 2015, Thilawa brings modern factories and jobs."
 BRM_myitsone_question:0 "The Myitsone Dam Question"
 BRM_myitsone_question_desc:0 "A giant Chinese-built dam at the source of the Irrawaddy is suspended in 2011 after nationwide protests. The people have been heard."
 BRM_nationwide_ceasefire:0 "The Nationwide Ceasefire Agreement"
 BRM_nationwide_ceasefire_desc:0 "Eight armed groups sign the Nationwide Ceasefire Agreement in October 2015."
 BRM_peace_conference:0 "The 21st Century Panglong Conference"
 BRM_peace_conference_desc:0 "In 2016 the leaders of the nationalities meet in Naypyidaw to finish the work Aung San began at Panglong in 1947."
 BRM_rakhine_commission:0 "The Rakhine Advisory Commission"
 BRM_rakhine_commission_desc:0 "Kofi Annan's commission of 2017 set out how to bring peace, development and equal citizenship to Rakhine State. In this history its recommendations are carried out."
 BRM_vision_2030:0 "Myanmar Vision 2030"
 BRM_vision_2030_desc:0 "A national plan for the next generation: power for every village, roads to every township, and factories that make things the world wants to buy."
 BRM_power_grid:0 "Irrawaddy-Mekong Power Grid"
 BRM_power_grid_desc:0 "Hydropower from the rivers and solar power from the dry zone feed a national grid that can export electricity to the region."
 BRM_digital_union:0 "The Digital Union"
 BRM_digital_union_desc:0 "Universities, software parks and research institutes put the Union at the front of Asia's digital economy."
 BRM_asean_leadership:0 "A Leading Voice in ASEAN"
 BRM_asean_leadership_desc:0 "Once the region's outcast, the Union now helps lead it."
 BRM_golden_land_reborn:0 "The Golden Land Reborn"
 BRM_golden_land_reborn_desc:0 "At peace, united and prosperous: the Golden Land has at last become what its founders dreamed of in 1948."
 # ---------- national spirits ----------
 BRM_federal_union:0 "Federal Union of Burma"
 BRM_federal_union_desc:0 "A Union of equal peoples, as promised at Panglong. The nationalities now defend it willingly."
 BRM_iron_union:0 "The Union Held by Force"
 BRM_iron_union_desc:0 "The Tatmadaw has crushed the rebellions. The Union is whole, and the army is its guardian."
 BRM_union_restored_spirit:0 "Pyidaungsu: The Union Restored"
 BRM_union_restored_spirit_desc:0 "For the first time since independence, the whole country is at peace."
 BRM_minority_trust:0 "Trust of the Nationalities"
 BRM_minority_trust_desc:0 "Kachin, Chin and Karen volunteers are coming forward to serve the Union."
 BRM_fragile_democracy:0 "A Fragile Democracy"
 BRM_fragile_democracy_desc:0 "Parliament sits in Rangoon, but factional quarrels and the civil war threaten it every day."
 BRM_fragile_democracy_2:0 "The Golden Land's Democracy"
 BRM_fragile_democracy_2_desc:0 "Burmese democracy has survived its hardest years and is stronger for it."
 BRM_democratic_socialism:0 "Democratic Planning"
 BRM_democratic_socialism_desc:0 "The Stable AFPFL plans the economy through parliament. Not everyone agrees with the plan."
 BRM_democratic_socialism_2:0 "Social Democratic Union"
 BRM_democratic_socialism_2_desc:0 "Free elections and a planned economy have built a modern Burma."
 BRM_military_rule:0 "The Revolutionary Council"
 BRM_military_rule_desc:0 "The army rules by decree. Order has been restored."
 BRM_burmese_way_spirit:0 "The Burmese Way to Socialism"
 BRM_burmese_way_spirit_desc:0 "Marxism, Buddhism and nationalism combined. The state controls the economy, though not always efficiently."
 BRM_burmese_way_2:0 "Socialist Republic of the Union of Burma"
 BRM_burmese_way_2_desc:0 "The one-party state is settled, and its early economic mistakes have been corrected."
 BRM_military_technocracy:0 "Military Technocracy"
 BRM_military_technocracy_desc:0 "The officers run the country like a company. Some of the old guard resent it."
 BRM_military_technocracy_2:0 "The Developmental State"
 BRM_military_technocracy_2_desc:0 "A disciplined government drives rapid growth from the top."
 BRM_peoples_democracy:0 "People's Democracy"
 BRM_peoples_democracy_desc:0 "The revolution has won, but the old classes are not yet reconciled to it."
 BRM_peoples_democracy_2:0 "People's Democratic Republic"
 BRM_peoples_democracy_2_desc:0 "The workers and peasants of every nationality stand behind the revolution."
 BRM_neutral_burma:0 "Strict Neutrality"
 BRM_neutral_burma_desc:0 "Burma takes no side in the Cold War."
 BRM_bandung_spirit_spirit:0 "The Bandung Spirit"
 BRM_bandung_spirit_spirit_desc:0 "Burma is a respected voice among the new nations of Asia and Africa."
 BRM_american_aid:0 "American Military Aid"
 BRM_american_aid_desc:0 "American equipment and advisers are strengthening the Tatmadaw."
 BRM_soviet_aid:0 "Soviet Technical Aid"
 BRM_soviet_aid_desc:0 "Soviet engineers and scientists are helping build up the country."
 BRM_rice_exports:0 "Rice Exports"
 BRM_rice_exports_desc:0 "Rice brings in the money that keeps the state running."
 BRM_rice_exports_2:0 "The Rice Bowl of Asia"
 BRM_rice_exports_2_desc:0 "Burma is once again the world's great rice exporter."
 BRM_gem_revenues:0 "Jade and Ruby Revenues"
 BRM_gem_revenues_desc:0 "Gem sales are filling the treasury."
 BRM_self_reliant_economy:0 "A Self-Reliant Economy"
 BRM_self_reliant_economy_desc:0 "Burma builds its own factories, power stations and machines."
 BRM_rangoon_university_spirit:0 "Rangoon University"
 BRM_rangoon_university_spirit_desc:0 "The best university in Southeast Asia trains the Union's scientists and engineers."
 BRM_jungle_fighters:0 "Light Infantry Doctrine"
 BRM_jungle_fighters_desc:0 "The Tatmadaw is trained for the jungles and hills of Burma."
 BRM_jungle_fighters_2:0 "Masters of Jungle Warfare"
 BRM_jungle_fighters_2_desc:0 "Few armies in the world fight better in the jungle."
 BRM_militias:0 "People's Militias"
 BRM_militias_desc:0 "Village militias hold the countryside."
 BRM_modern_tatmadaw_spirit:0 "A Modern Tatmadaw"
 BRM_modern_tatmadaw_spirit_desc:0 "A trained, well-armed and confident national army."
 # ---------- leaders ----------
 BRM_brigadier_aung_gyi:0 "Aung Gyi"
 BRM_ba_swe:0 "Ba Swe"
 BRM_thakin_than_tun:0 "Thakin Than Tun"
 # ---------- faction / opinion / tech bonus names ----------
 BRM_sea_pact_faction:0 "Southeast Asian Pact"
 BRM_pauk_phaw_opinion:0 "Pauk-Phaw Friendship"
 BRM_western_friend:0 "Western Partnership"
 BRM_soviet_friend:0 "Friendship with Moscow"
 BRM_respected_neutral:0 "Respected Neutral"
 BRM_regional_partner:0 "Regional Partner"
 BRM_technocrats:0 "Technocrat Ministries"
 BRM_social_democracy:0 "A Social Democratic Union"
 BRM_ywama:0 "The Ywama Steel Mill"
 BRM_end_colonial:0 "End the Colonial Economy"
 # ---------- later eras ----------
 BRM_international_isolation:0 "International Isolation"
 BRM_international_isolation_desc:0 "Western sanctions cut the country off from investment, technology and trade."
 BRM_spring_revolution:0 "The Spring Revolution"
 BRM_spring_revolution_desc:0 "Since the 2021 coup, strikes, the People's Defence Forces and the ethnic armed organisations have fought the military across much of the country."
 BRM_spring_revolution_2:0 "A Fragile Calm"
 BRM_spring_revolution_2_desc:0 "The fighting has died down, but the country is still deeply divided."
 BRM_democratic_opening:0 "Democratic Opening"
 BRM_democratic_opening_desc:0 "A free press, free elections and the energy of a society that can finally speak."
 BRM_democratic_opening_2:0 "A Mature Democracy"
 BRM_democratic_opening_2_desc:0 "Burmese democracy has survived its hardest test."
 BRM_federal_democracy:0 "Federal Democratic Union"
 BRM_federal_democracy_desc:0 "Every nationality governs itself inside one Union, as was promised at Panglong."
 BRM_union_secured:0 "Order Restored"
 BRM_union_secured_desc:0 "The long war is over and the state works again."
 BRM_asean_member:0 "ASEAN Member"
 BRM_asean_member_desc:0 "Trade and investment flow in from our Southeast Asian neighbours."
 BRM_telecom_revolution:0 "The Telecom Revolution"
 BRM_telecom_revolution_desc:0 "Tens of millions of Burmese are online for the first time."
 BRM_vision_2030_spirit:0 "Myanmar Vision 2030"
 BRM_vision_2030_spirit_desc:0 "A national development plan for the next generation."
 BRM_golden_land_reborn_spirit:0 "The Golden Land Reborn"
 BRM_golden_land_reborn_spirit_desc:0 "At peace, united and prosperous: the dream of 1948 has come true."
 BRM_saw_maung:0 "Saw Maung"
 BRM_than_shwe:0 "Than Shwe"
 BRM_thein_sein:0 "Thein Sein"
 BRM_aung_san_suu_kyi:0 "Aung San Suu Kyi"
 BRM_min_aung_hlaing:0 "Min Aung Hlaing"
 BRM_duwa_lashi_la:0 "Duwa Lashi La"
 # ---------- Myanmar name (from the 2008 Constitution focus) ----------
 # ---------- expanded military / economy ----------
 BRM_peoples_war_spirit:0 "People's War"
 BRM_peoples_war_spirit_desc:0 "Every village is ready to defend the Union."
 BRM_conventional_spirit:0 "Conventional Defence"
 BRM_conventional_spirit_desc:0 "A professional army that can meet an invader at the border."
 BRM_national_service_spirit:0 "National Service"
 BRM_national_service_spirit_desc:0 "Every young citizen serves the Union."
 BRM_volunteer_army_spirit:0 "All-Volunteer Army"
 BRM_volunteer_army_spirit_desc:0 "Well-paid volunteers who chose to serve."
 BRM_air_force_spirit:0 "A Modern Air Force"
 BRM_air_force_spirit_desc:0 "Trained pilots, modern aircraft and proper bases."
 BRM_navy_spirit:0 "A Navy for the Bay of Bengal"
 BRM_navy_spirit_desc:0 "A sea-going navy that guards the coast and the offshore gas fields."
 BRM_rice_exports_3:0 "Green Revolution in the Paddy Fields"
 BRM_rice_exports_3_desc:0 "High-yield rice has doubled the harvest."
 BRM_teak_exports:0 "Burma Teak"
 BRM_teak_exports_desc:0 "The finest teak in the world earns money for the nation."
 BRM_cement_boom:0 "Cement Boom"
 BRM_cement_boom_desc:0 "Plenty of cement means construction goes faster everywhere."
 BRM_university_network_spirit:0 "A Network of Universities"
 BRM_university_network_spirit_desc:0 "Universities in every state train the Union's scientists."
 BRM_research_grants:0 "Research Grants"
 BRM_research_grants_desc:0 "State money is funding the universities and research institutes."

 # ---------- Iron Curtain Burma spirits (pictured copies, same effects) ----------
 BRM_civil_strife_1:0 "Internal Conflict"
 BRM_civil_strife_1_desc:0 "Communists, Karen and Mon insurgents, mutinous army units and the People's Volunteer Organisation are all in arms against Rangoon. The government controls little beyond the cities."
 BRM_civil_strife_2:0 "Internal Conflict"
 BRM_civil_strife_2_desc:0 "The worst of the fighting is over, but the insurgents still hold large parts of the hills and the Delta."
 BRM_civil_strife_3:0 "Internal Conflict"
 BRM_civil_strife_3_desc:0 "Only scattered rebel bands remain. Peace is within reach."
 BRM_kmt_tension_3:0 "Kuomintang Tensions"
 BRM_kmt_tension_3_desc:0 "Thousands of General Li Mi's Nationalist Chinese troops occupy eastern Shan State, refuse to disarm and live off the opium trade."
 BRM_kmt_tension_2:0 "Kuomintang Tensions"
 BRM_kmt_tension_2_desc:0 "Some of the Kuomintang troops have been evacuated, but many remain in the hills near the Thai and Lao borders."
 BRM_kmt_tension_1:0 "Kuomintang Tensions"
 BRM_kmt_tension_1_desc:0 "Only small Kuomintang bands remain, but they still smuggle opium across the border."
 BRM_military_dysfunction:0 "Military Dysfunction"
 BRM_military_dysfunction_desc:0 "Mutinies, desertions and the loss of the Karen battalions have left the Tatmadaw disorganised and short of officers."
 BRM_military_dysfunction_2:0 "Recovering Army"
 BRM_military_dysfunction_2_desc:0 "The army is being rebuilt with new officers and new training, but it is not yet back to full strength."
 BRM_golden_land_heritage:0 "Heritage of the Golden Land"
 BRM_golden_land_heritage_desc:0 "Theravada Buddhism, the memory of the Konbaung kings and the struggle for independence bind the people together, even in hard times."
 # ---------- economy tooltips ----------
 BRM_economy_step_up_tt:0 "Moves the economy one step away from §YFeudalism§! (Early → Developed → Late Feudalism → a modern economy)."
 BRM_economy_leave_feudalism_tt:0 "If Burma is still feudal, its economy becomes a §Ymodern economy§!."
