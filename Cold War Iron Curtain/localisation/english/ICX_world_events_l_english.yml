l_english:
 icxw.15.t:0 "The Rice Premium"
 icxw.15.d:0 "Rice is Thailand's main export, and since the war the government has taken a cut of every ton sold abroad: the 'rice premium'. It keeps rice cheap in Bangkok and fills the treasury, but farmers say they are the ones who really pay it, in low prices at the mill. The Ministry of Commerce wants to raise it again."
 icxw.15.a:0 "Raise the premium"
 icxw.15.b:0 "Leave it as it is"
 icxw.15.c:0 "Cut it to help the farmers"
 icxw.1.t:0 "The First National Development Plan"
 icxw.1.d:0 "On World Bank advice, the government has set up a National Economic Development Board, and its young economists have drafted Thailand's first six-year plan. The state will build roads, dams and power lines; private business, Thai and foreign, is expected to build the factories. Some ministers would rather keep the state enterprises in charge."
 icxw.1.a:0 "Roads and dams by the state, factories by business"
 icxw.1.b:0 "Keep the state enterprises in charge"
 icxw.14.t:0 "The Great Dam at Yanhee"
 icxw.14.d:0 "The dam on the Ping River at Yanhee, built with a World Bank loan, is finished: 154 metres of concrete, a reservoir that can water the central plains in the dry season, and turbines that will light up Bangkok. It will carry the King's name."
 icxw.14.a:0 "Water for the farmers first"
 icxw.14.b:0 "Power for industry first"
 icxw.2.t:0 "ASEAN Is Born in Bangkok"
 icxw.2.d:0 "Our foreign minister has invited his colleagues from Indonesia, Malaysia, the Philippines and Singapore to Bangkok. After informal talks at the seaside resort of Bang Saen, they are ready to sign a declaration founding an Association of Southeast Asian Nations: for economic growth, for peace in the region and, quietly, for a common front against communism."
 icxw.2.a:0 "Sign the Bangkok Declaration"
 icxw.2.b:0 "Keep our hands free"
 icxw.3.t:0 "The Fourteenth of October"
 icxw.3.d:0 "The arrest of thirteen activists for handing out leaflets that called for a constitution has brought hundreds of thousands of people, most of them students, to the Democracy Monument. On the morning of 14 October police and soldiers opened fire near the palace. By evening Bangkok is in uproar, and the army commander refuses to send in more troops. The leaders of the government must decide what to do."
 icxw.3.a:0 "Step down and leave the country"
 icxw.3.b:0 "Order the army to clear the streets"
 icxw.4.t:0 "Gas from the Gulf"
 icxw.4.d:0 "Natural gas from the Erawan field, found by an American company in the Gulf of Thailand, now comes ashore at Map Ta Phut through a pipeline under the sea. Planners want to use it for an 'Eastern Seaboard' of ports, petrochemical plants and industrial estates, so that Bangkok is no longer the only place where industry can grow. The finance ministry worries about the cost while interest rates are so high."
 icxw.4.a:0 "Build the Eastern Seaboard"
 icxw.4.b:0 "Just burn the gas in power stations"
 icxw.5.t:0 "Visit Thailand Year"
 icxw.5.d:0 "For the King's sixtieth birthday, the Tourism Authority has named 1987 'Visit Thailand Year'. Posters of temples and beaches hang in travel agencies from Tokyo to Frankfurt, and for the first time more than three million foreign visitors are expected. New hotels are rising along the beaches of Pattaya and Phuket."
 icxw.5.a:0 "Spend on the campaign, the roads and the airports"
 icxw.5.b:0 "Let the private sector handle it"
 icxw.6.t:0 "Battlefields into Marketplaces"
 icxw.6.d:0 "The government wants to turn Indochina 'from a battlefield into a marketplace'. Thai traders are already crossing the Mekong to do business in Laos and buying timber and gems in Cambodia's border provinces. The army, which has faced Vietnamese troops along the border for a decade, is not convinced."
 icxw.6.a:0 "Open the borders to trade"
 icxw.6.b:0 "Keep up the pressure on Vietnam"
 icxw.7.t:0 "Black May"
 icxw.7.d:0 "A general who led last year's coup has made himself Prime Minister without standing for election. Hundreds of thousands have gathered at Sanam Luang and along Ratchadamnoen Avenue, many of them office workers with mobile phones: the 'mobile phone mob'. Troops have opened fire and dozens are dead. Only an intervention from the palace seems able to stop the killing."
 icxw.7.a:0 "The general must go; appoint a civilian government"
 icxw.7.b:0 "Restore order at any cost"
 icxw.8.t:0 "The Bangkok International Banking Facility"
 icxw.8.d:0 "The Bank of Thailand wants Bangkok to rival Singapore and Hong Kong as a financial centre. Under a new scheme, licensed banks could borrow dollars abroad and lend them at home with few controls. With the baht fixed to the dollar, cheap foreign money would pour into property and factories. A few economists warn that money which arrives quickly can leave even faster."
 icxw.8.a:0 "Open the facility"
 icxw.8.b:0 "Keep the capital controls"
 icxw.9.t:0 "The Tom Yum Kung Crisis"
 icxw.9.d:0 "Speculators have bet billions against the baht, and the central bank has spent almost all its reserves defending it. On 2 July the government gives up and lets the baht float; it loses half its value within months. The foreign loans that built Bangkok's towers now cost twice as much to repay. Finance companies are collapsing, and the crisis is spreading to Indonesia, Malaysia and South Korea. The IMF offers a rescue, on its own conditions."
 icxw.9.a:0 "Accept the IMF package and its conditions"
 icxw.9.b:0 "Rescue the banks ourselves"
 icxw.10.t:0 "The Asian Crisis Reaches Us"
 icxw.10.d:0 "Across the region currencies are collapsing as foreign money flees. Because our banks never borrowed heavily abroad, the panic reaches us later and weaker than it has elsewhere. Still, exports are falling and some factories are closing."
 icxw.10.a:0 "Ride it out"
 icxw.10.b:0 "Cut interest rates and spend"
 icxw.11.t:0 "Thirty Baht for Any Illness"
 icxw.11.d:0 "The new government promised voters that a visit to a public hospital would cost just thirty baht, whatever the illness, and that every village would get a revolving fund of one million baht. The poor of the North and the North-East are delighted; the finance ministry and the doctors are worried about the bill."
 icxw.11.a:0 "Keep the promises"
 icxw.11.b:0 "Scale the schemes back"
 icxw.12.t:0 "The Wave"
 icxw.12.d:0 "An earthquake off Sumatra has sent a tsunami across the Indian Ocean. It struck our Andaman coast without warning: in Phang Nga, Phuket and Krabi more than five thousand people are dead, many of them foreign tourists, and thousands more are missing. Offers of help are arriving from all over the world."
 icxw.12.a:0 "Accept the help and rebuild quickly"
 icxw.12.b:0 "We can manage on our own"
 icxw.13.t:0 "The Great Flood"
 icxw.13.d:0 "Months of monsoon rain have overwhelmed the dams and dykes of the Chao Phraya basin. Seven great industrial estates around Ayutthaya and Pathum Thani are under two metres of water, cutting the world's supply of computer hard disks and stopping car factories as far away as America. The water is moving south towards Bangkok."
 icxw.13.a:0 "Sacrifice the outskirts to save central Bangkok"
 icxw.13.b:0 "Open the floodgates and share the damage"
 icxw.20.t:0 "The Price of the Kip"
 icxw.20.d:0 "American aid pays for almost everything the Royal Government does, but much of it is lost to a racket: importers buy dollars cheaply at the official rate, sell the goods, or simply the dollars, at three times the price in Bangkok, and keep the difference. Washington is threatening to cut the aid unless the kip is devalued to a realistic rate."
 icxw.20.a:0 "Devalue the kip"
 icxw.20.b:0 "Keep the old rate"
 icxw.21.t:0 "The Nam Ngum Dam"
 icxw.21.d:0 "With money from a group of foreign donors, a dam has closed the Nam Ngum river north of Vientiane. Its turbines produce far more electricity than Laos can use. Thailand's electricity board is ready to buy the surplus and pay in hard currency, every month, war or no war."
 icxw.21.a:0 "Sell the power to Thailand"
 icxw.21.b:0 "Keep it for our own towns"
 icxw.22.t:0 "The Seventh Resolution"
 icxw.22.d:0 "Four years after the revolution, the cooperatives are failing, rice is short and tens of thousands of people have fled across the Mekong. The Party's Central Committee is debating a change of course: let farmers leave the cooperatives, allow private trade and pay market prices for rice."
 icxw.22.a:0 "Relax the controls"
 icxw.22.b:0 "Press on with collectivisation"
 icxw.23.t:0 "The Foreign Investment Law"
 icxw.23.d:0 "Soviet aid is drying up as Moscow turns to its own troubles. A new law would let foreign companies own businesses in Laos outright, with tax holidays for those who build factories or hotels. Thai, Chinese and Vietnamese businessmen are waiting to see what we decide."
 icxw.23.a:0 "Pass the law"
 icxw.23.b:0 "Only joint ventures with the state"
 icxw.24.t:0 "The Friendship Bridge"
 icxw.24.d:0 "The first bridge across the Mekong, paid for by Australia, opens between Vientiane and Nong Khai. For the first time lorries can drive from Bangkok into Laos. Thai goods will flood our markets, but our own exports could reach the sea through Thai ports."
 icxw.24.a:0 "Open the border to trade"
 icxw.24.b:0 "Control what crosses"
 icxw.25.t:0 "Joining ASEAN"
 icxw.25.d:0 "Laos and Myanmar have been invited to join the Association of Southeast Asian Nations this July. Membership means lower tariffs, officials sent to hundreds of meetings and a seat at the table with neighbours we have fought and traded with for centuries."
 icxw.25.a:0 "Join ASEAN"
 icxw.25.b:0 "Not yet"
 icxw.26.t:0 "The Kip Collapses"
 icxw.26.d:0 "The Asian crisis has reached Laos through Thailand, our biggest trading partner. The kip has lost two-thirds of its value in a year, and prices in the markets of Vientiane rise every week. Inflation could pass one hundred percent."
 icxw.26.a:0 "Print money to pay the state's bills"
 icxw.26.b:0 "Cut spending and tighten credit"
 icxw.27.t:0 "Nam Theun 2"
 icxw.27.d:0 "The World Bank has agreed to back a giant dam on the Nam Theun river, built by a French-led company. It would sell almost all its power to Thailand and pay Laos a share of the profits for twenty-five years. About six thousand villagers on the Nakai plateau must be moved, and foreign campaigners are watching closely."
 icxw.27.a:0 "Build it, with the World Bank's safeguards"
 icxw.27.b:0 "Too risky: find other projects"
 icxw.28.t:0 "The Southeast Asian Games"
 icxw.28.d:0 "For the first time, Vientiane hosts the Southeast Asian Games. China has built us a new national stadium, in return for a large plot of land at the That Luang marsh for Chinese developers. Athletes from ten nations are arriving."
 icxw.28.a:0 "A festival for the whole nation"
 icxw.28.b:0 "Keep it modest"
 icxw.29.t:0 "Joining the WTO"
 icxw.29.d:0 "After fifteen years of negotiations, Laos is to be admitted to the World Trade Organization. We must cut tariffs and open more of the economy to foreign firms, but our exports will be treated the same as everyone else's."
 icxw.29.a:0 "Embrace the rules"
 icxw.29.b:0 "Use every exemption we can"
 icxw.30.t:0 "Bombs from a Secret War"
 icxw.30.d:0 "The first American president to visit Laos has acknowledged that the United States dropped more than two million tons of bombs on our country between 1964 and 1973, and that up to a third of the cluster bomblets never exploded. Farmers are still killed and maimed every year. He has pledged ninety million dollars over three years to clear them."
 icxw.30.a:0 "Welcome the help"
 icxw.30.b:0 "Words are not enough"
 icxw.31.t:0 "The Dam Collapse in Attapeu"
 icxw.31.d:0 "After days of heavy rain, a saddle dam of the unfinished Xe-Pian Xe-Namnoy hydropower project in Attapeu has collapsed. A wall of water swept through the villages downstream: dozens are dead and thousands homeless. Questions are being asked about the builders, and about the dozens of other dams under construction."
 icxw.31.a:0 "Halt new dams for a safety review"
 icxw.31.b:0 "Keep building: we need the power exports"
 icxw.32.t:0 "The Laos-China Railway"
 icxw.32.d:0 "A modern railway now runs 422 kilometres from the Chinese border at Boten to Vientiane, through 75 tunnels and over 167 bridges. A trip that took two days by road takes four hours. But the joint venture's debts, nearly six billion dollars, are owed largely to Chinese banks."
 icxw.32.a:0 "Build logistics parks along the line"
 icxw.32.b:0 "Renegotiate the debts first"
 icxw.33.t:0 "The Debt Crisis"
 icxw.33.d:0 "Public debt has passed ninety percent of the economy, much of it owed to China. With fuel prices soaring, the kip has lost a third of its value this year and inflation is above twenty percent and rising. The credit agencies are warning of default."
 icxw.33.a:0 "Ask China for more time"
 icxw.33.b:0 "Cut spending sharply"
 icxw.40.t:0 "The Rubber-Rice Pact"
 icxw.40.d:0 "Rubber prices have collapsed since the Korean War boom ended, and rice is scarce and dear. China offers a five-year deal: Chinese rice for our rubber, at prices far better than the market's. Washington warns that selling rubber, a strategic material, to China would break its embargo and could cost us American aid."
 icxw.40.a:0 "Sign the pact"
 icxw.40.b:0 "Stay with our Western partners"
 icxw.41.t:0 "The Hartal"
 icxw.41.d:0 "To balance the budget, the government has cut the rice subsidy: a measure of ration rice now costs 70 cents instead of 25. The parties of the left have called a hartal, a stoppage of all work and trade. Shops are shut, the trains have stopped and police have fired on crowds; several people have been killed. Ministers are meeting aboard a British warship in Colombo harbour."
 icxw.41.a:0 "Restore the subsidy"
 icxw.41.b:0 "Hold firm"
 icxw.42.t:0 "The Language Question"
 icxw.42.d:0 "The new government came to power promising to make Sinhala, the language of about seventy percent of the people, the only official language in place of English. Tamil leaders say this will shut their people out of government jobs and are holding a peaceful protest on Galle Face Green. A mob has attacked them, and there is violence in the east."
 icxw.42.a:0 "Pass the Sinhala Only Act"
 icxw.42.b:0 "Sinhala, with reasonable use of Tamil"
 icxw.44.t:0 "Nationalising the Oil Companies"
 icxw.44.d:0 "The new Ceylon Petroleum Corporation has begun taking over the petrol stations and depots of Shell, Esso and Caltex, so that we can buy cheaper oil from the Soviet Union and Romania. The American government says that, under its own law, aid to Ceylon must stop unless the companies are paid fair compensation."
 icxw.44.a:0 "Take over the companies"
 icxw.44.b:0 "Take them over, but pay compensation"
 icxw.44.c:0 "Leave the companies alone"
 icxw.45.t:0 "The April Insurrection"
 icxw.45.d:0 "Thousands of young, educated and jobless Sinhalese, organised by the Janatha Vimukthi Peramuna, have attacked more than ninety police stations in a single night. Whole districts in the south and centre are in rebel hands. Our army is small and short of ammunition; India, Britain, the Soviet Union and others have offered help."
 icxw.45.a:0 "Accept help from everyone"
 icxw.45.b:0 "Crush it ourselves"
 icxw.46.t:0 "A Republic Called Sri Lanka"
 icxw.46.d:0 "A Constituent Assembly has written a new constitution. Ceylon is to become the Republic of Sri Lanka, cutting its last legal ties to the British crown. The new constitution gives Buddhism 'the foremost place' while promising freedom of religion to all."
 icxw.46.a:0 "Proclaim the republic"
 icxw.46.b:0 "Wait for broader agreement"
 icxw.47.t:0 "Nationalising the Estates"
 icxw.47.d:0 "Tea and rubber still earn most of our foreign exchange, and many of the biggest estates belong to companies in London. A new land reform law would hand them to state corporations. Supporters say the profits will finally stay in Sri Lanka; planters warn that state managers will let the tea bushes grow old."
 icxw.47.a:0 "Take over the estates"
 icxw.47.b:0 "Leave them with their owners"
 icxw.48.t:0 "The Open Economy"
 icxw.48.d:0 "After years of rationing, import controls and queues, the new government wants to open up: let the rupee find its own value, end most import licences, limit the food subsidy to the poorest half of the people and invite foreign investors into a free trade zone near the airport at Katunayake."
 icxw.48.a:0 "Open the economy"
 icxw.48.b:0 "Go slowly"
 icxw.49.t:0 "The Accelerated Mahaweli Programme"
 icxw.49.d:0 "The Mahaweli, our longest river, was to be dammed and diverted over thirty years. The government now wants to do it in six: great dams at Victoria, Kotmale, Randenigala and elsewhere, paid for by Britain, Sweden, West Germany and other donors, to water the dry zone, settle hundreds of thousands of families and double our electricity."
 icxw.49.a:0 "Build all the dams at once"
 icxw.49.b:0 "Build them one at a time"
 icxw.50.t:0 "The Wave"
 icxw.50.d:0 "A tsunami has struck two-thirds of our coastline, from Jaffna round to Galle. More than thirty thousand people are dead and hundreds of thousands homeless; a train full of passengers was swept away near Peraliya. Aid is pouring in, and the question now is how to share it fairly between all our communities."
 icxw.50.a:0 "Share the aid through a joint body with all communities"
 icxw.50.b:0 "The government will handle all aid"
 icxw.51.t:0 "The Port at Hambantota"
 icxw.51.d:0 "The new port at Hambantota, built with Chinese loans, sees only a few ships a month and cannot pay its debts. A Chinese state company offers 1.1 billion dollars for a seventy percent stake and a 99-year lease. India and the United States fear a Chinese naval base in the Indian Ocean."
 icxw.51.a:0 "Sign the lease"
 icxw.51.b:0 "Look for other partners"
 icxw.52.t:0 "Organic Overnight"
 icxw.52.d:0 "To save foreign exchange, and, it says, to make our farming healthier, the government has banned chemical fertilisers and pesticides overnight. Tea planters say their yields will fall by a third or more; rice farmers are protesting in the fields."
 icxw.52.a:0 "Stay the course"
 icxw.52.b:0 "Lift the ban"
 icxw.53.t:0 "The Default"
 icxw.53.d:0 "The reserves are gone. There are queues for petrol miles long, power cuts of thirteen hours a day and no money to import medicines. On 12 April the government announces that it will stop paying its foreign debts, the first default in the country's history. Protesters are camped at Galle Face, demanding that the leadership go home."
 icxw.53.a:0 "Go to the IMF"
 icxw.53.b:0 "Seek emergency credit from India and China"
 icxw.60.t:0 "The Easter Devaluation"
 icxw.60.d:0 "On the Saturday before Easter, the Bank of Mexico has cut the peso from 8.65 to 12.50 to the dollar. Imports are dearer overnight and workers are angry, but the finance ministry says the new rate can be held for many years, and that steady prices, cheap credit for industry and a stable peso can build a modern economy."
 icxw.60.a:0 "Stabilising development"
 icxw.60.b:0 "Raise wages to compensate"
 icxw.63.t:0 "The Free Textbook"
 icxw.63.d:0 "A new National Commission for Free Textbooks will print a book for every primary pupil in the country, rich or poor, in the cities or in the most remote village. The Church and some parents object that the state will decide what every child learns."
 icxw.63.a:0 "A free book for every child"
 icxw.63.b:0 "Make them optional"
 icxw.61.t:0 "The Railway Strike"
 icxw.61.d:0 "The railway workers' union, led by Demetrio Vallejo, won large pay rises last year through a series of strikes. Now it has called another strike in the middle of Holy Week, and trains across the country have stopped. The government calls it a communist plot against the state."
 icxw.61.a:0 "Send in the army and arrest the leaders"
 icxw.61.b:0 "Negotiate with the union"
 icxw.62.t:0 "The Electricity Is Ours"
 icxw.62.d:0 "The government has bought out the two foreign companies that supplied most of Mexico's electricity, American and Foreign Power and the Mexican Light and Power Company. 'The electricity is ours!' say the newspapers. Now the network must be extended to the villages."
 icxw.62.a:0 "Electrify the countryside"
 icxw.62.b:0 "Run it for profit first"
 icxw.64.t:0 "The Maquiladoras"
 icxw.64.d:0 "The end of the American bracero programme has left hundreds of thousands of farm workers without jobs along the northern border. A new Border Industrialisation Programme would let foreign factories bring in parts duty-free, assemble them in Mexico and send the finished goods back north."
 icxw.64.a:0 "Open the border factories"
 icxw.64.b:0 "Protect Mexican industry"
 icxw.65.t:0 "Mexico 68"
 icxw.65.d:0 "The Games of the XIX Olympiad have opened in Mexico City, the first ever held in Latin America. The world sees a new Olympic stadium, a metro being dug under the capital and, in the thin air at 2,240 metres, a long jump by Bob Beamon of almost nine metres. Not everyone is celebrating: many students say the money should have gone to schools."
 icxw.65.a:0 "Show the world a modern Mexico"
 icxw.65.b:0 "Keep the spending small"
 icxw.66.t:0 "The Peso Floats"
 icxw.66.d:0 "For twenty-two years the peso stood at 12.50 to the dollar. Now, after years of heavy borrowing and spending, the government can no longer hold it. On 31 August the peso is allowed to float, and it quickly loses nearly half its value. The IMF offers credit if spending is cut."
 icxw.66.a:0 "Accept the IMF programme"
 icxw.66.b:0 "Spend our way out"
 icxw.67.t:0 "Administering Abundance"
 icxw.67.d:0 "Pemex has confirmed that the Cantarell field in the Bay of Campeche is one of the largest in the world. The President tells Mexicans that the country's problem is no longer poverty, but how to 'administer abundance'. Banks in New York are lining up to lend against the oil."
 icxw.67.a:0 "Borrow and build, now"
 icxw.67.b:0 "Develop the oil carefully"
 icxw.68.t:0 "Ixtoc I"
 icxw.68.d:0 "An exploratory well, Ixtoc I, has blown out in the Bay of Campeche and caught fire. Oil is pouring into the sea by the thousands of barrels a day, and the slick is drifting north towards the beaches of Texas. Pemex says it will take months to drill relief wells."
 icxw.68.a:0 "Spare no cost to stop it"
 icxw.68.b:0 "Keep pumping elsewhere and refuse liability"
 icxw.69.t:0 "The Debt Crisis"
 icxw.69.d:0 "Oil prices are falling and American interest rates are near twenty percent. The finance minister has told Washington that Mexico cannot pay the interest on its eighty billion dollars of foreign debt. Money is fleeing the country, and the President is weighing a dramatic answer: nationalise the banks and impose exchange controls."
 icxw.69.a:0 "Nationalise the banks"
 icxw.69.b:0 "Turn to the IMF"
 icxw.70.t:0 "The Earthquake"
 icxw.70.d:0 "At 7:19 in the morning an earthquake of magnitude 8.1 has struck Mexico City. Hospitals, schools and blocks of flats have collapsed, and thousands are dead. While the government hesitates, students, neighbours and volunteers are digging through the rubble with their bare hands."
 icxw.70.a:0 "Accept foreign aid and work with the volunteers"
 icxw.70.b:0 "Mexico will rebuild by itself"
 icxw.71.t:0 "Joining GATT"
 icxw.71.d:0 "Six years ago Mexico refused to join the General Agreement on Tariffs and Trade. Now, with oil prices collapsing and the debt still unpaid, the government wants to sell manufactured goods abroad instead of oil. Joining would mean cutting the tariffs that have protected Mexican industry for forty years."
 icxw.71.a:0 "Join GATT"
 icxw.71.b:0 "Stay protected"
 icxw.72.t:0 "Selling Telmex"
 icxw.72.d:0 "The state telephone company has a waiting list of years for a new line. The government plans to sell control of it to a group led by the businessman Carlos Slim with American and French partners. The sale would bring in almost two billion dollars, and turn a state monopoly into a private one."
 icxw.72.a:0 "Sell Telmex"
 icxw.72.b:0 "Keep it public and invest"
 icxw.73.t:0 "The December Mistake"
 icxw.73.d:0 "A small devaluation of the peso has turned into a stampede. Investors holding short-term government bonds, payable in dollars, are pulling out; the peso has lost half its value, and the government will run out of dollars within weeks. The United States is preparing a rescue of fifty billion dollars together with the IMF."
 icxw.73.a:0 "Accept the American rescue"
 icxw.73.b:0 "Impose capital controls"
 icxw.74.t:0 "The Energy Reform"
 icxw.74.d:0 "For seventy-five years, since the expropriation of the foreign oil companies in 1938, Pemex alone has owned Mexico's oil. Production is falling as the old fields run dry, and Pemex lacks the money to drill in deep water. The government proposes to change the constitution and let private companies explore and produce oil again."
 icxw.74.a:0 "Open the oil industry"
 icxw.74.b:0 "Pemex stays ours alone"
 icxw.80.t:0 "SUDENE"
 icxw.80.d:0 "The great drought of 1958 drove hundreds of thousands of families off their land in the sertao. The economist Celso Furtado has persuaded the President to create a Superintendency for the Development of the Northeast, to plan dams, roads and industry for the poorest region of Brazil."
 icxw.80.a:0 "Fund SUDENE generously"
 icxw.80.b:0 "Leave it to the states"
 icxw.82.t:0 "The Brazilian Miracle"
 icxw.82.d:0 "The economy is growing by ten percent a year. Foreign car makers, steelworks and petrochemical plants are expanding, and Brazilians are buying their first refrigerators and television sets. The finance minister says the cake must grow before it can be shared."
 icxw.82.a:0 "Let the cake grow"
 icxw.82.b:0 "Share the gains as we grow"
 icxw.83.t:0 "The Trans-Amazonian Highway"
 icxw.83.d:0 "After a visit to the drought-stricken Northeast, the government announces a highway of more than four thousand kilometres through the Amazon forest, from the Atlantic coast towards the border with Peru, with villages for settlers from the Northeast every few kilometres. 'A land without men for men without land,' says the slogan."
 icxw.83.a:0 "Build the highway and settle the land"
 icxw.83.b:0 "Build only the most useful stretches"
 icxw.84.t:0 "The Itaipu Treaty"
 icxw.84.d:0 "Brazil and Paraguay are ready to sign a treaty to build the largest hydroelectric dam in the world on the Parana river, at Itaipu. Brazil will pay for most of it and buy Paraguay's share of the power. Argentina, downstream, protests that the dam could ruin its own plans for the river."
 icxw.84.a:0 "Sign the treaty"
 icxw.84.b:0 "Seek a deal with Argentina first"
 icxw.85.t:0 "The Nuclear Agreement with West Germany"
 icxw.85.d:0 "West Germany has agreed to sell Brazil up to eight nuclear reactors, together with the technology to enrich uranium and make our own fuel. The United States is alarmed: Brazil has not signed the Nuclear Non-Proliferation Treaty."
 icxw.85.a:0 "Sign with Bonn"
 icxw.85.b:0 "Buy American reactors only"
 icxw.86.t:0 "Proalcool"
 icxw.86.d:0 "The oil shock has quadrupled the price of the petrol Brazil imports. The government proposes a National Alcohol Programme: cheap credit for distilleries that turn sugar cane into ethanol, a fixed price for the new fuel and, in time, cars that run on pure alcohol."
 icxw.86.a:0 "Launch Proalcool"
 icxw.86.b:0 "Drill for more oil instead"
 icxw.88.t:0 "The Cruzado Plan"
 icxw.88.d:0 "Inflation is running at more than two hundred percent a year. In a television address the President announces a new currency, the cruzado, and a freeze on all prices. Housewives with lists of official prices are reporting shops that break the freeze, calling themselves 'the President's inspectors'. Shelves are emptying, but the government is suddenly very popular."
 icxw.88.a:0 "Freeze all prices"
 icxw.88.b:0 "Stabilise gradually"
 icxw.89.t:0 "The Cruzado Collapses"
 icxw.89.d:0 "The price freeze held until the elections, which the government's allies won in a landslide. Now it can hold no longer: the freeze is lifted, prices are jumping and inflation is heading back above three hundred percent. Banks and ministers are discussing whether to stop paying interest on the foreign debt."
 icxw.89.a:0 "Suspend payments on the foreign debt"
 icxw.89.b:0 "Keep paying and cut spending"
 icxw.90.t:0 "The Citizen Constitution"
 icxw.90.d:0 "After twenty months of debate, the Constituent Assembly has finished Brazil's new constitution: votes for the illiterate and for sixteen-year-olds, a universal public health system, protection for indigenous lands and the right to strike. 'We hate dictatorship,' its president tells the chamber."
 icxw.90.a:0 "Promulgate the constitution"
 icxw.90.b:0 "Ask for amendments first"
 icxw.91.t:0 "The Collor Plan"
 icxw.91.d:0 "On his first day in office, the new President has frozen every savings and bank account above 50,000 cruzados novos for eighteen months: most of the money in the country. Prices rose by eighty percent last month alone. Overnight, Brazilians cannot pay their rent or their workers."
 icxw.91.a:0 "Keep the accounts frozen"
 icxw.91.b:0 "Unfreeze them early"
 icxw.93.t:0 "The Real Plan"
 icxw.93.d:0 "The finance ministry has a new plan. For a few months every price will be quoted in a virtual unit tied to the dollar, the URV; on 1 July the URV will become a new currency, the real. If it works, inflation that passed two thousand percent last year could fall to single figures."
 icxw.93.a:0 "Launch the real"
 icxw.93.b:0 "Too risky before the elections"
 icxw.94.t:0 "Selling Vale"
 icxw.94.d:0 "Companhia Vale do Rio Doce, the state mining giant that exports iron ore from Carajas and Minas Gerais, is to be auctioned. Protesters say Brazil is giving away its mineral wealth; the government says the money will pay down the debt."
 icxw.94.a:0 "Sell Vale"
 icxw.94.b:0 "Keep it public"
 icxw.95.t:0 "Bolsa Familia"
 icxw.95.d:0 "The government wants to merge Brazil's patchwork of benefits into one programme: a small monthly payment to poor families, paid to the mother through a bank card, as long as the children go to school and get their vaccinations. Critics call it a handout; supporters call it the cheapest way to end hunger."
 icxw.95.a:0 "Launch Bolsa Familia"
 icxw.95.b:0 "Fund job programmes instead"
 icxw.96.t:0 "The Pre-Salt"
 icxw.96.d:0 "Petrobras has found oil, perhaps eight billion barrels of it, under two kilometres of ocean and two more of rock and salt off Rio de Janeiro. If the 'pre-salt' layer is as large as the geologists hope, Brazil could become one of the great oil producers of the world."
 icxw.96.a:0 "Petrobras must run every field"
 icxw.96.b:0 "Auction the fields to all comers"
 icxw.97.t:0 "Operation Car Wash"
 icxw.97.d:0 "A money-laundering inquiry that began at a petrol station in Brasilia has led federal police to a vast scheme: construction firms paid billions in bribes for Petrobras contracts, and the money went to politicians of almost every party."
 icxw.97.a:0 "Let the investigators go all the way"
 icxw.97.b:0 "Rein in the prosecutors"
 icxw.100.t:0 "The Bad Harvests"
 icxw.100.d:0 "Two years of drought have ruined the wheat and maize harvests. For the first time in memory Argentines are eating bread made from mixed flour, and the dollars earned after the war are gone. The government has announced an emergency plan: hold down wages, eat less beef and save."
 icxw.100.a:0 "Austerity, and a new plan open to foreign capital"
 icxw.100.b:0 "Protect the workers' wages"
 icxw.101.t:0 "The Battle for Oil"
 icxw.101.d:0 "Argentina spends a fifth of its dollars on imported oil it could pump at home. The President has signed contracts with American and European companies to drill for YPF, promising that the country will produce all the oil it needs within three years. Nationalists, including many in his own party, call it a betrayal."
 icxw.101.a:0 "Sign the contracts"
 icxw.101.b:0 "YPF must do it alone"
 icxw.103.t:0 "The Night of the Long Batons"
 icxw.103.d:0 "The new military government has abolished the self-government of the universities. When students and professors occupied five faculties of the University of Buenos Aires in protest, federal police cleared them with batons. Hundreds of scientists and teachers are preparing to leave for the United States, Venezuela and Chile."
 icxw.103.a:0 "Order is restored"
 icxw.103.b:0 "Restore the universities' autonomy"
 icxw.104.t:0 "The Cordobazo"
 icxw.104.d:0 "Car workers and students in Cordoba, the heart of the motor industry, have risen against the government. For two days the city centre belonged to them, and the army had to retake it street by street. The government's prestige is shattered."
 icxw.104.a:0 "Replace the economic team and loosen wages"
 icxw.104.b:0 "Hold the line"
 icxw.106.t:0 "The Rodrigazo"
 icxw.106.d:0 "The new economy minister has announced a shock: the peso devalued by half, petrol up by 175 percent, public utility prices doubled, while wage rises are capped. The unions have called a general strike, the first ever against a Peronist government."
 icxw.106.a:0 "Stand by the plan"
 icxw.106.b:0 "Dismiss the minister and grant the wage claims"
 icxw.107.t:0 "The Tablita"
 icxw.107.d:0 "To bring inflation down, the economy minister will announce in advance how much the peso will fall against the dollar each month: the 'tablita'. Imports are suddenly cheap, Argentines are flying to Miami to shop, saying 'deme dos' ('I'll take two'), and money pours into the banks at high interest. Industrialists warn that they cannot compete."
 icxw.107.a:0 "Follow the tablita"
 icxw.107.b:0 "Protect industry"
 icxw.108.t:0 "The Austral Plan"
 icxw.108.d:0 "Inflation is running at a thousand percent a year. The economy minister unveils a new currency, the austral, worth a thousand pesos, with prices and wages frozen and a promise that the central bank will stop printing money to pay the government's bills."
 icxw.108.a:0 "Launch the austral"
 icxw.108.b:0 "Adjust gradually"
 icxw.110.t:0 "Hyperinflation"
 icxw.110.d:0 "Prices are rising by a third every month. Supermarkets change their price labels twice a day, and in Rosario and Greater Buenos Aires crowds have looted food shops. Many say only a new government can restore trust in the currency."
 icxw.110.a:0 "Emergency price controls and food aid"
 icxw.110.b:0 "A shock: devalue and cut spending"
 icxw.111.t:0 "Convertibility"
 icxw.111.d:0 "By law, one peso will now be worth exactly one dollar, and the central bank may only print pesos that it can back with dollars in its vaults. Inflation, which reached thousands of percent two years ago, may finally be dead, but the government has given up its power to devalue."
 icxw.111.a:0 "One peso, one dollar"
 icxw.111.b:0 "Keep a flexible exchange rate"
 icxw.112.t:0 "Mercosur"
 icxw.112.d:0 "In Asuncion, Argentina, Brazil, Paraguay and Uruguay are ready to sign a treaty for a common market by 1995: no tariffs between us and a common tariff towards the rest of the world. The old rivalry with Brazil could become a partnership."
 icxw.112.a:0 "Sign the Treaty of Asuncion"
 icxw.112.b:0 "Keep our tariffs"
 icxw.113.t:0 "Selling YPF"
 icxw.113.d:0 "The state oil company YPF, founded in 1922 and long a symbol of national pride, is to be floated on the stock exchanges of New York and Buenos Aires. The sale could raise billions of dollars to pay down the debt."
 icxw.113.a:0 "Sell YPF"
 icxw.113.b:0 "Keep YPF public"
 icxw.114.t:0 "The Corralito"
 icxw.114.d:0 "After three years of recession, savers are pulling their dollars out of the banks. The economy minister has limited withdrawals to 250 pesos a week: the 'corralito', the little fence. Crowds banging pots fill the Plaza de Mayo, shops are being looted in the suburbs and dozens have been killed. The government is collapsing."
 icxw.114.a:0 "End convertibility and stop paying the debt"
 icxw.114.b:0 "Hold the peg at any cost"
 icxw.115.t:0 "Paying Off the IMF"
 icxw.115.d:0 "A debt swap, in which most creditors accepted a loss of around two-thirds, is behind us, and the economy is growing fast again on soybean exports. The President proposes to repay the IMF's nine and a half billion dollars in one go, out of the central bank's reserves, and be free of its advice."
 icxw.115.a:0 "Repay the IMF"
 icxw.115.b:0 "Keep the reserves"
 icxw.116.t:0 "Taking Back YPF"
 icxw.116.d:0 "The government is sending Congress a bill to expropriate 51 percent of YPF from the Spanish company Repsol, accusing it of failing to invest while Argentina imports ever more fuel."
 icxw.116.a:0 "Take back YPF"
 icxw.116.b:0 "Negotiate with Repsol"
 icxw.117.t:0 "The Largest Loan in History"
 icxw.117.d:0 "A drought has cut soybean exports, the peso has lost a third of its value in weeks and the central bank has raised interest rates to forty percent. The government asks the IMF for help and gets the biggest loan the Fund has ever made: fifty billion dollars, soon raised to fifty-seven."
 icxw.117.a:0 "Accept the IMF loan"
 icxw.117.b:0 "Impose currency controls instead"
 icxw.120.t:0 "The Lucky Dragon"
 icxw.120.d:0 "In March a Japanese tuna boat, the Daigo Fukuryu Maru, the 'Lucky Dragon No. 5', came home to Yaizu with its crew burned and sick. It was fishing far outside the danger zone when the Americans tested a hydrogen bomb at Bikini, much bigger than planned, and was showered with radioactive ash. Fishmongers are throwing away tuna, and a petition against nuclear weapons, started by housewives in Tokyo's Suginami ward, is gathering signatures across the country. Even the film studios have noticed: at Toho, a producer is planning a film about a monster woken by the bomb."
 icxw.120.a:0 "Demand compensation from Washington"
 icxw.120.b:0 "Settle it quietly with our ally"
 icxw.121.t:0 "Minamata Disease"
 icxw.121.d:0 "Researchers at Kumamoto University have concluded that the strange illness killing fishing families around Minamata Bay, with trembling, slurred speech, madness and death, is organic mercury poisoning, and that it comes from the Chisso chemical factory. Chisso denies it, and the town depends on its jobs."
 icxw.121.a:0 "Order Chisso to stop dumping"
 icxw.121.b:0 "Protect the factory and pay the victims small sums"
 icxw.122.t:0 "The Isewan Typhoon"
 icxw.122.d:0 "Typhoon Vera has struck Nagoya and the shores of Ise Bay at high tide. The storm surge broke the sea walls, and logs from the timber yards smashed through the houses behind them. More than five thousand people are dead."
 icxw.122.a:0 "A national disaster law and new sea walls"
 icxw.122.b:0 "Rebuild what was there"
 icxw.123.t:0 "The Tokyo Olympics"
 icxw.123.d:0 "The first Olympic Games in Asia open in Tokyo. The flame is lit by Yoshinori Sakai, a student born near Hiroshima on the day the bomb fell. For the Games, Tokyo has built expressways, a monorail and new hotels in record time. Japan is showing the world that it is back."
 icxw.123.a:0 "Keep building after the Games"
 icxw.123.b:0 "Time to balance the budget"
 icxw.124.t:0 "Expo '70"
 icxw.124.d:0 "The first World's Fair in Asia has opened in the hills outside Osaka. Under Taro Okamoto's Tower of the Sun, sixty-four million visitors will see a moon rock in the American pavilion, Soviet spacecraft and a future of moving walkways and video telephones."
 icxw.124.a:0 "Show off Japanese technology"
 icxw.124.b:0 "Invite the world to invest"
 icxw.125.t:0 "The Pollution Diet"
 icxw.125.d:0 "Minamata disease, Niigata, the asthma of Yokkaichi, the itai-itai disease of Toyama: in a single session, the Diet is asked to pass fourteen laws against pollution and to create an Environment Agency. Industry says the rules will cost a fortune."
 icxw.125.a:0 "Pass all fourteen laws"
 icxw.125.b:0 "Water them down"
 icxw.126.t:0 "The Nixon Shock"
 icxw.126.d:0 "Without warning his allies, the American president has ended the dollar's convertibility into gold and put a ten percent surcharge on imports. The yen, fixed at 360 to the dollar since 1949, will have to rise, perhaps to 308, and Japanese exporters fear for their markets."
 icxw.126.a:0 "Accept a stronger yen"
 icxw.126.b:0 "Buy dollars to defend 360"
 icxw.127.t:0 "Remodelling the Archipelago"
 icxw.127.d:0 "The best-selling book of the year, by the ruling party's most powerful politician, promises to 'remodel the Japanese archipelago': bullet trains and expressways to every corner of the country, and new industrial cities of 250,000 people in the countryside. Land prices are already soaring wherever a new line might run."
 icxw.127.a:0 "Remodel the archipelago"
 icxw.127.b:0 "Cool the land boom"
 icxw.128.t:0 "The Toilet Paper Panic"
 icxw.128.d:0 "With the Arab oil embargo cutting Japan's supplies, a rumour has spread that paper will run out. In Osaka supermarkets, housewives are fighting over toilet rolls; detergent, sugar and soy sauce are vanishing from the shelves. Prices are rising by more than twenty percent a year."
 icxw.128.a:0 "Ration oil and appeal for calm"
 icxw.128.b:0 "Price controls on daily goods"
 icxw.129.t:0 "The Lockheed Scandal"
 icxw.129.d:0 "In Washington, a Senate committee has revealed that the Lockheed Corporation paid millions of dollars in bribes to sell its TriStar airliners in Japan. The money passed through the trading house Marubeni and the right-wing fixer Yoshio Kodama, and, prosecutors suspect, reached a former Prime Minister."
 icxw.129.a:0 "Let the prosecutors follow the money"
 icxw.129.b:0 "Protect the party"
 icxw.130.t:0 "Breaking Up the National Railways"
 icxw.130.d:0 "Japanese National Railways owes 37 trillion yen and loses money on almost every line outside the big cities. On 1 April it is to be split into six regional passenger companies and a freight company, to be sold off over time. The railway unions, the backbone of the Socialist opposition, will be broken."
 icxw.130.a:0 "Privatise the railways"
 icxw.130.b:0 "Reform it as one public company"
 icxw.131.t:0 "The Consumption Tax"
 icxw.131.d:0 "From 1 April, a tax of three percent will be added to almost everything Japanese people buy. The finance ministry says an ageing country needs a broad tax; voters are furious."
 icxw.131.a:0 "Introduce the tax"
 icxw.131.b:0 "Shelve it"
 icxw.132.t:0 "Yamaichi Falls"
 icxw.132.d:0 "Yamaichi Securities, one of Japan's four great brokerages and a hundred years old, has collapsed with billions of dollars of hidden losses. A week ago it was the Hokkaido Takushoku Bank. On television, Yamaichi's president weeps and begs the public not to blame his employees."
 icxw.132.a:0 "Put public money into the banks"
 icxw.132.b:0 "Let weak banks fail"
 icxw.133.t:0 "The Postal Election"
 icxw.133.d:0 "Japan Post is the biggest savings bank in the world: its deposits pay for roads, dams and the political machines that build them. The Prime Minister's bill to privatise it has been defeated in the upper house by rebels from his own party. He has dissolved the lower house and is running 'assassin' candidates against the rebels."
 icxw.133.a:0 "Privatise Japan Post"
 icxw.133.b:0 "Back down"
 icxw.134.t:0 "The Great East Japan Earthquake"
 icxw.134.d:0 "A magnitude 9.0 earthquake off the coast of Tohoku has sent a tsunami as high as forty metres over the sea walls. More than eighteen thousand people are dead or missing. At Fukushima Daiichi the cooling systems have failed, and three reactors are melting down."
 icxw.134.a:0 "Shut down every nuclear plant for checks"
 icxw.134.b:0 "Keep the other plants running"
 icxw.135.t:0 "Three Arrows"
 icxw.135.d:0 "After fifteen years of falling prices, the government fires 'three arrows': massive money printing by the Bank of Japan, big public spending and reforms to make the economy grow. The yen is falling and the stock market is soaring."
 icxw.135.a:0 "Fire all three arrows"
 icxw.135.b:0 "Just the first arrow"
 ICX_w_SIA_first_plan:0 "The First Development Plan"
 ICX_w_SIA_first_plan_desc:0 "Roads, dams and power lines first; private enterprise will follow."
 ICX_w_SIA_open_politics:0 "The Democratic Period"
 ICX_w_SIA_open_politics_desc:0 "Newspapers, unions and universities are free, and every one of them has something to say."
 ICX_w_SIA_crackdown:0 "Blood on Ratchadamnoen"
 ICX_w_SIA_crackdown_desc:0 "The government won the street, but lost the country."
 ICX_w_SIA_eastern_seaboard:0 "The Eastern Seaboard"
 ICX_w_SIA_eastern_seaboard_desc:0 "Gas, ports and industrial estates along the Gulf coast."
 ICX_w_SIA_tourism:0 "Amazing Thailand"
 ICX_w_SIA_tourism_desc:0 "Tourists bring dollars, jobs and a busy year for every hotel."
 ICX_w_SIA_reform_1992:0 "Civilian Government"
 ICX_w_SIA_reform_1992_desc:0 "The soldiers have gone back to their barracks; investors are coming back."
 ICX_w_SIA_hot_money:0 "Hot Money"
 ICX_w_SIA_hot_money_desc:0 "Cheap dollars from abroad are paying for towers, golf courses and factories."
 ICX_w_SIA_crisis_1997:0 "The Tom Yum Kung Crisis"
 ICX_w_SIA_crisis_1997_desc:0 "Half-built towers stand empty all over Bangkok."
 ICX_w_SIA_thirty_baht:0 "Thirty Baht Healthcare"
 ICX_w_SIA_thirty_baht_desc:0 "A doctor for everyone, for the price of a bowl of noodles."
 ICX_w_SIA_flood_2011:0 "After the Great Flood"
 ICX_w_SIA_flood_2011_desc:0 "The industrial estates are pumping out water and repairing machines."
 ICX_w_LAO_relaxation:0 "The New Thinking"
 ICX_w_LAO_relaxation_desc:0 "Farmers may leave the cooperatives and sell their rice at the market."
 ICX_w_LAO_kip_crisis:0 "The Kip Collapses"
 ICX_w_LAO_kip_crisis_desc:0 "Prices in the market change every week."
 ICX_w_SRL_language_tension:0 "The Language Divide"
 ICX_w_SRL_language_tension_desc:0 "One official language has won votes, and lost the trust of a quarter of the country."
 ICX_w_SRL_language_compromise:0 "Two Languages, One Country"
 ICX_w_SRL_language_compromise_desc:0 "A compromise that satisfies no one completely, but keeps the peace."
 ICX_w_SRL_state_estates:0 "State Plantations"
 ICX_w_SRL_state_estates_desc:0 "The tea and rubber estates belong to the nation; their managers belong to the ministry."
 ICX_w_SRL_open_economy:0 "The Open Economy"
 ICX_w_SRL_open_economy_desc:0 "Imports, investors and tourists are welcome again."
 ICX_w_SRL_mahaweli:0 "The Mahaweli Scheme"
 ICX_w_SRL_mahaweli_desc:0 "Four dams, new canals and new villages in the dry zone."
 ICX_w_SRL_fertiliser_ban:0 "Organic Overnight"
 ICX_w_SRL_fertiliser_ban_desc:0 "Tea bushes and rice fields without fertiliser."
 ICX_w_SRL_crisis_2022:0 "The Default"
 ICX_w_SRL_crisis_2022_desc:0 "Fuel queues, power cuts and an empty treasury."
 ICX_w_MEX_stabilizing:0 "Stabilising Development"
 ICX_w_MEX_stabilizing_desc:0 "A steady peso, cheap credit for industry and slow, sure growth."
 ICX_w_MEX_union_anger:0 "The Jailed Railwaymen"
 ICX_w_MEX_union_anger_desc:0 "The union leaders are in prison; their members have not forgotten."
 ICX_w_MEX_maquila:0 "The Maquiladoras"
 ICX_w_MEX_maquila_desc:0 "Border factories assemble goods for the American market."
 ICX_w_MEX_oil_boom:0 "Administering Abundance"
 ICX_w_MEX_oil_boom_desc:0 "Oil money and foreign loans are building a new Mexico."
 ICX_w_MEX_lost_decade:0 "The Lost Decade"
 ICX_w_MEX_lost_decade_desc:0 "Every spare peso goes to the foreign banks."
 ICX_w_MEX_tequila:0 "The Tequila Crisis"
 ICX_w_MEX_tequila_desc:0 "The peso has halved, and so have many family savings."
 ICX_w_BRA_miracle:0 "The Brazilian Miracle"
 ICX_w_BRA_miracle_desc:0 "Ten percent growth a year, and a cake that has yet to be shared."
 ICX_w_BRA_miracle_shared:0 "Growth for Everyone"
 ICX_w_BRA_miracle_shared_desc:0 "Slower growth, but wages that keep pace."
 ICX_w_BRA_amazon:0 "The Amazon Frontier"
 ICX_w_BRA_amazon_desc:0 "Settlers from the Northeast are clearing land along the new highway."
 ICX_w_BRA_proalcool:0 "Proalcool"
 ICX_w_BRA_proalcool_desc:0 "Brazilian cars run on Brazilian sugar cane."
 ICX_w_BRA_price_freeze:0 "The Price Freeze"
 ICX_w_BRA_price_freeze_desc:0 "Prices are frozen; so are the supplies on the shelves."
 ICX_w_BRA_collor:0 "The Frozen Savings"
 ICX_w_BRA_collor_desc:0 "No one can touch their savings for eighteen months."
 ICX_w_BRA_real:0 "The Real"
 ICX_w_BRA_real_desc:0 "A currency people trust, for the first time in a generation."
 ICX_w_BRA_bolsa:0 "Bolsa Familia"
 ICX_w_BRA_bolsa_desc:0 "A small payment for every poor family whose children go to school."
 ICX_w_ARG_second_plan:0 "The Second Five-Year Plan"
 ICX_w_ARG_second_plan_desc:0 "Belts tightened, and doors opened to foreign capital."
 ICX_w_ARG_brain_drain:0 "The Brain Drain"
 ICX_w_ARG_brain_drain_desc:0 "Our best scientists are teaching in Caracas, Santiago and Boston."
 ICX_w_ARG_sweet_money:0 "Sweet Money"
 ICX_w_ARG_sweet_money_desc:0 "Imports are cheap, factories are closing and everyone is flying to Miami."
 ICX_w_ARG_hyperinflation:0 "Hyperinflation"
 ICX_w_ARG_hyperinflation_desc:0 "Prices change twice a day."
 ICX_w_ARG_convertibility:0 "Convertibility"
 ICX_w_ARG_convertibility_desc:0 "One peso, one dollar."
 ICX_w_ARG_default:0 "The Default"
 ICX_w_ARG_default_desc:0 "The banks are closed to us, at home and abroad."
 ICX_w_JAP_olympic_boom:0 "The Olympic Boom"
 ICX_w_JAP_olympic_boom_desc:0 "Expressways, hotels and railways built in record time."
 ICX_w_JAP_pollution_laws:0 "Clean Air and Water"
 ICX_w_JAP_pollution_laws_desc:0 "The strictest pollution laws in the world."
 ICX_w_JAP_land_boom:0 "Remodelling the Archipelago"
 ICX_w_JAP_land_boom_desc:0 "New railways and roads, and soaring land prices."
 ICX_w_JAP_oil_shock:0 "The Oil Shock"
 ICX_w_JAP_oil_shock_desc:0 "Neon signs are switched off and petrol stations close on Sundays."
 ICX_w_JAP_tohoku:0 "Rebuilding Tohoku"
 ICX_w_JAP_tohoku_desc:0 "Whole towns must be rebuilt on higher ground."
 ICX_w_friendly:0 "Grateful to us"
 ICX_w_partner:0 "Trade partner"
 ICX_w_angry:0 "Angry with us"
 ICX_dev_tt_pri_3:0 "Primary schooling rises by §G3§! points in every core state."
 ICX_dev_tt_lit_2:0 "Literacy rises by §G2§! points in every core state."
 ICX_dev_tt_pri_1:0 "Primary schooling rises by §G1§! points in every core state."
 ICX_dev_tt_pri_2:0 "Primary schooling rises by §G2§! points in every core state."
 ICX_w_tt_col_m2:0 "University education falls by §R2§! points in every core state."
