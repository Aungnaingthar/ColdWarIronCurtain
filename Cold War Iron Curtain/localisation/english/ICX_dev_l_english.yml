l_english:
 ICX_E50_00:0 "Post-War Development"
 ICX_E50_00_desc:0 "The war is over and the world is rebuilding. Every nation, old or newly independent, needs a plan to grow its economy."
 ICX_E50_01:0 "The First Development Plan"
 ICX_E50_01_desc:0 "A five-year plan sets targets for public investment in power, transport and industry."
 ICX_E50_02:0 "Basic Industries"
 ICX_E50_02_desc:0 "Steel, cement and chemicals are the foundations every other industry is built on."
 ICX_E50_03:0 "Consumer Goods for the People"
 ICX_E50_03_desc:0 "Factories making cloth, shoes, soap and bicycles give people something to buy with their wages."
 ICX_E50_04:0 "Rebuild the Railways and Roads"
 ICX_E50_04_desc:0 "Bombed bridges, worn-out track and dirt roads hold back the whole economy."
 ICX_E50_05:0 "National Electrification"
 ICX_E50_05_desc:0 "A national power board builds power stations and carries electricity to the towns."
 ICX_E50_06:0 "Expand the Ports"
 ICX_E50_06_desc:0 "New wharves, cranes and warehouses let more trade pass through our harbours."
 ICX_E50_07:0 "Land Reform"
 ICX_E50_07_desc:0 "Land for those who till it: large estates are divided and tenants gain security."
 ICX_E50_08:0 "Agricultural Credit"
 ICX_E50_08_desc:0 "Cheap loans for seed, tools and fertiliser free farmers from the moneylenders."
 ICX_E50_09:0 "A Geological Survey"
 ICX_E50_09_desc:0 "Geologists map the country's coal, ores and oil, and engineers its rivers and soils."
 ICX_E50_10:0 "A National Central Bank"
 ICX_E50_10_desc:0 "Our own central bank issues the currency, holds the reserves and lends to the government."
 ICX_E50_11:0 "Foreign Exchange Controls"
 ICX_E50_11_desc:0 "Scarce dollars and pounds are rationed for the imports the plan needs most."
 ICX_E50_12:0 "Development Aid"
 ICX_E50_12_desc:0 "Aid from the great powers and the new World Bank pays for dams, roads and experts."
 ICX_E50_13:0 "The Literacy Campaign"
 ICX_E50_13_desc:0 "Every citizen who can read is a better worker, soldier and voter."
 ICX_E50_14:0 "The Public Health Campaign"
 ICX_E50_14_desc:0 "Campaigns against malaria, tuberculosis and smallpox save more lives than any hospital."
 ICX_E50_15:0 "Technical Schools"
 ICX_E50_15_desc:0 "Schools for mechanics, electricians and builders supply the skilled workers new factories need."
 ICX_E50_16:0 "Welcome Foreign Capital"
 ICX_E50_16_desc:0 "Foreign firms bring money, machines and know-how. Let them invest, and tax their profits."
 ICX_E50_17:0 "Import Substitution"
 ICX_E50_17_desc:0 "High tariffs and state factories will replace imports with goods made at home."
 ICX_E50_18:0 "Joint Ventures with Foreign Firms"
 ICX_E50_18_desc:0 "Partnerships between local and foreign companies transfer skills to our own managers."
 ICX_E50_19:0 "State Industrial Corporations"
 ICX_E50_19_desc:0 "Public corporations own and run the new mills, mines and power stations."
 ICX_E50_20:0 "The Economic Take-Off"
 ICX_E50_20_desc:0 "The economy now grows faster than the population. Each year the country is a little richer than the last."
 ICX_E60_00:0 "The Development Decade"
 ICX_E60_00_desc:0 "The United Nations has declared the 1960s the Development Decade. Our goal is growth of five per cent a year."
 ICX_E60_01:0 "The Second Development Plan"
 ICX_E60_01_desc:0 "A new plan builds on the first: more industry, more power, more schools."
 ICX_E60_02:0 "Industrial Estates"
 ICX_E60_02_desc:0 "Serviced industrial land with power, water and roads, ready for factories to move in."
 ICX_E60_03:0 "Machine Building"
 ICX_E60_03_desc:0 "A country that builds its own machine tools no longer depends on others to build its factories."
 ICX_E60_04:0 "Hydroelectric Dams"
 ICX_E60_04_desc:0 "Great dams bring power to the cities and water to the fields."
 ICX_E60_05:0 "A National Highway Programme"
 ICX_E60_05_desc:0 "Paved highways connect the provinces to the capital and the ports."
 ICX_E60_06:0 "Telecommunications Network"
 ICX_E60_06_desc:0 "Telephone exchanges, microwave links and the first television stations."
 ICX_E60_07:0 "Irrigation Schemes"
 ICX_E60_07_desc:0 "Canals and pumps let farmers grow two crops a year instead of one."
 ICX_E60_08:0 "Fertiliser Plants"
 ICX_E60_08_desc:0 "Chemical fertiliser doubles the yield of the same field."
 ICX_E60_09:0 "The Green Revolution"
 ICX_E60_09_desc:0 "New high-yield varieties of rice and wheat, developed in the Philippines and Mexico, transform the harvest."
 ICX_E60_10:0 "A Development Bank"
 ICX_E60_10_desc:0 "A state development bank lends for long periods to industry and infrastructure."
 ICX_E60_11:0 "Tariff Reform"
 ICX_E60_11_desc:0 "The Kennedy Round of trade talks cuts tariffs around the world. We must decide which industries to protect."
 ICX_E60_12:0 "Export Promotion"
 ICX_E60_12_desc:0 "Tax rebates and export credit help our firms sell abroad."
 ICX_E60_13:0 "Universities for All"
 ICX_E60_13_desc:0 "New universities in the provinces open higher education to the children of farmers and workers."
 ICX_E60_14:0 "Vocational Training"
 ICX_E60_14_desc:0 "Apprenticeships and training centres teach the skills of the factory floor."
 ICX_E60_15:0 "Rural Clinics"
 ICX_E60_15_desc:0 "A clinic within a day's walk of every village."
 ICX_E60_16:0 "Export-Oriented Industrialisation"
 ICX_E60_16_desc:0 "Like Japan, Taiwan and South Korea, we will grow by making goods the world wants to buy."
 ICX_E60_17:0 "The Heavy Industry Drive"
 ICX_E60_17_desc:0 "The state will build steel mills, chemical plants and engineering works, whatever the cost."
 ICX_E60_18:0 "Light Manufacturing for Export"
 ICX_E60_18_desc:0 "Clothing, toys, radios and plastics are made cheaply and shipped to America and Europe."
 ICX_E60_19:0 "Steel and Chemicals"
 ICX_E60_19_desc:0 "Integrated steel works and petrochemical complexes are the pride of the plan."
 ICX_E60_20:0 "The Economic Miracle"
 ICX_E60_20_desc:0 "For a decade the economy has grown faster than almost anywhere in the world."
 ICX_E70_00:0 "Crisis and Adjustment"
 ICX_E70_00_desc:0 "The post-war boom is ending. The dollar has left gold, oil prices are about to quadruple, and prices rise everywhere."
 ICX_E70_01:0 "The Third Development Plan"
 ICX_E70_01_desc:0 "A new plan for a harder decade, with fewer cheap loans and dearer energy."
 ICX_E70_02:0 "Petrochemicals"
 ICX_E70_02_desc:0 "Plastics, fibres and fertilisers made from our own oil and gas."
 ICX_E70_03:0 "Automobile Assembly"
 ICX_E70_03_desc:0 "A car and truck assembly industry, with a growing share of parts made at home."
 ICX_E70_04:0 "Energy Security"
 ICX_E70_04_desc:0 "The oil embargo of 1973 shows that an economy without secure energy is at the mercy of others."
 ICX_E70_05:0 "A Nuclear Power Programme"
 ICX_E70_05_desc:0 "Nuclear power stations promise electricity that does not depend on imported oil."
 ICX_E70_06:0 "Coal Revival"
 ICX_E70_06_desc:0 "Old coal mines reopen and new coal-fired power stations replace oil-fired ones."
 ICX_E70_07:0 "Food Security"
 ICX_E70_07_desc:0 "After the world food crisis of 1972 to 1974, grain reserves and higher farm prices protect the nation from hunger."
 ICX_E70_08:0 "Agricultural Mechanisation"
 ICX_E70_08_desc:0 "Tractors, pumps and threshers replace draught animals on the larger farms."
 ICX_E70_09:0 "The Commodity Boom"
 ICX_E70_09_desc:0 "Prices of oil, metals, coffee and sugar soar. Exporters of raw materials have never earned more."
 ICX_E70_10:0 "Floating Exchange Rates"
 ICX_E70_10_desc:0 "The Bretton Woods system has collapsed. Our currency must now find its own level."
 ICX_E70_11:0 "Petrodollar Loans"
 ICX_E70_11_desc:0 "The oil exporters' surpluses are lent on by Western banks at low interest. Borrowing has never been easier."
 ICX_E70_12:0 "Price Controls"
 ICX_E70_12_desc:0 "Controls on the price of bread, fuel and rent shield families from inflation, at a cost to the budget."
 ICX_E70_13:0 "Mass Higher Education"
 ICX_E70_13_desc:0 "University places multiply as the baby-boom generation comes of age."
 ICX_E70_14:0 "Social Insurance"
 ICX_E70_14_desc:0 "Pensions, sickness pay and unemployment insurance for industrial workers."
 ICX_E70_15:0 "Public Housing"
 ICX_E70_15_desc:0 "Apartment blocks with running water and electricity replace the shanty towns."
 ICX_E70_16:0 "Wage and Price Indexation"
 ICX_E70_16_desc:0 "Wages rise automatically with prices, and the state guides investment and credit."
 ICX_E70_17:0 "Monetary Discipline"
 ICX_E70_17_desc:0 "Tight money and balanced budgets will break inflation, whatever the cost in jobs."
 ICX_E70_18:0 "Nationalise the Mines"
 ICX_E70_18_desc:0 "Foreign-owned mines and oil fields pass to the state, and with them the profits of the commodity boom."
 ICX_E70_19:0 "Concessions for Foreign Mining"
 ICX_E70_19_desc:0 "Foreign mining companies bring capital and technology in return for long concessions and royalties."
 ICX_E70_20:0 "Weathering the Storm"
 ICX_E70_20_desc:0 "Two oil shocks, high inflation and slower growth, and still the economy has come through stronger."
 ICX_E80_00:0 "Debt and Reform"
 ICX_E80_00_desc:0 "Interest rates in America have soared. The loans of the seventies must now be repaid in dear dollars."
 ICX_E80_01:0 "Industrial Restructuring"
 ICX_E80_01_desc:0 "Loss-making factories are closed or modernised. New industries replace the old."
 ICX_E80_02:0 "Export Processing Zones"
 ICX_E80_02_desc:0 "Duty-free zones near the ports attract foreign firms that make goods for export."
 ICX_E80_03:0 "Electronics Assembly"
 ICX_E80_03_desc:0 "Semiconductors, televisions and computers are assembled for the world market."
 ICX_E80_04:0 "Telephone Modernisation"
 ICX_E80_04_desc:0 "Digital exchanges and new lines end the years-long wait for a telephone."
 ICX_E80_05:0 "Gas-Fired Power"
 ICX_E80_05_desc:0 "Cheaper and cleaner than oil, natural gas fuels the new power stations."
 ICX_E80_06:0 "Urban Transit"
 ICX_E80_06_desc:0 "Buses, commuter trains and metros carry the workers of the growing cities."
 ICX_E80_07:0 "Agricultural Price Reform"
 ICX_E80_07_desc:0 "Farmers are paid market prices for their crops instead of fixed state prices."
 ICX_E80_08:0 "Microcredit for Farmers"
 ICX_E80_08_desc:0 "Small loans to the rural poor, especially women, on the model of Bangladesh's Grameen Bank."
 ICX_E80_09:0 "Agro-Industry"
 ICX_E80_09_desc:0 "Food processing plants add value to our crops before they are exported."
 ICX_E80_10:0 "Debt Rescheduling"
 ICX_E80_10_desc:0 "Since Mexico's default in 1982, debtors and banks negotiate longer terms and lower interest."
 ICX_E80_11:0 "Tax Reform"
 ICX_E80_11_desc:0 "Fewer, simpler taxes with fewer exemptions raise more revenue."
 ICX_E80_12:0 "A Stock Exchange"
 ICX_E80_12_desc:0 "Companies raise capital and savers share in the country's growth."
 ICX_E80_13:0 "Computer Literacy"
 ICX_E80_13_desc:0 "Personal computers arrive in schools, offices and universities."
 ICX_E80_14:0 "Primary Health Care"
 ICX_E80_14_desc:0 "Following the Alma-Ata declaration, health workers in every village provide vaccination, clean water and basic care."
 ICX_E80_15:0 "Women in the Workforce"
 ICX_E80_15_desc:0 "More women in paid work raise household incomes and national output alike."
 ICX_E80_16:0 "Structural Adjustment"
 ICX_E80_16_desc:0 "The IMF and the World Bank lend in return for open markets, smaller budgets and the sale of state companies."
 ICX_E80_17:0 "The Developmental State"
 ICX_E80_17_desc:0 "An elite bureaucracy picks the industries of the future and directs credit to them."
 ICX_E80_18:0 "Privatise State Enterprises"
 ICX_E80_18_desc:0 "Airlines, telephone companies and steel mills are sold to private investors."
 ICX_E80_19:0 "Industrial Policy"
 ICX_E80_19_desc:0 "Cheap credit, protected markets and export targets for chosen industries."
 ICX_E80_20:0 "Growth Restored"
 ICX_E80_20_desc:0 "The lost decade is over. Investment and exports are growing again."
 ICX_E90_00:0 "Globalisation"
 ICX_E90_00_desc:0 "The Cold War is ending. Capital, goods and ideas now move freely around the world."
 ICX_E90_01:0 "Industrial Parks"
 ICX_E90_01_desc:0 "Modern industrial parks with roads, power and customs offices attract foreign investors."
 ICX_E90_02:0 "A Foreign Investment Agency"
 ICX_E90_02_desc:0 "A one-stop office helps foreign companies set up quickly."
 ICX_E90_03:0 "High-Tech Manufacturing"
 ICX_E90_03_desc:0 "Hard drives, chips and mobile phones are made for the world's electronics brands."
 ICX_E90_04:0 "Mobile Telephony"
 ICX_E90_04_desc:0 "Mobile networks reach millions who never had a fixed telephone line."
 ICX_E90_05:0 "The Internet"
 ICX_E90_05_desc:0 "Universities, businesses and then homes connect to the World Wide Web."
 ICX_E90_06:0 "Independent Power Producers"
 ICX_E90_06_desc:0 "Private companies build power plants and sell electricity to the state grid."
 ICX_E90_07:0 "Agricultural Exports"
 ICX_E90_07_desc:0 "Fruit, flowers, seafood and coffee are exported to the supermarkets of the rich world."
 ICX_E90_08:0 "Food Processing"
 ICX_E90_08_desc:0 "Canning, freezing and packaging industries grow alongside the farms."
 ICX_E90_09:0 "Land Titling"
 ICX_E90_09_desc:0 "Farmers receive titles to the land they work, and can borrow against them."
 ICX_E90_10:0 "Join the World Trade Organization"
 ICX_E90_10_desc:0 "Membership of the WTO locks in open trade and gives us access to its courts."
 ICX_E90_11:0 "Central Bank Independence"
 ICX_E90_11_desc:0 "An independent central bank with one goal, low inflation, earns the trust of markets."
 ICX_E90_12:0 "Free Trade Agreements"
 ICX_E90_12_desc:0 "Regional free trade areas cut tariffs with our neighbours."
 ICX_E90_13:0 "Higher Education Reform"
 ICX_E90_13_desc:0 "Private universities and student loans meet the soaring demand for degrees."
 ICX_E90_14:0 "Pension Reform"
 ICX_E90_14_desc:0 "Funded pension accounts relieve the state budget and create a pool of savings."
 ICX_E90_15:0 "Social Safety Nets"
 ICX_E90_15_desc:0 "Targeted cash transfers protect the poor during reforms and crises."
 ICX_E90_16:0 "Open Capital Markets"
 ICX_E90_16_desc:0 "Foreign investors may buy our shares and bonds, and our banks may borrow abroad."
 ICX_E90_17:0 "Capital Controls"
 ICX_E90_17_desc:0 "The Asian crisis of 1997 shows the danger of hot money. We keep control of our own capital account."
 ICX_E90_18:0 "Privatise the Utilities"
 ICX_E90_18_desc:0 "Telephone, electricity and water companies are sold or opened to competition."
 ICX_E90_19:0 "A Developmental State for the Global Age"
 ICX_E90_19_desc:0 "The state still guides investment, but now towards exports and technology."
 ICX_E90_20:0 "The Global Economy"
 ICX_E90_20_desc:0 "Our firms sell to the world and the world invests in our firms."
 ICX_E00_00:0 "A New Millennium"
 ICX_E00_00_desc:0 "China's rise drives a boom in trade and commodity prices. The digital revolution is spreading."
 ICX_E00_01:0 "Manufacturing for China"
 ICX_E00_01_desc:0 "Parts and materials for China's factories, and goods for its growing consumers."
 ICX_E00_02:0 "Automotive Supply Chains"
 ICX_E00_02_desc:0 "Factories making engines, wiring and car parts join the supply chains of the world's carmakers."
 ICX_E00_03:0 "Knowledge Industries"
 ICX_E00_03_desc:0 "Software, call centres and engineering services export brainpower instead of goods."
 ICX_E00_04:0 "Broadband for All"
 ICX_E00_04_desc:0 "Fast internet connections for homes, schools and businesses."
 ICX_E00_05:0 "Renewable Energy"
 ICX_E00_05_desc:0 "Wind farms and the first solar parks diversify the power supply."
 ICX_E00_06:0 "Infrastructure Megaprojects"
 ICX_E00_06_desc:0 "New airports, expressways, bridges and high-speed railways."
 ICX_E00_07:0 "Biofuels"
 ICX_E00_07_desc:0 "Ethanol and biodiesel from sugar cane and palm oil cut our fuel imports."
 ICX_E00_08:0 "Agricultural Biotechnology"
 ICX_E00_08_desc:0 "New seeds resist drought and pests."
 ICX_E00_09:0 "The Food Price Crisis"
 ICX_E00_09_desc:0 "Food prices double in 2007 and 2008. Subsidies and reserves keep bread and rice on the table."
 ICX_E00_10:0 "A Sovereign Wealth Fund"
 ICX_E00_10_desc:0 "Windfall revenues from exports are saved in a national fund for future generations."
 ICX_E00_11:0 "Mobile Banking"
 ICX_E00_11_desc:0 "People with no bank account can save, pay and borrow on their mobile phones."
 ICX_E00_12:0 "Inflation Targeting"
 ICX_E00_12_desc:0 "The central bank announces a target for inflation and sets interest rates to hit it."
 ICX_E00_13:0 "Universal Secondary Education"
 ICX_E00_13_desc:0 "Every child, girls as well as boys, finishes secondary school."
 ICX_E00_14:0 "Health Insurance for All"
 ICX_E00_14_desc:0 "A national health insurance scheme covers the poor and the informal workers."
 ICX_E00_15:0 "Urban Housing"
 ICX_E00_15_desc:0 "Millions move from the countryside to the cities. They need homes, water and sewers."
 ICX_E00_16:0 "Stimulus Spending"
 ICX_E00_16_desc:0 "When the world financial crisis strikes in 2008, the state spends to keep the economy growing."
 ICX_E00_17:0 "Fiscal Austerity"
 ICX_E00_17_desc:0 "Cutting the deficit now will keep interest rates low and the markets calm."
 ICX_E00_18:0 "A National Infrastructure Bank"
 ICX_E00_18_desc:0 "A state bank finances long-term investment in roads, railways and power."
 ICX_E00_19:0 "A Balanced Budget Rule"
 ICX_E00_19_desc:0 "The law now requires the budget to balance over the economic cycle."
 ICX_E00_20:0 "An Emerging Economy"
 ICX_E00_20_desc:0 "We are now counted among the emerging economies that are catching up with the rich world."
 ICX_E10_00:0 "The Digital Age"
 ICX_E10_00_desc:0 "Smartphones, data and automation are changing every industry. So is the climate."
 ICX_E10_01:0 "Advanced Manufacturing"
 ICX_E10_01_desc:0 "Robots, 3D printing and smart factories raise productivity."
 ICX_E10_02:0 "Semiconductors"
 ICX_E10_02_desc:0 "Every car, phone and appliance now runs on chips. We want our share of making them."
 ICX_E10_03:0 "Electric Vehicles"
 ICX_E10_03_desc:0 "Battery factories and electric car plants are the industries of the future."
 ICX_E10_04:0 "Mobile Broadband"
 ICX_E10_04_desc:0 "4G and then 5G networks put fast internet in every pocket."
 ICX_E10_05:0 "Solar and Wind Power"
 ICX_E10_05_desc:0 "Solar panels and wind turbines are now the cheapest new power in most of the world."
 ICX_E10_06:0 "Smart Grids"
 ICX_E10_06_desc:0 "A digital grid balances power from the sun and wind with demand."
 ICX_E10_07:0 "Precision Agriculture"
 ICX_E10_07_desc:0 "Satellites, sensors and drones tell farmers exactly how much water and fertiliser each field needs."
 ICX_E10_08:0 "Climate-Resilient Farming"
 ICX_E10_08_desc:0 "Drought-tolerant crops and better water management protect harvests from a changing climate."
 ICX_E10_09:0 "Water Security"
 ICX_E10_09_desc:0 "Reservoirs, desalination and recycling secure water for cities and farms."
 ICX_E10_10:0 "Digital Payments"
 ICX_E10_10_desc:0 "Cashless payments by phone and card bring millions into the formal economy."
 ICX_E10_11:0 "Fintech"
 ICX_E10_11_desc:0 "New financial firms offer loans, insurance and investment online."
 ICX_E10_12:0 "Green Finance"
 ICX_E10_12_desc:0 "Green bonds and climate funds pay for clean energy and flood defences."
 ICX_E10_13:0 "Digital Skills"
 ICX_E10_13_desc:0 "Coding, data and engineering skills for the jobs of the future."
 ICX_E10_14:0 "Universal Health Coverage"
 ICX_E10_14_desc:0 "Every citizen has access to essential health care without falling into poverty."
 ICX_E10_15:0 "Pandemic Preparedness"
 ICX_E10_15_desc:0 "After COVID-19, stockpiles, laboratories and vaccine plants prepare the country for the next pandemic."
 ICX_E10_16:0 "The Platform Economy"
 ICX_E10_16_desc:0 "Light regulation lets technology companies, start-ups and venture capital flourish."
 ICX_E10_17:0 "Industrial Strategy"
 ICX_E10_17_desc:0 "The state backs strategic industries with subsidies, public procurement and development banks."
 ICX_E10_18:0 "Start-Up Visas"
 ICX_E10_18_desc:0 "Fast visas and tax breaks for founders and engineers from abroad."
 ICX_E10_19:0 "National Champions"
 ICX_E10_19_desc:0 "A few large firms are helped to compete with the world's giants."
 ICX_E10_20:0 "The Knowledge Economy"
 ICX_E10_20_desc:0 "Ideas, skills and technology are now our most valuable exports."
 ICX_dev_E50_plan:0 "The First Development Plan"
 ICX_dev_E50_plan_desc:0 "Public investment under the plan speeds up every building site in the country."
 ICX_dev_E60_plan:0 "The Second Development Plan"
 ICX_dev_E60_plan_desc:0 "A decade of planned development: industrial estates, dams and highways."
 ICX_dev_E70_plan:0 "The Third Development Plan"
 ICX_dev_E70_plan_desc:0 "A plan for a harder decade of dear energy and high inflation."
 ICX_dev_E80_plan:0 "Industrial Restructuring"
 ICX_dev_E80_plan_desc:0 "Old industries are closed or modernised; new ones take their place."
 ICX_dev_E90_plan:0 "Industrial Parks"
 ICX_dev_E90_plan_desc:0 "Ready-made industrial parks draw foreign investors."
 ICX_dev_E00_plan:0 "Manufacturing for China"
 ICX_dev_E00_plan_desc:0 "Our factories feed the supply chains of the world's workshop."
 ICX_dev_E10_plan:0 "Advanced Manufacturing"
 ICX_dev_E10_plan_desc:0 "Robots, data and smart factories raise productivity."
 ICX_dev_tt_lit_5:0 "Literacy rises by §G5§! points in every core state."
 ICX_dev_tt_sec_3:0 "Secondary schooling rises by §G3§! points in every core state."
 ICX_dev_tt_col_2:0 "University education rises by §G2§! points in every core state."
 ICX_dev_tt_col_3:0 "University education rises by §G3§! points in every core state."
 ICX_dev_tt_sec_2:0 "Secondary schooling rises by §G2§! points in every core state."
 ICX_dev_tt_col_1:0 "University education rises by §G1§! points in every core state."
 ICX_dev_tt_sec_4:0 "Secondary schooling rises by §G4§! points in every core state."
 ICX_dev_shortcut_economy:0 "Economic Development"
 ICX_dev_upgrade_state_tt:0 "One of our states rises by §Gone development level§!."
 ICX_dev_econ_market_tt:0 "The economy moves one step towards the §Ymarket§!."
 ICX_dev_econ_planned_tt:0 "The economy moves one step towards §Yplanning§!."
 ICX_dev_econ_public_tt:0 "The economy moves one step towards §Ypublic ownership§!."
 ICX_dev_econ_private_tt:0 "The economy moves one step towards §Yprivate ownership§!."
 ICX_dev_econ_step_up_tt:0 "If our economy is still §Yfeudal§!, it moves one step towards a modern economy."
 ICX_dev_shortcut_E50:0 "Development: 1950s"
 ICX_dev_shortcut_E60:0 "Development: 1960s"
 ICX_dev_shortcut_E70:0 "Development: 1970s"
 ICX_dev_shortcut_E80:0 "Development: 1980s"
 ICX_dev_shortcut_E90:0 "Development: 1990s"
 ICX_dev_shortcut_E00:0 "Development: 2000s"
 ICX_dev_shortcut_E10:0 "Development: 2010s and beyond"
