l_english:
 PHI_Armed_Forces_of_the_Philippines_desc:0 "Rebuilt from the guerrilla bands and Philippine Scouts of the war, our armed forces must now face the Huks at home and the Cold War abroad."
 PHI_The_Quirino_Administration_desc:0 "Elpidio Quirino inherited a ravaged country when Roxas died in 1948. His government rebuilds roads and towns, but is accused of corruption and of fixing the 1949 election."
 PHI_Elections_of_1953_desc:0 "Ramon Magsaysay, the popular defence secretary who broke the Huks, challenges Quirino with American backing. The 1953 vote will decide the course of the decade."
 PHI_Election_of_1957_desc:0 "Magsaysay's death in a plane crash leaves Carlos P. Garcia in the palace. The 1957 election is the first test of the post-Magsaysay order."
 PHI_End_the_Huk_Insurgency_desc:0 "The Hukbalahap, wartime guerrillas turned communist rebels, still hold Central Luzon. Peace in the countryside is the first task of any government."
 PHI_Philippine_Air_Force_desc:0 "Born from the pre-war Army Air Corps, the Philippine Air Force must rebuild from American surplus."
 PHI_American_Douglas_A_20_Surplus_desc:0 "Surplus A-20 Havoc attack bombers from the United States will give our air force a strike capability against the guerrillas."
 PHI_Surplus_P_51_Mustangs_desc:0 "The P-51 Mustang, cheap and plentiful after the war, will be the backbone of our fighter squadrons."
 PHI_Expand_Villamor_Air_Base_desc:0 "Nichols Field near Manila, later named for the war hero Jesus Villamor, will become the main base of the Philippine Air Force."
 PHI_Import_F_86_Sabres_desc:0 "Jet fighters from the Korean War, the F-86 Sabre will take the Philippine Air Force into the jet age."
 PHI_Philippine_Army_desc:0 "The army is the shield of the Republic against invasion and rebellion alike."
 PHI_American_Advisors_desc:0 "American officers of JUSMAG will help train and organise our battalions."
 PHI_Establish_the_Tomas_Claudio_Memorial_College_desc:0 "The Philippine Military Academy at Fort del Pilar in Baguio will train a professional officer corps for the new republic."
 PHI_Counter_Insurgency_Training_desc:0 "Our veterans fought the Japanese in the jungles of Luzon and Mindanao. Their experience will be the core of our doctrine."
 PHI_Surplus_American_Weapons_desc:0 "Garands, carbines and Browning machine guns left over from the war will arm our infantry cheaply."
 PHI_Philippine_Navy_desc:0 "An island nation of seven thousand islands needs a navy to patrol its waters and stop smugglers."
 PHI_Establish_the_Naval_Air_Group_desc:0 "Patrol aircraft will extend the navy's eyes across the archipelago."
 PHI_Establish_the_Philippine_Marines_desc:0 "A marine corps, founded in 1950, will carry the fight against rebels to the coasts and islands."
 PHI_Joint_Cooperaiton_with_the_Republic_of_Koreas_Navy_desc:0 "Two young navies on the front line of the Cold War can learn from each other."
 PHI_American_Naval_Cooperation_desc:0 "The US Seventh Fleet at Subic Bay can train our sailors and transfer ships."
 PHI_Adopt_M14_desc:0 "The new American M14 rifle will replace the ageing Garand in our infantry."
 PHI_Philippine_Constabulary_desc:0 "The Constabulary, our national gendarmerie, keeps order in the provinces and bears the brunt of the Huk war."
 PHI_Expand_the_BCTs_desc:0 "Battalion Combat Teams, mobile and self-sufficient, proved the best answer to the Huk guerrillas."
 PHI_Maintain_Security_in_Moros_Lands_desc:0 "Mindanao and Sulu, with their Muslim population and old grievances, need careful policing."
 PHI_Improve_Counter_Insurgency_Trainings_desc:0 "Fighting guerrillas takes intelligence, patience and the trust of the villagers, not just firepower."
 PHI_Import_Modern_Police_Armored_Vehicles_desc:0 "Armoured cars will protect Constabulary patrols from ambush."
 PHI_Rough_Up_the_Opposition_desc:0 "The Liberal machine knows how to win an election: goons, guns and gold."
 PHI_Ward_off_Impeachment_Efforts_desc:0 "Opponents in Congress accuse the President of graft. The administration must survive the impeachment attempt."
 PHI_The_Elections_of_1949_desc:0 "Quirino faces Jose P. Laurel, wartime president under the Japanese, in an election that will be remembered as one of the dirtiest in our history."
 PHI_Quirino_Victory_desc:0 "Quirino keeps the presidency. The Liberal Party will carry on the reconstruction of the country."
 PHI_Inaugurate_the_Central_Bank_desc:0 "The Central Bank of the Philippines, opened in January 1949, gives the Republic control of its own currency and credit."
 PHI_Quirino_Foster_Agreement_desc:0 "In 1950 Quirino promised the Bell Mission tax and wage reforms in return for $250 million in American aid."
 PHI_JUS_MAG_desc:0 "The Joint United States Military Advisory Group trains and equips our forces under the 1947 Military Assistance Agreement."
 PHI_The_Baguio_Conference_desc:0 "In May 1950 Quirino hosted delegates from South and Southeast Asia and Australia in Baguio to discuss regional cooperation."
 PHI_Carlos_Garcia_Victory_desc:0 "Carlos P. Garcia wins the presidency and promises to put Filipinos first in their own economy."
 PHI_Filipino_First_Policy_desc:0 "Garcia's Filipino First policy gives Filipino businessmen priority in foreign exchange, licences and contracts."
 PHI_Revive_Filipino_Cultural_Arts_desc:0 "Our music, dance and literature, long overshadowed by Spain and America, deserve the support of the state."
 PHI_Assert_Domestic_Economic_Nationalism_desc:0 "Import controls and protection will let Filipino industry grow behind tariff walls."
 PHI_Laurel_Victory_desc:0 "Jose P. Laurel, the scholar and wartime president, wins power on a nationalist programme."
 PHI_Aid_Rural_Farmers_desc:0 "The tenant farmers of Luzon are the Huks' recruits. Helping them is the surest way to peace."
 PHI_Promote_Pan_Asianism_desc:0 "Laurel believes Asia's nations must stand together, free of Western domination."
 PHI_Rehabilitate_the_Second_Republic_desc:0 "The wartime republic under Japan is remembered with shame. Laurel wants its officials recognised as patriots who protected the people."
 PHI_Crush_the_Huks_desc:0 "No more talks: the army will hunt down the Huk field commanders."
 PHI_Economic_Cooperaiton_with_Japan_desc:0 "Our former occupier is rebuilding fast. Its capital and markets could help our recovery."
 PHI_Ramon_Magsaysay_desc:0 "A mechanic turned guerrilla leader and defence secretary, Ramon Magsaysay is the most popular man in the country."
 PHI_Mambo_Magsaysay_desc:0 "The campaign jingle 'Magsaysay is my guy' carried him to a landslide in 1953, one of the first modern media campaigns in Asia."
 PHI_Irrigation_Programs_desc:0 "Irrigation will double the rice harvest of the plains and free farmers from the whims of the monsoon."
 PHI_Ambuklao_Power_desc:0 "The Ambuklao dam on the Agno River will light Manila and northern Luzon."
 PHI_Crackdown_on_Communism_desc:0 "The Communist Party and its front organisations will be rooted out."
 PHI_Philippines_First_desc:0 "Our national interest must come before that of any foreign power."
 PHI_Censor_Leftist_Press_desc:0 "Newspapers that spread Huk propaganda will be closed."
 PHI_Military_Expansion_desc:0 "More battalions, more trucks, more radios: the army must grow."
 PHI_Increase_Ties_with_Indonesia_desc:0 "Indonesia, our great southern neighbour, shares our Malay heritage and our wariness of colonialism."
 PHI_Encourage_Philippine_Nationalism_desc:0 "A common national language, based on Tagalog, will bind the islands together."
 PHI_Emphasize_Tagalog_Education_desc:0 "Schools will teach in the national language as well as in English."
 PHI_CIA_Connections_desc:0 "Colonel Edward Lansdale of the CIA has become a trusted adviser. His psychological warfare methods could break the Huks."
 PHI_Presidential_Complaints_and_Action_Committee_desc:0 "Magsaysay's PCAC lets any citizen send a telegram to the President for five centavos, and expects an answer within days."
 PHI_National_Resettlement_and_Rehabilitation_Administration_desc:0 "NARRA will resettle landless farmers on public land in Mindanao and Palawan."
 PHI_The_Golden_Years_desc:0 "With the Huks broken and the economy growing, the country enjoys its best years since independence."
 PHI_Agricultural_Tenancy_Act_desc:0 "The Agricultural Tenancy Act of 1954 protects tenants from eviction and limits the landlord's share of the harvest."
 PHI_Expand_ACCFA_desc:0 "The Agricultural Credit and Cooperative Financing Administration lends to small farmers and their cooperatives."
 PHI_Expansion_of_Trade_desc:0 "New markets abroad for our sugar, copra and abaca will earn the dollars we need."
 PHI_Manuel_Manahan_Victory_desc:0 "Manuel Manahan, who ran Magsaysay's complaints committee, carries on his reforming legacy as president."
 PHI_The_Legacy_of_Magsaysay_desc:0 "Magsaysay died in 1957, but his ideal of honest government close to the people lives on."
 PHI_Encourage_Innovation_desc:0 "New industries need inventors, engineers and investors."
 PHI_American_Support_desc:0 "Washington sees us as its showcase of democracy in Asia and is ready to help."
 PHI_The_Philippine_Expeditionary_Force_desc:0 "Five battalion combat teams of the PEFTOK fought in Korea under the United Nations flag, at Yultong and elsewhere."
 PHI_Establish_the_Integrity_Board_desc:0 "An Integrity Board will investigate graft among public officials."
 PHI_Limited_Land_Reform_desc:0 "Moderate reform: buy some large estates for resale to tenants without angering the landed elite too much."
 PHI_Fireside_Chats_desc:0 "Like Roosevelt, the President will speak directly to the people over the radio."
 PHI_Establish_PACSA_desc:0 "The President's Action Committee on Social Amelioration will bring relief, cheap loans and services to poor families in the barrios."
 PHI_Establish_ACCFA_desc:0 "The Economic Development Corps gives surrendered Huks land and tools in Mindanao: 'all-out force or all-out friendship'."
 PHI_Establish_the_Social_Security_Commission_desc:0 "A Social Security Commission will prepare a pension system for workers."
 PHI_Ensure_American_Military_Access_desc:0 "The Military Bases Agreement of 1947 gives the Americans Clark and Subic; keeping them close guarantees our defence."
 PHI_Quirino_Victory_53_desc:0 "Quirino keeps the presidency. The Liberal Party will carry on the reconstruction of the country."
 PHI_Anti_Corruption_Campaign_desc:0 "Graft in the customs and the land offices must end."
 PHI_State_Visit_to_India_and_Indonesia_desc:0 "A tour of New Delhi and Jakarta will show that the Philippines is an Asian nation, not just an American ally."
 PHI_Expand_Corn_and_Rice_Production_desc:0 "Self-sufficiency in rice and corn will free us from costly imports."
 PHI_Avelino_Victory_desc:0 "Jose Avelino, the Senate president expelled by Quirino, wins power at the head of a Liberal splinter."
 PHI_Modernize_Workmen_Compensation_Law_desc:0 "Workers injured on the job deserve fair compensation."
 PHI_In_Power_For_desc:0 "Avelino's infamous words: if we cannot enjoy the spoils, what are we in power for? Patronage will reward the loyal."
 PHI_Promote_Worker_Unionism_desc:0 "Free unions will give workers a voice and keep them away from the communists."
 PHI_Lay_off_Quirinio_Supporters_desc:0 "Quirino's appointees will be purged from the bureaucracy."
 PHI_Limit_Church_Interference_in_Politics_desc:0 "The bishops have too much say over our laws and elections."
 PHI_Reduce_Foreign_Economic_Reliance_desc:0 "The Bell Trade Act ties our economy to America. We must diversify."
 PHI_Begin_Literacy_Programs_desc:0 "A national literacy drive will teach every Filipino to read and write."
 PHI_Expand_Social_Security_Benefits_desc:0 "The pension system will grow to cover more workers and their families."
 PHI_Ease_the_Peasants_Plights_desc:0 "Lower rents, cheaper credit and secure tenure will win the countryside back from the Huks."
 PHI_Redistrubute_Hacienda_Lands_desc:0 "The great haciendas of Central Luzon will be bought up and divided among their tenants."
 PHI_Enforced_Publicy_Servant_Morality_Disciplines_desc:0 "Civil servants will be held to strict standards of honesty and punctuality."
 PHI_Maintain_Security_Reliance_on_America_desc:0 "The American alliance is our best protection; we will not weaken it."
 PHI_Found_Constabulary_Anticorruption_Unit_desc:0 "A special Constabulary unit will investigate smuggling and graft."
 PHI_Reintroduce_Spanish_desc:0 "Spanish, the language of Rizal and the old elite, will be taught again in schools."
 PHI_Work_Towards_Economic_Recovery_desc:0 "Reconstruction of the war-ruined economy remains our first priority."
 PHI_Further_American_Relations_desc:0 "Closer ties with Washington will bring aid, investment and security."
 PHI_Promote_Urbanization_desc:0 "Manila and the provincial cities will grow as industry and services expand."
 PHI_Expand_the_Social_Security_Board_desc:0 "The Social Security System, created in 1954, will expand its coverage."
 PHI_Unemployment_Insurance_desc:0 "Workers who lose their jobs will receive support while they look for new ones."
 PHI_Invest_in_Rural_Health_desc:0 "Rural health units will bring doctors and nurses to every municipality."
 PHI_Establish_Pensions_desc:0 "Old age pensions will reward a lifetime of work."
 PHI_An_End_to_the_Huk_Insurgency_desc:0 "With Luis Taruc's surrender in 1954, the Huk rebellion is effectively over."
 PHI_Urban_Infrastructure_desc:0 "Roads, water and power for our growing cities."
 PHI_Increase_Housing_desc:0 "The People's Homesite and Housing Corporation will build homes for the urban poor."
 PHI_Develop_Airfields_desc:0 "Airfields across the islands will link the provinces to Manila."
 PHI_Expand_Access_to_Loans_desc:0 "Cheaper credit will help small businesses and farmers grow."
 PHI_Continule_Political_Repression_desc:0 "Opponents of the government will remain under surveillance and pressure."
 PHI_Political_Censorship_desc:0 "The press will be kept on a short leash."
 PHI_American_Security_desc:0 "American bases and the Mutual Defense Treaty guarantee our safety."
 PHI_Sideline_the_Nationalist_Citizens_Party_desc:0 "Claro Recto's nationalists threaten the American alliance. They must be kept out of power."
 PHI_Invest_in_Manilla_desc:0 "Manila, still scarred by the battle of 1945, will be rebuilt as a modern capital."
 PHI_Laurel_Langley_Agreement_desc:0 "The 1955 Laurel-Langley Agreement revises the Bell Trade Act: gradual tariffs, and parity rights for both Americans and Filipinos."
 PHI_American_Mutual_Defense_Pact_desc:0 "The Mutual Defense Treaty of 1951 binds the United States to our defence."
 PHI_Artesian_Wells_Campaign_desc:0 "Magsaysay's artesian wells bring clean water to thousands of barrios."
 PHI_Reduce_Corruption_desc:0 "Honest government will win the trust of the people."
 PHI_Rapid_Industrial_Growth_desc:0 "Protected by import controls, Filipino factories are springing up around Manila."
 PHI_Ban_Communism_desc:0 "The Anti-Subversion Law of 1957 outlaws the Communist Party."
 PHI_Jose_Yulo_Victory_desc:0 "Jose Yulo, the Liberal candidate and former Chief Justice, wins the presidency."
 PHI_Encourage_Free_Trade_desc:0 "Open markets and foreign investment will make us richer."
 PHI_Crackdown_on_Corruption2_desc:0 "Corrupt officials will be prosecuted, whatever their party."
 PHI_Economic_Strength_desc:0 "A strong economy is the foundation of a strong republic."
 PHI_Healthcare_Investments_desc:0 "Hospitals, clinics and medical schools for a healthier nation."
 PHI_Increase_Political_Freedoms_desc:0 "Free elections and a free press are the best answer to communism."
 PHI_Reject_Xenohpbic_Politics_desc:0 "Blaming the Chinese and the Americans for our problems helps no one."
 PHI_Increase_Womens_Rights_desc:0 "Filipino women won the vote in 1937; now they must have equal rights in law and work."
 PHI_Embrace_American_Capitalism_desc:0 "American investment and American methods will modernise our economy."
 PHI_Favor_Filipino_Owned_Businesses_desc:0 "Licences and foreign exchange will go first to Filipino-owned firms."
 PHI_Raise_Taxes_on_the_Wealthy_desc:0 "The landowners and the rich must pay their share."
 PHI_Marginalize_Chinese_Businessmen_desc:0 "The Retail Trade Nationalization Act of 1954 bars foreigners, mostly Chinese, from retail trade."
 PHI_Restrict_Free_Trade_desc:0 "Import controls will protect our young industries."
 PHI_Launch_Austerity_Program_desc:0 "Spending cuts will balance the budget and defend the peso."
 PHI_Crackdown_on_Corruption_desc:0 "Corrupt officials will be prosecuted, whatever their party."
 PHI_Business_Regulations_desc:0 "Rules for business will protect consumers and workers."
 PHI_Continued_Economic_Growth_desc:0 "Steady growth will lift millions out of poverty."
 PHI_Aid_Labor_Unions_desc:0 "The government will support the unions in their fight for fair wages."
 PHI_Welfare_Expansion_desc:0 "The state will look after the poor, the sick and the old."
 PHI_Negotiate_Early_Return_of_Bases_desc:0 "The American bases are a symbol of dependence. We will negotiate their early return."
 PHI_Accept_Japanese_War_Reparations_desc:0 "The 1956 reparations agreement brings $550 million in Japanese goods and services, and $250 million in loans."
 PHI_Quezon_City_Funding_desc:0 "Quezon City, the planned capital, needs funds to grow into a real seat of government."
 PHI_Aftermath_of_the_Bell_Trade_Act_desc:0 "The Bell Trade Act pegged the peso to the dollar and gave Americans equal rights to our resources. We live with its consequences."
 PHI_Resume_Sugar_Cane_Export_to_Japan_desc:0 "Japan's growing industry needs our sugar, copra and timber."
 PHI_Reclaim_Huk_Occupied_Haciendas_desc:0 "Estates abandoned during the rebellion will be returned to production."
 PHI_Dealing_With_Postwar_Economic_Crisis_desc:0 "A dollar shortage in 1949 forced import and exchange controls. We must stabilise the economy."
 PHI_Pass_the_Romulo_Snyder_Agreement_desc:0 "The Romulo-Snyder Agreement of 1950 settles our war-era debts with the United States."
 PHI_Pass_the_Laurel_Langley_Agreement_desc:0 "The Laurel-Langley Agreement replaces the Bell Trade Act with a fairer schedule of tariffs."
 PHI_Maintain_Trading_with_USA_desc:0 "America remains our largest market and supplier."
 PHI_Accept_Extra_American_Econmic_Aid_desc:0 "More aid from Washington will speed up reconstruction."
 PHI_Preserve_Lower_Exchange_Rates_desc:0 "Keeping the peso at two to the dollar protects importers and the middle class."
 PHI_Host_Phillipines_International_Fair_desc:0 "An international fair in Manila will show the world a modern Philippines."
 PHI_Cut_Down_on_Unnecessary_Expenses_desc:0 "Wasteful spending will be cut."
 PHI_Devalue_the_Peso_desc:0 "A cheaper peso will make our exports competitive, at the cost of dearer imports."
 PHI_Pass_Revised_Budget_Act_desc:0 "A modern budget law will bring order to public finances."
 PHI_Invest_in_Alto_Boardcasting_Corporations_desc:0 "Radio and the new medium of television will bring news and entertainment to the nation."
 PHI_Establish_the_Central_Bank_desc:0 "A central bank will manage our currency, reserves and credit."
 PHI_Found_SUNFED_desc:0 "We support a Special UN Fund for Economic Development to finance poor countries."
 PHI_Revive_Quezonian_Communism_desc:0 "Manuel Quezon's dream of social justice could inspire a Filipino socialism of our own."
 PHI_Diversify_our_Trading_Partners_desc:0 "We will trade with Europe, Japan and Asia, not only with America."
 PHI_Request_International_Economic_Aid_desc:0 "The World Bank and the IMF can finance our development."
 PHI_Promote_Japanese_Filipino_Technological_Exchange_desc:0 "Japanese engineers and Filipino students will exchange skills."
 PHI_Sign_SEA_Trade_Agreements_desc:0 "Trade with our neighbours will grow if tariffs fall."
 PHI_Pass_Land_Reform_Executive_Order_desc:0 "Executive Order 355 of 1950 created LASEDECO to resettle landless farmers."
 PHI_Organize_Irrigation_Rural_Infrastructure_Construction_desc:0 "Dams and canals will bring water to the rice fields."
 PHI_Begin_Rural_Banking_Agricultural_Credit_Programs_desc:0 "Rural banks will lend to farmers at fair rates, freeing them from usurers."
 PHI_Expand_LASEDECO_EDCOR_desc:0 "More settlement farms for landless families and former rebels."
 PHI_Expand_Rural_Settlements_desc:0 "New settlements in Mindanao will relieve the land hunger of Luzon."
 PHI_Pass_Republic_Act_1160_desc:0 "Republic Act 1160 of 1954 created NARRA to resettle the landless."
 PHI_Pass_Agriculutral_Tenancy_Act_desc:0 "A tenancy act will fix rents and protect tenants from eviction."
 PHI_Invest_in_Rehabilitation_and_Financing_Plantations_desc:0 "The Rehabilitation Finance Corporation will lend to large plantations to rebuild after the war."
 PHI_Import_Foreign_Modern_Equipments_desc:0 "Tractors and machinery from abroad will modernise our farms."
 PHI_Expand_Cash_Crop_Plantations_desc:0 "Sugar, coconut and abaca plantations earn the dollars we need."
 PHI_Formalize_Land_Reform_Act_desc:0 "A land reform act will allow the government to buy large estates and sell them to tenants."
 PHI_Muslim_Christian_Pledge_of_Brotherhood_desc:0 "Christian settlers and Muslim Moros must learn to live together in Mindanao."
 PHI_Use_Army_To_Combat_Settler_Violence_desc:0 "Clashes between settlers and Moros in Mindanao must be stopped."
 PHI_Fund_Phillipines_National_Auto_Club_desc:0 "Motoring will help unite the islands. A national auto club will promote road safety and tourism."
 PHI_Extend_MacArthur_Highway_desc:0 "The MacArthur Highway will be extended to Aparri, the northern tip of Luzon."
 PHI_Expand_National_Power_Corporation_desc:0 "The National Power Corporation will build dams and power lines across the country."
 PHI_Widen_Provincial_Avenida_desc:0 "Wider provincial roads for growing traffic."
 PHI_Modernize_NAWASA_Manila_Sewers_desc:0 "Manila's old sewers cannot cope with its growth."
 PHI_Fund_Ambuklao_Binga_Dam_Construction_desc:0 "The Ambuklao and Binga dams on the Agno River will provide power and control floods."
 PHI_Found_Bureau_of_Public_Highways_desc:0 "A Bureau of Public Highways will plan and build a national road network."
 PHI_The_Jeepey_Phenonmenon_desc:0 "Surplus American jeeps, painted and lengthened, have become the people's transport: the jeepney."
 PHI_Retooling_Zombie_Cars_desc:0 "Wrecked wartime vehicles can be rebuilt and put back on the road."
 PHI_Pass_Republic_Act_470_desc:0 "Republic Act 470 lets the Manila Railroad borrow up to 45 million pesos, with a government guarantee, to repair its war-damaged lines and buy new rolling stock."
 PHI_Import_US_Army_Locomotives_desc:0 "Surplus American locomotives will get the Manila Railroad running again."
 PHI_Begin_Cagayan_Valley_Railway_Extension_desc:0 "A railway into the Cagayan Valley will open up the north."
 PHI_Import_Japanese_Railway_Equipment_desc:0 "Japanese rolling stock, paid for with reparations, will modernise our railways."
 PHI_MRR_Dieselization_Program_desc:0 "The Manila Railroad will replace its steam engines with diesels."
 PHI_Begin_Bacnotan_Northern_Rail_Line_Extensions_desc:0 "The northern line will be extended past Bacnotan towards Ilocos."
 PHI_The_Huklabahap_Rebellion_desc:0 "The Hukbalahap, once heroes of the anti-Japanese resistance, have risen against the Republic in Central Luzon."
 PHI_Create_Closer_Ties_with_Free_Countries_desc:0 "We stand with the free nations of the world against communism."
 PHI_The_Indochina_War_desc:0 "France is fighting the Viet Minh in Indochina. Its outcome will shape all of Southeast Asia."
 PHI_Support_South_Vietnam_desc:0 "A free Vietnam is a shield for the Philippines. Operation Brotherhood sends Filipino doctors to help."
 PHI_Settling_Cha_Va_Refugees_desc:0 "Refugees fleeing the wars of Indochina need a place to live."
 PHI_Resettling_Chinese_Refugees_desc:0 "Chinese fleeing the communist victory on the mainland have arrived on our shores."
 PHI_Closer_Ties_to_Washington_desc:0 "Our future is bound to America's."
 PHI_Issue_Amnesty_for_Communist_Guerilas_desc:0 "An amnesty will bring the Huks down from the mountains."
 PHI_Defeat_of_The_Huklabahap_desc:0 "The Huk rebellion is over. Central Luzon can rebuild."
 PHI_The_Fall_of_the_Manila_desc:0 "The capital has fallen to the rebels."
 PHI_The_Creation_of_SEATO_desc:0 "The Manila Pact of 1954 creates the Southeast Asia Treaty Organization, with its seat in Bangkok."
 PHI_The_Korean_War_desc:0 "Communist North Korea has invaded the South. The United Nations calls on its members to help."
 PHI_Send_Volunteers_to_Korea_desc:0 "The Philippine Expeditionary Force to Korea will fight under the UN flag."
 PHI_Recognize_South_Korea_desc:0 "We will recognise the Republic of Korea as the legitimate government of Korea."
