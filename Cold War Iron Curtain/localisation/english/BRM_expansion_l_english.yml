 BRM_x_shortcut_energy:0 "Energy and Mines"
 BRM_x_shortcut_agriculture:0 "Agriculture"
 BRM_x_shortcut_transport:0 "Transport"
 BRM_x_shortcut_finance:0 "Finance and Trade"
 BRM_x_shortcut_society:0 "Education and Health"
 BRM_x_shortcut_cities:0 "Cities and Tourism"
