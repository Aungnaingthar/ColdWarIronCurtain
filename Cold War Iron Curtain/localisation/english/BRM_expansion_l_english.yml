l_english:
 BRM_x_union_economy:0 "The Ministry of National Planning"
 BRM_x_union_economy_desc:0 "Independence left Burma with ruined railways, flooded oil fields and an economy owned by foreign firms. The new Ministry of National Planning sets out to build a modern economy owned by Burmese."
 BRM_x_two_year_plan:0 "The Two-Year Plan of 1948"
 BRM_x_two_year_plan_desc:0 "The AFPFL's first plan promised to nationalise land, timber and river transport and to rebuild what the war had destroyed. Few of its targets were met, but it set the direction for a decade."
 BRM_x_economic_board:0 "The Economic and Social Board"
 BRM_x_economic_board_desc:0 "Chaired by the Prime Minister, the Economic and Social Board brings the ministers, planners and state corporations together to decide what the Union builds and in what order."
 BRM_x_kta_report:0 "The KTA Report"
 BRM_x_kta_report_desc:0 "The American engineering firm Knappen Tippetts Abbett surveys the whole country. Its 1953 report maps out dams, ports, mills and roads for the next eight years."
 BRM_x_nathan_advisers:0 "Robert Nathan Associates"
 BRM_x_nathan_advisers_desc:0 "A team of American economists works inside the planning ministry, training Burmese staff and building the statistics a modern government needs."
 BRM_x_eight_year_plan:0 "The Eight-Year Development Programme"
 BRM_x_eight_year_plan_desc:0 "Launched at the Pyidawtha Conference, the programme aims to raise national output above pre-war levels by 1960 with public investment in power, industry and transport."
 BRM_x_rice_slump:0 "The Rice Price Slump of 1953"
 BRM_x_rice_slump_desc:0 "After the Korean War boom, world rice prices fall and our foreign exchange reserves halve. Spending must be cut and the plan re-ordered before the crisis becomes a collapse."
 BRM_x_four_year_plan:0 "The Four-Year Plan of 1956"
 BRM_x_four_year_plan_desc:0 "A smaller, more realistic plan replaces the old targets. Money goes first to projects that are half-built and to those that earn foreign exchange quickly."
 BRM_x_samb:0 "The State Agricultural Marketing Board"
 BRM_x_samb_desc:0 "The Board buys the farmers' paddy at a fixed price and sells it abroad at world prices. The difference pays for much of the Union's development."
 BRM_x_barter_deals:0 "Rice-for-Goods Barter Deals"
 BRM_x_barter_deals_desc:0 "With rice piling up unsold, the Union signs barter agreements with the Soviet Union, China and the people's democracies of Eastern Europe: rice in exchange for machinery, cement and steel."
 BRM_x_eca_aid:0 "The ECA Aid Agreement"
 BRM_x_eca_aid_desc:0 "Under the 1950 agreement with the American Economic Cooperation Administration, aid money pays for engineers, medicine and equipment for our ports and hospitals."
 BRM_x_end_us_aid:0 "End the American Aid Programme"
 BRM_x_end_us_aid_desc:0 "Washington arms the Kuomintang troops occupying the Shan States. In 1953 Burma asks the Americans to end their aid. Our neutrality is not for sale."
 BRM_x_keep_us_aid:0 "Keep the American Aid Programme"
 BRM_x_keep_us_aid_desc:0 "The Kuomintang problem can be settled by diplomacy. American dollars keep flowing into our development projects."
 BRM_x_pl480:0 "The PL-480 Agreement"
 BRM_x_pl480_desc:0 "The 1956 agreement lets Burma buy American farm surplus with kyat. The Americans lend the kyat back to us for development, at very low interest."
 BRM_x_union_bank:0 "The Union Bank of Burma"
 BRM_x_union_bank_desc:0 "Our own central bank issues the kyat, which in 1952 replaces the Indian-era rupee, and manages the Union's reserves of sterling and gold."
 BRM_x_burmanisation:0 "Burmanisation of Commerce"
 BRM_x_burmanisation_desc:0 "Import licences are reserved for Burmese nationals so that trade passes from Indian and British firms into Burmese hands. Many licence holders simply sell their papers to the old firms."
 BRM_x_state_enterprises:0 "State Enterprises"
 BRM_x_state_enterprises_desc:0 "The Union becomes owner and manager of mills, mines, ships and aircraft. A generation of Burmese managers learns to run them."
 BRM_x_boc_venture:0 "The Burma Oil Company Joint Venture"
 BRM_x_boc_venture_desc:0 "In 1954 the government takes a third of the Burmah Oil Company's Burmese business. The joint company rebuilds the wells of Yenangyaung and Chauk."
 BRM_x_bawdwin_mines:0 "The Bawdwin Mines"
 BRM_x_bawdwin_mines_desc:0 "The great lead, silver and zinc mine at Namtu is reopened as a joint venture with the Burma Corporation. Its ore once made Burma one of the world's leading silver producers."
 BRM_x_five_star_line:0 "The Burma Five Star Line"
 BRM_x_five_star_line_desc:0 "A national shipping line carries our rice and teak to the world under the Union flag, instead of in British and Indian ships."
 BRM_x_union_airways:0 "Union of Burma Airways"
 BRM_x_union_airways_desc:0 "Our national airline flies Dakotas to the hill towns that have no roads, and Viscounts to Calcutta, Bangkok and Singapore."
 BRM_x_cottage_industries:0 "The Cottage Industries Department"
 BRM_x_cottage_industries_desc:0 "Handloom weaving, lacquerware and pottery employ more Burmese than all the factories. Cheap credit and cooperative shops help village craftsmen."
 BRM_x_sugar_mills:0 "State Sugar Mills"
 BRM_x_sugar_mills_desc:0 "The state expands the sugar mills of the Sittang valley so that Burma no longer spends foreign exchange on imported sugar."
 BRM_x_village_selfhelp:0 "Village Self-Help Grants"
 BRM_x_village_selfhelp_desc:0 "Every village that raises labour and materials for a well, a school or a road receives a matching grant from the Pyidawtha fund."
 BRM_x_un_experts:0 "United Nations Technical Assistance"
 BRM_x_un_experts_desc:0 "Experts from the UN and its agencies advise on everything from fisheries to statistics, and Burmese students study abroad on UN fellowships."
 BRM_x_welfare_economy:0 "A Welfare State on the Irrawaddy"
 BRM_x_welfare_economy_desc:0 "The Union has rebuilt what the war destroyed. Its next goal is a welfare state in which every family has land, work, schooling and medicine."
 BRM_x_soc_economy:0 "The Socialist Economy"
 BRM_x_soc_economy_desc:0 "The Revolutionary Council takes the commanding heights of the economy. Private capital, foreign or domestic, is to give way to state corporations run for the people."
 BRM_x_nationalise_banks:0 "Nationalise the Banks"
 BRM_x_nationalise_banks_desc:0 "In February 1963 all twenty-four banks in the country, most of them foreign, become numbered branches of the People's Bank."
 BRM_x_demonetise_1964:0 "The Demonetisation of 1964"
 BRM_x_demonetise_1964_desc:0 "Overnight the fifty and one-hundred kyat notes lose their value. Hoarders and black marketeers are ruined, and so are many honest families."
 BRM_x_demonetise_1985:0 "The Demonetisation of 1985"
 BRM_x_demonetise_1985_desc:0 "The one-hundred, fifty and twenty kyat notes are withdrawn with little warning, in a new attempt to break the black market."
 BRM_x_demonetise_1987:0 "The Demonetisation of 1987"
 BRM_x_demonetise_1987_desc:0 "The twenty-five, thirty-five and seventy-five kyat notes are cancelled and replaced with notes of forty-five and ninety kyat. Three quarters of the money in circulation vanishes, and the students take to the streets."
 BRM_x_trade_corporations:0 "The Trade Corporations"
 BRM_x_trade_corporations_desc:0 "State trade corporations take over imports, exports and wholesale trade. Foreign merchant houses close and their staff leave the country."
 BRM_x_peoples_shops:0 "The People's Shops"
 BRM_x_peoples_shops_desc:0 "Rationed rice, cloth, cooking oil and soap are sold at fixed prices through People's Shops in every township."
 BRM_x_cooperative_law:0 "The Cooperative Societies Law"
 BRM_x_cooperative_law_desc:0 "Under the 1970 law, consumer and producer cooperatives become the backbone of distribution in the villages."
 BRM_x_border_trade:0 "Tolerate the Border Trade"
 BRM_x_border_trade_desc:0 "Smugglers carry teak, jade and cattle into Thailand and bring back the consumer goods our factories cannot make. Shutting the trade down would empty the bazaars."
 BRM_x_rice_procurement:0 "Compulsory Paddy Procurement"
 BRM_x_rice_procurement_desc:0 "Farmers must sell a fixed quota of paddy to the state at a fixed price. The state earns the export profit; the farmer pays for it."
 BRM_x_peasants_rights:0 "The Peasants' Rights Protection Law"
 BRM_x_peasants_rights_desc:0 "The 1963 law forbids the seizure of a farmer's land, cattle and tools for debt. The moneylenders' grip on the villages is broken."
 BRM_x_tenancy_abolished:0 "Abolish Land Rents"
 BRM_x_tenancy_abolished_desc:0 "From 1965 the tiller no longer pays rent to a landlord. The land belongs to the state, and the right to farm it belongs to the man who works it."
 BRM_x_whole_township:0 "The Whole Township Programme"
 BRM_x_whole_township_desc:0 "Entire townships switch at once to high-yield rice, fertiliser and irrigation. By the mid-1980s the national harvest is half as large again."
 BRM_x_workers_councils:0 "Workers' Councils"
 BRM_x_workers_councils_desc:0 "The Fundamental Workers' Rights Law of 1964 creates workers' councils in every factory and promises secure jobs and fair wages."
 BRM_x_workers_rations:0 "Raise the Workers' Rations"
 BRM_x_workers_rations_desc:0 "After the strikes of June 1974 at the Thamaing textile mill and the Sinmalaik dockyard, the government raises the rice ration for workers."
 BRM_x_basic_economic_policy:0 "The Basic Economic Policies of 1972"
 BRM_x_basic_economic_policy_desc:0 "The Party admits that a decade of socialism has brought shortages, and lays down long-term policies to raise output: more agriculture, more exports, more foreign aid."
 BRM_x_twenty_year_plan:0 "The Twenty-Year Plan"
 BRM_x_twenty_year_plan_desc:0 "Five Four-Year Plans are to make Burma a socialist industrial nation by 1994."
 BRM_x_first_fyp:0 "The First Four-Year Plan"
 BRM_x_first_fyp_desc:0 "The first plan, from 1974 to 1978, rebuilds a run-down economy. Its targets are modest and still largely missed."
 BRM_x_second_fyp:0 "The Second Four-Year Plan"
 BRM_x_second_fyp_desc:0 "With foreign aid and the new rice varieties, the economy grows at six per cent a year for the first time since independence."
 BRM_x_third_fyp:0 "The Third Four-Year Plan"
 BRM_x_third_fyp_desc:0 "The third plan borrows heavily to build. When export prices fall, the debt remains."
 BRM_x_aid_burma_group:0 "The Aid Burma Group"
 BRM_x_aid_burma_group_desc:0 "The World Bank gathers the donor countries into an Aid Burma Group. After a decade of isolation, foreign aid returns."
 BRM_x_yen_loans:0 "Japanese Yen Loans"
 BRM_x_yen_loans_desc:0 "Japan becomes our largest donor by far, financing factories, power stations and the Rangoon water supply."
 BRM_x_rice_liberalised:0 "Free the Trade in Rice"
 BRM_x_rice_liberalised_desc:0 "In September 1987 the government allows farmers to sell rice, maize and pulses freely for the first time in twenty-four years."
 BRM_x_ldc_status:0 "Least Developed Country Status"
 BRM_x_ldc_status_desc:0 "The United Nations classes Burma among the world's poorest countries. Our debts are softened, but the shame is felt in every household."
 BRM_x_dev_economy:0 "An Export Economy"
 BRM_x_dev_economy_desc:0 "Brigadier Aung Gyi's way: the army keeps order, but rice merchants, mill owners and foreign partners are left free to grow the economy."
 BRM_x_investment_board:0 "The Burma Investment Board"
 BRM_x_investment_board_desc:0 "A single office now licenses foreign investors, guarantees their profits and finds them land, power and workers."
 BRM_x_export_zones:0 "Export Processing Zones"
 BRM_x_export_zones_desc:0 "Duty-free zones at the ports let foreign firms import parts and export finished goods, as Taiwan has done at Kaohsiung."
 BRM_x_garment_exports:0 "Garments for the World"
 BRM_x_garment_exports_desc:0 "Sewing workshops in Rangoon fill orders for European and American shops. Tens of thousands of young women find work."
 BRM_x_japanese_partners:0 "Joint Ventures with Japanese Firms"
 BRM_x_japanese_partners_desc:0 "Japanese companies assemble motorcycles, radios and sewing machines in partnership with Burmese firms."
 BRM_x_transistor_radios:0 "Transistor Radios from Rangoon"
 BRM_x_transistor_radios_desc:0 "The first electronics assembly lines in the country turn out radios and televisions for the home market."
 BRM_x_rice_exchange:0 "The Rangoon Rice Exchange"
 BRM_x_rice_exchange_desc:0 "Private merchants again bid for paddy on an open exchange. Farmers are paid the market price, and they plant more."
 BRM_x_land_titles:0 "Land Titles for Farmers"
 BRM_x_land_titles_desc:0 "A farmer with a title to his land can borrow against it, improve it and pass it to his children."
 BRM_x_gems_auctions:0 "Open the Gems Emporium to Foreign Buyers"
 BRM_x_gems_auctions_desc:0 "Jade, rubies and sapphires are sold at open auction in Rangoon to foreign buyers, instead of being smuggled across the borders."
 BRM_x_open_tourism:0 "Open the Country to Tourists"
 BRM_x_open_tourism_desc:0 "Visas are extended from one day to a month. Pagan, Mandalay and Inle Lake begin to draw visitors."
 BRM_x_convertible_kyat:0 "A Convertible Kyat"
 BRM_x_convertible_kyat_desc:0 "A kyat that can be freely exchanged for dollars kills the black market in currency and reassures foreign investors."
 BRM_x_mandalay_estates:0 "Industrial Estates of Mandalay"
 BRM_x_mandalay_estates_desc:0 "Mandalay, the old royal capital, becomes the industrial centre of Upper Burma."
 BRM_x_next_tiger:0 "Asia's Next Tiger"
 BRM_x_next_tiger_desc:0 "Burma is again what it was before the war: one of the richest countries in Southeast Asia, and now growing faster than its neighbours."
 BRM_x_demo_economy:0 "Pyidawtha Renewed"
 BRM_x_demo_economy_desc:0 "Parliament survives, and so does the dream of Pyidawtha. A democratic Burma will build its welfare state step by step, with the consent of its people."
 BRM_x_buddhist_economics:0 "Buddhist Economics"
 BRM_x_buddhist_economics_desc:0 "The economist E. F. Schumacher advised the Union in 1955 and later wrote that the aim of an economy should be the well-being of people, not the size of its output. Burma takes him at his word."
 BRM_x_intermediate_tech:0 "Intermediate Technology"
 BRM_x_intermediate_tech_desc:0 "Simple, cheap machines that a village can build and repair itself: pumps, rice hullers and looms."
 BRM_x_village_industries:0 "Village Industries"
 BRM_x_village_industries_desc:0 "Small workshops spread across the countryside, so that young people find work without leaving for Rangoon."
 BRM_x_coop_banks:0 "Cooperative Banks"
 BRM_x_coop_banks_desc:0 "Farmers' cooperatives pool their savings and lend to their own members, at a fraction of the moneylender's rate."
 BRM_x_rural_power_coops:0 "Rural Electricity Cooperatives"
 BRM_x_rural_power_coops_desc:0 "Village cooperatives build small power lines and diesel generators, bringing light to the countryside."
 BRM_x_crop_insurance:0 "Crop Insurance for Paddy Farmers"
 BRM_x_crop_insurance_desc:0 "A bad monsoon will no longer ruin a family. A small premium protects the harvest."
 BRM_x_workers_housing:0 "Workers' Housing Estates"
 BRM_x_workers_housing_desc:0 "New housing estates with clean water and drains are built for the workers of Rangoon and Mandalay."
 BRM_x_health_insurance:0 "National Health Insurance"
 BRM_x_health_insurance_desc:0 "Every worker and his family are insured against illness, paid for by small contributions from wages."
 BRM_x_mixed_corporations:0 "Joint State and Private Corporations"
 BRM_x_mixed_corporations_desc:0 "The state provides the capital, private managers run the business, and the profits are shared."
 BRM_x_european_partners:0 "Development Partners in Europe"
 BRM_x_european_partners_desc:0 "Scandinavian and West German aid finances schools, hospitals and technical colleges."
 BRM_x_planning_parliament:0 "A Planning Commission Answerable to Parliament"
 BRM_x_planning_parliament_desc:0 "Every major project must now be justified in public before the elected representatives of the people."
 BRM_x_middle_way:0 "The Middle Way"
 BRM_x_middle_way_desc:0 "Neither capitalism nor communism: a Burmese road that grows the economy while leaving no family behind."
 BRM_x_com_economy:0 "The People's Economy"
 BRM_x_com_economy_desc:0 "The Communist Party of Burma rules from Rangoon. The economy is to be rebuilt on the model of the socialist camp."
 BRM_x_producers_coops:0 "Agricultural Producers' Cooperatives"
 BRM_x_producers_coops_desc:0 "Peasant families pool their land, cattle and tools into cooperatives. The Party promises that collective work will double the harvest."
 BRM_x_communes:0 "People's Communes in the Delta"
 BRM_x_communes_desc:0 "Following the Chinese example, whole districts of the delta become communes, with shared kitchens, militias and workshops."
 BRM_x_state_farms:0 "State Farms on the Soviet Model"
 BRM_x_state_farms_desc:0 "Large mechanised state farms, with tractors and agronomists from the Soviet Union, are founded on the dry zone plains."
 BRM_x_people_five_year_plan:0 "The First Five-Year Plan"
 BRM_x_people_five_year_plan_desc:0 "A central plan sets the output of every factory, mine and farm for the next five years."
 BRM_x_heavy_industry_first:0 "Heavy Industry First"
 BRM_x_heavy_industry_first_desc:0 "Steel, cement and machine tools come before consumer goods. The sacrifice of today is the prosperity of tomorrow."
 BRM_x_comecon_observer:0 "Observer at Comecon"
 BRM_x_comecon_observer_desc:0 "As an observer at the Council for Mutual Economic Assistance, the people's republic gains credits and technical help from the socialist countries."
 BRM_x_fraternal_aid:0 "Fraternal Aid Projects"
 BRM_x_fraternal_aid_desc:0 "Engineers from our socialist allies build power stations, bridges and a tractor plant."
 BRM_x_peoples_bank:0 "A Single People's Bank"
 BRM_x_peoples_bank_desc:0 "One state bank holds every account in the country and finances the plan."
 BRM_x_labour_campaigns:0 "Mass Labour Campaigns"
 BRM_x_labour_campaigns_desc:0 "Brigades of volunteers dig canals and build dykes in the dry season."
 BRM_x_socialist_construction:0 "Socialist Construction"
 BRM_x_socialist_construction_desc:0 "The foundations of a socialist industrial economy have been laid."
 BRM_x_open_door:0 "The Open Door"
 BRM_x_open_door_desc:0 "Twenty-six years of the Burmese Way to Socialism are over. The generals announce a market economy and open the door to foreign trade and investment."
 BRM_x_fil_1988:0 "The Foreign Investment Law of 1988"
 BRM_x_fil_1988_desc:0 "Foreign companies may now own their Burmese businesses outright or in joint ventures, with guarantees against nationalisation."
 BRM_x_seel_1989:0 "The State-owned Economic Enterprises Law"
 BRM_x_seel_1989_desc:0 "The 1989 law reserves twelve sectors for the state, among them teak, oil, gems and telecommunications, and opens everything else to private business."
 BRM_x_umehl:0 "Union of Myanmar Economic Holdings"
 BRM_x_umehl_desc:0 "A holding company owned by the Defence Ministry and serving officers enters banking, gems, tobacco, beer and trading. The army becomes the largest business in the country."
 BRM_x_mec:0 "The Myanmar Economic Corporation"
 BRM_x_mec_desc:0 "A second military conglomerate takes over steel mills, cement works, mines and a bank."
 BRM_x_crony_tycoons:0 "The Tycoons"
 BRM_x_crony_tycoons_desc:0 "A handful of businessmen close to the generals win the licences, the logging concessions and the construction contracts. Their companies build the new capital."
 BRM_x_privatisation_2009:0 "The Great Privatisation"
 BRM_x_privatisation_2009_desc:0 "Before the new government takes office, hundreds of state factories, ports, fuel stations and buildings are sold, mostly to well-connected buyers."
 BRM_x_china_border_trade:0 "Border Trade with China"
 BRM_x_china_border_trade_desc:0 "The 1988 agreement opens the border crossings at Muse and Lweje. Chinese consumer goods pour south; teak, jade and rice flow north."
 BRM_x_muse_zone:0 "The 105th Mile Trade Zone"
 BRM_x_muse_zone_desc:0 "A modern border trade zone at Muse becomes the busiest land port in the country, handling most of the trade with China."
 BRM_x_thai_border_trade:0 "Border Trade with Thailand"
 BRM_x_thai_border_trade_desc:0 "The crossings at Myawaddy and Tachileik are opened to legal trade, ending the smugglers' monopoly."
 BRM_x_visit_myanmar:0 "Visit Myanmar Year 1996"
 BRM_x_visit_myanmar_desc:0 "New hotels open in Rangoon, Mandalay and Pagan for the first great tourism campaign. Fewer visitors come than hoped, but an industry is born."
 BRM_x_fec:0 "Foreign Exchange Certificates"
 BRM_x_fec_desc:0 "Foreign currency is exchanged for certificates that circulate like dollars, giving the country a second, unofficial currency."
 BRM_x_private_banks:0 "The First Private Banks"
 BRM_x_private_banks_desc:0 "For the first time since 1963, private banks open their doors. The Myawaddy Bank belongs to the army; the Kanbawza Bank is founded in Taunggyi."
 BRM_x_banking_crisis:0 "The Banking Crisis of 2003"
 BRM_x_banking_crisis_desc:0 "The collapse of informal finance companies starts a run on the private banks. Withdrawals are capped and confidence takes years to return."
 BRM_x_hlaing_tharyar:0 "Hlaing Tharyar Industrial Zone"
 BRM_x_hlaing_tharyar_desc:0 "West of Rangoon, the largest industrial zone in the country rises on former rice fields: garment factories, food processing plants and workshops."
 BRM_x_industrial_zones_90s:0 "Industrial Zones in Every Region"
 BRM_x_industrial_zones_90s_desc:0 "Industrial zones are laid out at Mandalay, Myingyan, Pakokku, Monywa, Pathein and Mawlamyine."
 BRM_x_garment_boom:0 "The Garment Boom"
 BRM_x_garment_boom_desc:0 "By 2000 garments are our largest manufactured export, sold to American and European chains, until the sanctions of 2003 close the American market."
 BRM_x_summer_paddy:0 "The Summer Paddy Programme"
 BRM_x_summer_paddy_desc:0 "With new irrigation, farmers grow a second rice crop in the dry season. Rice output rises sharply in the 1990s."
 BRM_x_irrigation_dams:0 "A Dam for Every Valley"
 BRM_x_irrigation_dams_desc:0 "The government builds more than two hundred irrigation dams and reservoirs, many by forced labour, across the dry zone and the hills."
 BRM_x_teak_concessions:0 "Teak and Timber Concessions"
 BRM_x_teak_concessions_desc:0 "Logging concessions along the Thai and Chinese borders bring in foreign currency quickly, and strip the forests of Kachin and Karen State."
 BRM_x_hpakant_jade:0 "The Jade Boom of Hpakant"
 BRM_x_hpakant_jade_desc:0 "Demand from China turns the jade mines of Hpakant into one of the richest, and most dangerous, places on earth."
 BRM_x_mandalay_airport:0 "Mandalay International Airport"
 BRM_x_mandalay_airport_desc:0 "A new international airport at Tada-U, the largest in the country, opens in 2000."
 BRM_x_sanctions_era:0 "Living with Sanctions"
 BRM_x_sanctions_era_desc:0 "American and European sanctions shut us out of Western markets. Our trade turns to China, Thailand, India and Singapore."
 BRM_x_dem_market:0 "A Democratic Market Economy"
 BRM_x_dem_market_desc:0 "The people won in 1988. The new government must now rebuild an economy ruined by twenty-six years of isolation."
 BRM_x_imf_programme:0 "An IMF Stabilisation Programme"
 BRM_x_imf_programme_desc:0 "The International Monetary Fund lends us dollars to stop inflation, in return for budget cuts and an end to price controls."
 BRM_x_kyat_float:0 "Float the Kyat"
 BRM_x_kyat_float_desc:0 "The official rate of six kyat to the dollar is abandoned. With one real exchange rate, the black market in currency withers away."
 BRM_x_independent_central_bank:0 "An Independent Central Bank"
 BRM_x_independent_central_bank_desc:0 "Monetary policy is taken out of the hands of ministers."
 BRM_x_western_investment:0 "The Return of Western Investors"
 BRM_x_western_investment_desc:0 "Oil companies, banks and hotel chains return to Rangoon, and with them the know-how of the world economy."
 BRM_x_mfa_quotas:0 "Garment Quotas under the Multi-Fibre Arrangement"
 BRM_x_mfa_quotas_desc:0 "Our share of the world's clothing quotas gives Burmese factories guaranteed markets in America and Europe."
 BRM_x_eu_preferences:0 "European Trade Preferences"
 BRM_x_eu_preferences_desc:0 "Duty-free access to the European market for our clothes, shoes and fish."
 BRM_x_adb_returns:0 "The Asian Development Bank Returns"
 BRM_x_adb_returns_desc:0 "The development banks resume lending after a decade, for roads, power and water."
 BRM_x_privatise_corporations:0 "Privatise the Trading Corporations"
 BRM_x_privatise_corporations_desc:0 "The old socialist trading corporations are sold or closed. Private firms take over the trade in rice, pulses and consumer goods."
 BRM_x_rangoon_exchange:0 "The Rangoon Stock Exchange"
 BRM_x_rangoon_exchange_desc:0 "Burmese companies raise capital from Burmese savers on a new stock exchange."
 BRM_x_land_registration:0 "Land Registration for Farmers"
 BRM_x_land_registration_desc:0 "Farmers receive land use certificates that can be sold, inherited and used to borrow money."
 BRM_x_mobile_licences:0 "Mobile Telephone Licences"
 BRM_x_mobile_licences_desc:0 "Private companies compete to build mobile phone networks."
 BRM_x_democratic_dividend:0 "The Democratic Dividend"
 BRM_x_democratic_dividend_desc:0 "Freedom has paid. Investors trust our courts, donors trust our budget, and the economy grows by more than seven per cent a year."
 BRM_x_doi_moi:0 "Renovation on the Irrawaddy"
 BRM_x_doi_moi_desc:0 "Like Vietnam's Doi Moi, our renovation keeps the Party in power and lets the market do the work."
 BRM_x_household_contracts:0 "The Household Contract System"
 BRM_x_household_contracts_desc:0 "Each family farms its own plot. Once it has delivered its quota to the state, it may sell the rest at market prices."
 BRM_x_enterprise_autonomy:0 "Autonomy for State Enterprises"
 BRM_x_enterprise_autonomy_desc:0 "Managers of state enterprises may set prices, hire workers and keep a share of the profits."
 BRM_x_township_enterprises:0 "Township and Village Enterprises"
 BRM_x_township_enterprises_desc:0 "Local governments and villages start their own factories, from brickworks to garment workshops."
 BRM_x_chinese_jvs:0 "Joint Ventures with Chinese Firms"
 BRM_x_chinese_jvs_desc:0 "Chinese capital and machinery arrive across the northern border."
 BRM_x_socialist_sez:0 "Special Economic Zones on the Chinese Model"
 BRM_x_socialist_sez_desc:0 "Export zones with their own rules are opened at the ports."
 BRM_x_party_technocrats:0 "Party Technocrats"
 BRM_x_party_technocrats_desc:0 "Engineers and economists replace old revolutionaries in the ministries."
 BRM_x_socialist_market:0 "A Socialist-Oriented Market Economy"
 BRM_x_socialist_market_desc:0 "The Party rules, the market grows. Our model is now studied in Hanoi and Vientiane."
 BRM_x_reform_decade:0 "The Reform Decade"
 BRM_x_reform_decade_desc:0 "A new government, new laws and a flood of foreign interest. For ten years the economy opens faster than at any time since independence."
 BRM_x_exchange_unification:0 "Exchange Rate Unification"
 BRM_x_exchange_unification_desc:0 "In April 2012 the official rate of six kyat to the dollar, pegged since 1977, is replaced by a managed float close to the market rate."
 BRM_x_cbm_law:0 "The Central Bank of Myanmar Law"
 BRM_x_cbm_law_desc:0 "The 2013 law makes the central bank independent of the Ministry of Finance and gives it control of monetary policy."
 BRM_x_foreign_banks:0 "Licences for Foreign Banks"
 BRM_x_foreign_banks_desc:0 "Nine foreign banks from Japan, Singapore, Thailand, Malaysia, China and Australia receive licences in 2014, the first in fifty years."
 BRM_x_insurance_opening:0 "Open the Insurance Market"
 BRM_x_insurance_opening_desc:0 "Foreign insurers are allowed into the market from 2019, in joint ventures and on their own."
 BRM_x_mobile_money:0 "Mobile Money"
 BRM_x_mobile_money_desc:0 "Wave Money and KBZPay let millions of people with no bank account send and receive money on their phones."
 BRM_x_treasury_bonds:0 "Treasury Bond Auctions"
 BRM_x_treasury_bonds_desc:0 "The government borrows from the market at auction instead of printing money at the central bank."
 BRM_x_fil_2012:0 "The Foreign Investment Law of 2012"
 BRM_x_fil_2012_desc:0 "A new law opens most of the economy to foreign investors, with tax holidays and long land leases."
 BRM_x_mic:0 "The Myanmar Investment Commission"
 BRM_x_mic_desc:0 "A single commission screens and approves investment proposals. Billions of dollars in commitments arrive within a few years."
 BRM_x_mil_2016:0 "The Myanmar Investment Law"
 BRM_x_mil_2016_desc:0 "The 2016 law treats foreign and domestic investors alike and offers tax breaks for investment in the poorer regions."
 BRM_x_companies_law:0 "The Myanmar Companies Law"
 BRM_x_companies_law_desc:0 "Replacing a law from 1914, the new Companies Law lets foreigners own up to a third of a local company and moves registration online."
 BRM_x_ysx:0 "The Yangon Stock Exchange"
 BRM_x_ysx_desc:0 "Trading begins in March 2016 with a single share. Within a few years half a dozen companies are listed."
 BRM_x_eu_gsp:0 "European Trade Preferences Restored"
 BRM_x_eu_gsp_desc:0 "In 2013 the European Union restores duty-free access for everything we make except arms."
 BRM_x_garment_2010s:0 "The Garment Export Boom"
 BRM_x_garment_2010s_desc:0 "By 2019 garment exports reach five billion dollars and employ more than half a million workers, most of them young women."
 BRM_x_us_sanctions_lifted:0 "American Sanctions Lifted"
 BRM_x_us_sanctions_lifted_desc:0 "In October 2016 the United States ends its remaining economic sanctions and restores trade preferences."
 BRM_x_aec:0 "The ASEAN Economic Community"
 BRM_x_aec_desc:0 "At the end of 2015 the ten ASEAN economies form a single market and production base. Tariffs between members fall towards zero."
 BRM_x_cmec:0 "The China-Myanmar Economic Corridor"
 BRM_x_cmec_desc:0 "A corridor of railways, roads and industrial zones is planned from Yunnan through Mandalay to the sea at Kyaukphyu."
 BRM_x_dawei_sez:0 "Dawei Special Economic Zone"
 BRM_x_dawei_sez_desc:0 "Thailand and Japan join us in planning a deep-sea port and industrial zone at Dawei, linked by road to Bangkok."
 BRM_x_sez_law:0 "The Special Economic Zones Law"
 BRM_x_sez_law_desc:0 "The 2014 law sets the rules for Thilawa, Dawei and Kyaukphyu: tax holidays, one-stop services and long land leases."
 BRM_x_farmland_law:0 "The Farmland Law of 2012"
 BRM_x_farmland_law_desc:0 "Farmers receive land use certificates that can be sold, mortgaged and inherited."
 BRM_x_microfinance_law:0 "The Microfinance Law"
 BRM_x_microfinance_law_desc:0 "Licensed microfinance institutions lend small sums to farmers, traders and market women across the country."
 BRM_x_electrification_plan:0 "The National Electrification Plan"
 BRM_x_electrification_plan_desc:0 "With World Bank support, the plan aims to bring electricity to every household by 2030. In 2014 only a third have it."
 BRM_x_tax_reform:0 "Tax Administration Reform"
 BRM_x_tax_reform_desc:0 "A large taxpayer office and self-assessment begin to modernise one of the lowest tax collections in the world."
 BRM_x_pfm_reform:0 "Public Financial Management Reform"
 BRM_x_pfm_reform_desc:0 "The budget is published, audited and debated in parliament."
 BRM_x_twelve_point_policy:0 "The Twelve-Point Economic Policy"
 BRM_x_twelve_point_policy_desc:0 "The new government's twelve points promise sound public finance, infrastructure, jobs, private enterprise and protection of the environment."
 BRM_x_msdp:0 "The Myanmar Sustainable Development Plan"
 BRM_x_msdp_desc:0 "One plan to link every ministry's spending to three pillars: peace and stability, prosperity, and people and planet."
 BRM_x_lower_middle_income:0 "A Lower-Middle-Income Country"
 BRM_x_lower_middle_income_desc:0 "The World Bank no longer counts Burma among the low-income countries. Poverty has fallen by almost half in a decade."
 BRM_x_war_economy:0 "The Emergency Economy"
 BRM_x_war_economy_desc:0 "After the coup the economy shrinks by a fifth. Banks close, workers strike and the kyat falls. The State Administration Council rules by decree."
 BRM_x_forex_controls:0 "Foreign Exchange Controls"
 BRM_x_forex_controls_desc:0 "Exporters must convert their dollars into kyat at the official rate. Dollars disappear from the banks and reappear on the black market."
 BRM_x_import_licences:0 "The Import Licence Regime"
 BRM_x_import_licences_desc:0 "Every import needs a licence. Those with friends in the ministry get them."
 BRM_x_yuan_settlement:0 "Trade in Yuan and Baht"
 BRM_x_yuan_settlement_desc:0 "Trade with our neighbours is settled directly in yuan and baht, out of reach of Western sanctions on the dollar."
 BRM_x_border_gates:0 "Reopen the Border Gates"
 BRM_x_border_gates_desc:0 "The crossings with China, closed during the pandemic and the fighting, reopen for trade."
 BRM_x_russian_fuel:0 "Russian Fuel and Fertiliser"
 BRM_x_russian_fuel_desc:0 "Moscow sells us fuel and fertiliser at a discount and accepts payment outside the dollar system."
 BRM_x_rosatom:0 "Nuclear Power with Rosatom"
 BRM_x_rosatom_desc:0 "An agreement with the Russian state nuclear corporation plans a small modular reactor near Yangon."
 BRM_x_military_holdings:0 "Expand the Military Holdings"
 BRM_x_military_holdings_desc:0 "Businesses abandoned by foreign investors are taken over by the military conglomerates and their partners."
 BRM_x_mmqr:0 "A National Payment Network"
 BRM_x_mmqr_desc:0 "A national QR payment system links the banks and mobile wallets, and keeps the money trail inside the country."
 BRM_x_muse_mandalay_rail:0 "The Muse-Mandalay Railway"
 BRM_x_muse_mandalay_rail_desc:0 "Chinese engineers survey the first section of the railway that is to link Yunnan to the Bay of Bengal."
 BRM_x_import_substitution:0 "Import Substitution Again"
 BRM_x_import_substitution_desc:0 "With dollars scarce, factories are told to make at home what the country can no longer afford to import."
 BRM_x_fortress_economy:0 "A Fortress Economy"
 BRM_x_fortress_economy_desc:0 "Cut off from the West, the economy survives on trade with China, Russia and our neighbours."
 BRM_x_federal_economy:0 "The Federal Economy"
 BRM_x_federal_economy_desc:0 "A federal democratic union needs a federal economy, in which the states share in the wealth taken from their land."
 BRM_x_spring_treasury:0 "The Spring Revolution Treasury"
 BRM_x_spring_treasury_desc:0 "Bonds sold to the diaspora and supporters at home raise tens of millions of dollars for the resistance and its administration."
 BRM_x_nug_pay:0 "NUG Pay"
 BRM_x_nug_pay_desc:0 "A digital payment app lets people pay taxes and fees to the democratic administration without passing through the junta's banks."
 BRM_x_spring_lottery:0 "The Spring Lottery"
 BRM_x_spring_lottery_desc:0 "Even a lottery can fund a revolution."
 BRM_x_fiscal_federalism:0 "Fiscal Federalism"
 BRM_x_fiscal_federalism_desc:0 "The states will raise their own taxes and keep a fair share of national revenue."
 BRM_x_resource_sharing:0 "Resource-Sharing Agreements"
 BRM_x_resource_sharing_desc:0 "Jade, gas, timber and hydropower royalties will be shared with the states where they are found."
 BRM_x_dismantle_conglomerates:0 "Dismantle the Military Conglomerates"
 BRM_x_dismantle_conglomerates_desc:0 "The holdings of Myanma Economic Holdings and the Myanmar Economic Corporation pass to the public."
 BRM_x_reconstruction_bonds:0 "Reconstruction Bonds"
 BRM_x_reconstruction_bonds_desc:0 "International partners and our own savers finance the rebuilding of the country."
 BRM_x_return_investors:0 "The Investors Return"
 BRM_x_return_investors_desc:0 "The sanctions end with military rule. Factories reopen and new ones are built."
 BRM_x_federal_dev_bank:0 "A Federal Development Bank"
 BRM_x_federal_dev_bank_desc:0 "A development bank owned by the Union and the states lends to the regions that the war has left behind."
 BRM_x_land_restitution:0 "Land Restitution"
 BRM_x_land_restitution_desc:0 "Land seized by the military and its cronies is returned to the farmers who worked it."
 BRM_x_rebuild_townships:0 "Rebuild the Burned Townships"
 BRM_x_rebuild_townships_desc:0 "Thousands of villages in Sagaing, Magway and Chin State were burned in the war. The first task of peace is to rebuild them."
 BRM_x_diaspora_fund:0 "The Diaspora Investment Fund"
 BRM_x_diaspora_fund_desc:0 "Millions of Burmese abroad invest their savings in the federal union."
 BRM_x_federal_prosperity:0 "A Prosperous Federal Union"
 BRM_x_federal_prosperity_desc:0 "Peace, federalism and an open economy reinforce one another."
 BRM_x_myanmar_2035:0 "Myanmar 2035"
 BRM_x_myanmar_2035_desc:0 "Whatever government rules in Naypyidaw, the country must prepare for an economy of electric cars, data and a warming climate."
 BRM_x_solar_programme:0 "One Gigawatt of Solar"
 BRM_x_solar_programme_desc:0 "The tender of 2020 for one gigawatt of solar power is revived. Solar farms rise on the dry plains of Magway and Mandalay."
 BRM_x_green_bonds:0 "Green Bonds"
 BRM_x_green_bonds_desc:0 "Bonds for clean energy and flood defences attract investors from Singapore and Tokyo."
 BRM_x_climate_resilience:0 "Climate Resilience"
 BRM_x_climate_resilience_desc:0 "Embankments, cyclone shelters and drought-resistant crops prepare the country for the storms and floods to come."
 BRM_x_digital_roadmap:0 "The Digital Economy Roadmap"
 BRM_x_digital_roadmap_desc:0 "A roadmap first drawn up in 2019 aims to make the digital economy a major source of growth."
 BRM_x_data_centres:0 "Data Centres in Yangon and Mandalay"
 BRM_x_data_centres_desc:0 "Cheap hydropower and new fibre links make our cities attractive for data centres."
 BRM_x_ev_assembly:0 "Electric Vehicle Assembly"
 BRM_x_ev_assembly_desc:0 "Chinese and Japanese firms assemble electric motorcycles, buses and cars in the Thilawa zone."
 BRM_x_chip_packaging:0 "Semiconductor Packaging Plants"
 BRM_x_chip_packaging_desc:0 "Like Malaysia and Vietnam before us, we join the chip supply chain at the stage of testing and packaging."
 BRM_x_pearl_rice:0 "A National Rice Brand"
 BRM_x_pearl_rice_desc:0 "Our Pearl Paw San was named the world's best rice in 2011. A national brand earns higher prices abroad."
 BRM_x_dry_ports:0 "Dry Ports and Logistics Hubs"
 BRM_x_dry_ports_desc:0 "Inland container depots at Ywathagyi and Myitnge cut the cost of moving goods from the farms to the ports."
 BRM_x_skills_2035:0 "Skills for 2035"
 BRM_x_skills_2035_desc:0 "Technical colleges and universities train the engineers, nurses and programmers the new economy needs."
 BRM_x_bay_of_bengal_hub:0 "A Bay of Bengal Hub"
 BRM_x_bay_of_bengal_hub_desc:0 "Our ports on the Bay of Bengal serve trade between India, China and Southeast Asia."
 BRM_x_upper_middle:0 "Upper-Middle Income by 2035"
 BRM_x_upper_middle_desc:0 "If peace holds and reform continues, Burma can join the upper-middle-income countries within a generation."
 BRM_x_energy:0 "Energy for the Union"
 BRM_x_energy_desc:0 "Oil, gas, coal and the great rivers of the north could power the whole country, and much of the region besides."
 BRM_x_nationalise_boc:0 "The People's Oil Industry"
 BRM_x_nationalise_boc_desc:0 "In 1963 the Burmah Oil Company is nationalised. Its fields and refineries become the People's Oil Industry, later the Myanma Oil Corporation."
 BRM_x_partner_boc:0 "Partnership with Burmah Oil"
 BRM_x_partner_boc_desc:0 "Rather than seize the oil company, the Union buys a majority stake and keeps its British engineers and know-how."
 BRM_x_mann_field:0 "The Mann Oil Field"
 BRM_x_mann_field_desc:0 "Discovered in 1970 near Minbu, the Mann field becomes the most productive in the country."
 BRM_x_oil_self_sufficiency:0 "Oil Self-Sufficiency"
 BRM_x_oil_self_sufficiency_desc:0 "For a few years in the late 1970s, Burma produces all the oil it needs and exports a little."
 BRM_x_offshore_contracts:0 "Offshore Production-Sharing Contracts"
 BRM_x_offshore_contracts_desc:0 "Foreign oil companies are invited to explore the Gulf of Martaban and the Arakan coast under production-sharing contracts."
 BRM_x_moge:0 "Myanma Oil and Gas Enterprise"
 BRM_x_moge_desc:0 "MOGE becomes the state's partner in every oil and gas project, and one of its richest enterprises."
 BRM_x_zawtika:0 "The Zawtika Gas Field"
 BRM_x_zawtika_desc:0 "Thailand's PTTEP brings the Zawtika field into production in 2014, piping gas to Thailand and to our own power stations."
 BRM_x_onshore_blocks:0 "Onshore Exploration Blocks"
 BRM_x_onshore_blocks_desc:0 "The 2013 bidding round opens eighteen onshore blocks to international oil companies."
 BRM_x_lng_imports:0 "LNG Import Terminals"
 BRM_x_lng_imports_desc:0 "As the offshore fields decline, floating terminals at Thilawa import liquefied gas for new power plants."
 BRM_x_fuel_retail:0 "Private Fuel Stations"
 BRM_x_fuel_retail_desc:0 "The state petrol stations are sold or licensed to private companies, and queues for rationed fuel disappear."
 BRM_x_power_plan:0 "The National Power Plan"
 BRM_x_power_plan_desc:0 "Rangoon has power, the rest of the country mostly does not. A national plan sets out where the next power stations and lines will go."
 BRM_x_hydro_masterplan:0 "The Hydropower Master Plan"
 BRM_x_hydro_masterplan_desc:0 "A national study weighs every proposed dam against its cost to fisheries, forests and the people of the valleys."
 BRM_x_paunglaung:0 "The Paunglaung Dam"
 BRM_x_paunglaung_desc:0 "A 280-megawatt dam near Pyinmana is completed in 2005, just as the new capital rises nearby."
 BRM_x_shweli:0 "Shweli-1 Hydropower"
 BRM_x_shweli_desc:0 "Built by Chinese companies, the 600-megawatt Shweli-1 plant in northern Shan State sends power both to Mandalay and to Yunnan."
 BRM_x_upper_yeywa:0 "The Upper Yeywa Dam"
 BRM_x_upper_yeywa_desc:0 "A second dam on the Myitnge River, upstream of Yeywa, adds hundreds of megawatts for Mandalay."
 BRM_x_salween_dams:0 "Dams on the Salween"
 BRM_x_salween_dams_desc:0 "The Mong Ton and Hatgyi dams could produce more power than the whole country now uses. The flooded valleys lie in Shan and Karen lands."
 BRM_x_free_salween:0 "Keep the Salween Free-Flowing"
 BRM_x_free_salween_desc:0 "The last great undammed river of Southeast Asia will stay free, and the people living along it will stay in their homes."
 BRM_x_tigyit_coal:0 "The Tigyit Coal Power Plant"
 BRM_x_tigyit_coal_desc:0 "A 120-megawatt plant fed by local lignite opens in southern Shan State in 2005."
 BRM_x_grid_500kv:0 "The 500-Kilovolt National Grid"
 BRM_x_grid_500kv_desc:0 "A new high-voltage backbone links the hydropower of the north with the cities of the delta."
 BRM_x_tariff_reform:0 "Electricity Tariff Reform"
 BRM_x_tariff_reform_desc:0 "Electricity has been sold below cost for decades. Higher tariffs for the largest users pay for new generation."
 BRM_x_mini_grids:0 "Village Mini-Grids"
 BRM_x_mini_grids_desc:0 "Solar panels, small hydropower and mini-grids light the villages that the national grid will not reach for years."
 BRM_x_mines_ministry:0 "The Ministry of Mines"
 BRM_x_mines_ministry_desc:0 "One ministry now licenses every mine in the country, from the jade of Hpakant to the tin of Tenasserim."
 BRM_x_mines_law:0 "The Myanmar Mines Law"
 BRM_x_mines_law_desc:0 "The 1994 law opens mining to private and foreign companies under licence."
 BRM_x_letpadaung:0 "The Letpadaung Copper Project"
 BRM_x_letpadaung_desc:0 "A Chinese company expands the copper mines near Monywa. Farmers and monks protest against the loss of their land."
 BRM_x_tagaung_nickel:0 "The Tagaung Taung Nickel Mine"
 BRM_x_tagaung_nickel_desc:0 "A Chinese-built nickel mine and smelter on the Irrawaddy north of Mandalay begins production in 2011."
 BRM_x_hermyingyi:0 "Tin and Tungsten of Hermyingyi"
 BRM_x_hermyingyi_desc:0 "The old tin and tungsten mines near Dawei are reopened and modernised."
 BRM_x_rare_earths:0 "The Rare Earths of Kachin"
 BRM_x_rare_earths_desc:0 "Chinese buyers pay well for the rare earths dug from the hills near the border. The rivers below run with acid."
 BRM_x_regulate_rare_earths:0 "Regulate Rare Earth Mining"
 BRM_x_regulate_rare_earths_desc:0 "Licensed mines, environmental rules and a fair share of the revenue for the people of Kachin State."
 BRM_x_gemstone_law:0 "The Gemstone Law"
 BRM_x_gemstone_law_desc:0 "The 1995 law lets private companies mine and sell gems under licence; a new law in 2019 tightens the rules."
 BRM_x_eiti:0 "Join the Extractive Industries Transparency Initiative"
 BRM_x_eiti_desc:0 "From 2014 we publish what the oil, gas and mining companies pay and what the government receives."
 BRM_x_energy_security:0 "Energy Security"
 BRM_x_energy_security_desc:0 "Power stations, pipelines and a national grid that can keep the factories running through the dry season."
 BRM_x_agriculture:0 "The Ministry of Agriculture and Forests"
 BRM_x_agriculture_desc:0 "Two thirds of our people live from the land. A better harvest is the surest way to a better life."
 BRM_x_yezin_research:0 "Agricultural Research at Yezin"
 BRM_x_yezin_research_desc:0 "The research farms at Yezin breed new varieties of rice, pulses and oilseeds suited to our soils and rains."
 BRM_x_yezin_university:0 "Yezin Agricultural University"
 BRM_x_yezin_university_desc:0 "The agricultural college moves to a new campus at Yezin and trains the extension officers of the whole country."
 BRM_x_seed_farms:0 "State Seed Farms"
 BRM_x_seed_farms_desc:0 "Good seed is half the harvest. State farms multiply the best varieties and sell them to farmers."
 BRM_x_tractor_stations:0 "Tractor Stations"
 BRM_x_tractor_stations_desc:0 "Tractors and ploughing teams are hired out to farmers by the season from state stations."
 BRM_x_fertiliser_subsidies:0 "Fertiliser for Every Farmer"
 BRM_x_fertiliser_subsidies_desc:0 "Subsidised urea from the new gas-fed fertiliser plants is sold to farmers at a fraction of its cost."
 BRM_x_farm_machines:0 "Machines for Every Farm"
 BRM_x_farm_machines_desc:0 "Power tillers, threshers and combine harvesters replace oxen and hand labour as young people leave for the cities."
 BRM_x_hybrid_rice:0 "Hybrid Rice"
 BRM_x_hybrid_rice_desc:0 "Hybrid seed from China and the Philippines raises yields on the best irrigated land."
 BRM_x_dry_zone_crops:0 "Sesame and Groundnuts of the Dry Zone"
 BRM_x_dry_zone_crops_desc:0 "The dry plains of Magway and Mandalay are the heartland of our oilseeds: sesame, groundnut and sunflower."
 BRM_x_cotton:0 "Cotton for the Mills"
 BRM_x_cotton_desc:0 "Long-staple cotton from the dry zone supplies the spinning mills of Thamaing and Meiktila."
 BRM_x_pulses:0 "Pulses and Beans for India"
 BRM_x_pulses_desc:0 "In the 1990s pulses become our largest farm export after rice, most of them shipped to India."
 BRM_x_rice_federation:0 "The Myanmar Rice Federation"
 BRM_x_rice_federation_desc:0 "Millers, traders and exporters join together to win back the markets Burma lost half a century ago."
 BRM_x_rice_north:0 "Rice Across the Northern Border"
 BRM_x_rice_north_desc:0 "Hundreds of trucks a day carry rice to China through Muse."
 BRM_x_plantations:0 "Plantation Crops"
 BRM_x_plantations_desc:0 "Rubber, oil palm, tea and coffee earn foreign currency in the hills and the far south."
 BRM_x_oil_palm:0 "Oil Palm in Tanintharyi"
 BRM_x_oil_palm_desc:0 "Vast oil palm concessions are granted in the far south. Much of the land is cleared and never planted."
 BRM_x_northern_rubber:0 "Rubber Plantations of the North"
 BRM_x_northern_rubber_desc:0 "Chinese companies plant rubber in Shan and Kachin State under contract-farming schemes."
 BRM_x_opium_substitution:0 "Crop Substitution for Opium"
 BRM_x_opium_substitution_desc:0 "With UN help, poppy farmers switch to tea, coffee and fruit. The Wa region bans opium in 2005."
 BRM_x_shan_tea:0 "Tea of the Shan Hills"
 BRM_x_shan_tea_desc:0 "The tea gardens of Namhsan produce the leaves for our lahpet, pickled tea, and for export."
 BRM_x_coffee:0 "Coffee of Pyin Oo Lwin"
 BRM_x_coffee_desc:0 "Arabica from the hills around Pyin Oo Lwin wins prizes and buyers in specialty markets."
 BRM_x_aquaculture:0 "Fish and Prawn Farms in the Delta"
 BRM_x_aquaculture_desc:0 "Thousands of acres of delta paddy become fish ponds and prawn farms, supplying markets across Asia."
 BRM_x_livestock:0 "Livestock Breeding"
 BRM_x_livestock_desc:0 "Better breeds of cattle, pigs and poultry for the farms of the dry zone."
 BRM_x_cold_chain:0 "Cold Storage and Food Processing"
 BRM_x_cold_chain_desc:0 "Cold stores, abattoirs and food processing plants let farmers sell fresh produce far from home."
 BRM_x_contract_farming:0 "Contract Farming"
 BRM_x_contract_farming_desc:0 "Agribusiness companies guarantee prices and supply seed and fertiliser to farmers in return for their crops."
 BRM_x_community_forests:0 "Community Forestry"
 BRM_x_community_forests_desc:0 "From 1995 villages may manage their own forests, cutting wood for their needs and replanting what they take."
 BRM_x_teak_plantations:0 "Teak Plantations"
 BRM_x_teak_plantations_desc:0 "Plantations of teak replace some of what has been cut from the natural forests."
 BRM_x_delta_embankments:0 "Delta Embankments"
 BRM_x_delta_embankments_desc:0 "Embankments and sluices protect the delta paddy fields from floods and salt water."
 BRM_x_producer_groups:0 "Farmers' Producer Groups"
 BRM_x_producer_groups_desc:0 "Small farmers band together to buy inputs and sell their crops at better prices."
 BRM_x_food_basket:0 "The Food Basket of Asia"
 BRM_x_food_basket_desc:0 "Rice, pulses, fish and fruit: Burma feeds itself and a good part of its neighbours."
 BRM_x_transport:0 "The Ministry of Transport and Communications"
 BRM_x_transport_desc:0 "Rivers, railways, roads and telegraph lines hold the Union together."
 BRM_x_myitkyina_line:0 "Rebuild the Myitkyina Line"
 BRM_x_myitkyina_line_desc:0 "The railway from Mandalay to Myitkyina, blown up during the war, is rebuilt bridge by bridge."
 BRM_x_new_rail_lines:0 "New Railway Lines"
 BRM_x_new_rail_lines_desc:0 "Thousands of kilometres of new lines are laid in the 1990s and 2000s, to Dawei, Loikaw and Kyaukpadaung, many with forced labour."
 BRM_x_yangon_mandalay_rail:0 "Upgrade the Yangon-Mandalay Railway"
 BRM_x_yangon_mandalay_rail_desc:0 "Japanese loans rebuild the main line so that trains can run at a hundred kilometres an hour."
 BRM_x_circular_railway:0 "The Yangon Circular Railway"
 BRM_x_circular_railway_desc:0 "New diesel trains and signals on the loop line that carries a hundred thousand people a day."
 BRM_x_road_network:0 "The Union Highways"
 BRM_x_road_network_desc:0 "All-weather roads are built to link the state capitals with Rangoon and Mandalay."
 BRM_x_delta_bridges:0 "Bridges of the Delta"
 BRM_x_delta_bridges_desc:0 "Bridges at Maubin, Dedaye and across the Bassein River finally connect the delta towns by road."
 BRM_x_thanlyin_bridge:0 "The Thanlyin Bridge"
 BRM_x_thanlyin_bridge_desc:0 "Built with Chinese help, the bridge over the Bago River opens in 1993 and links Yangon with the Thilawa port area."
 BRM_x_mandalay_muse_highway:0 "The Mandalay-Muse Highway"
 BRM_x_mandalay_muse_highway_desc:0 "A private toll road to the Chinese border opens in 1998 and becomes the trade artery of the north."
 BRM_x_asian_highway:0 "The Asian Highway"
 BRM_x_asian_highway_desc:0 "Two routes of the Asian Highway network cross the country, from India to Thailand and from China to the sea."
 BRM_x_trilateral_highway:0 "The India-Myanmar-Thailand Trilateral Highway"
 BRM_x_trilateral_highway_desc:0 "A highway from Moreh in India to Mae Sot in Thailand is to link South Asia to Southeast Asia overland."
 BRM_x_dry_zone_roads:0 "Roads of the Dry Zone"
 BRM_x_dry_zone_roads_desc:0 "Farm-to-market roads connect the villages of Magway, Mandalay and Sagaing."
 BRM_x_trucking:0 "Trucking Deregulation"
 BRM_x_trucking_desc:0 "Private trucking companies replace the state Road Transport Corporation on the highways."
 BRM_x_ybs:0 "The Yangon Bus Service"
 BRM_x_ybs_desc:0 "In 2017 hundreds of competing private bus lines are reorganised into a single network with new buses."
 BRM_x_ports:0 "Ports of the Union"
 BRM_x_ports_desc:0 "Rangoon handles almost all our trade. New wharves at Moulmein, Bassein, Akyab and Mergui spread the load."
 BRM_x_thilawa_port:0 "Thilawa Container Terminals"
 BRM_x_thilawa_port_desc:0 "Deep-water container terminals downriver from Yangon take the larger ships the old port cannot."
 BRM_x_inland_ports:0 "Inland River Ports"
 BRM_x_inland_ports_desc:0 "New river terminals at Mandalay, Pakokku and Monywa make the Irrawaddy a modern freight route again."
 BRM_x_kaladan:0 "The Kaladan Multi-Modal Project"
 BRM_x_kaladan_desc:0 "India builds a port at Sittwe and a river and road route up the Kaladan to Mizoram."
 BRM_x_aviation:0 "Civil Aviation"
 BRM_x_aviation_desc:0 "Airfields from the war are turned into civil airports for the hill states and the coast."
 BRM_x_private_airlines:0 "Private Airlines"
 BRM_x_private_airlines_desc:0 "Air Mandalay and Yangon Airways break the monopoly of Myanma Airways."
 BRM_x_yangon_airport:0 "Yangon International Airport Expansion"
 BRM_x_yangon_airport_desc:0 "A new terminal opens in 2007 and another in 2016 as tourist numbers soar."
 BRM_x_hanthawaddy:0 "Hanthawaddy International Airport"
 BRM_x_hanthawaddy_desc:0 "A new international airport near Bago is to take over when Yangon's runway can grow no more."
 BRM_x_telecoms:0 "Posts and Telecommunications"
 BRM_x_telecoms_desc:0 "Myanma Posts and Telecommunications runs the telegraph, the post and the telephone exchanges."
 BRM_x_fibre_backbone:0 "A Fibre Optic Backbone"
 BRM_x_fibre_backbone_desc:0 "Fibre cables along the railways and highways carry the internet to every state capital."
 BRM_x_undersea_cables:0 "Undersea Cables"
 BRM_x_undersea_cables_desc:0 "New undersea cables such as SEA-ME-WE 5 land on our coast and multiply our international bandwidth."
 BRM_x_myanmarsat:0 "MyanmarSat-2"
 BRM_x_myanmarsat_desc:0 "Our own satellite capacity in orbit brings television and the internet to the remotest villages."
 BRM_x_connected_union:0 "A Connected Union"
 BRM_x_connected_union_desc:0 "Every state capital is a day's journey from Yangon by road or rail. A farmer in Chin State can sell to the world."
 BRM_x_finance:0 "The Ministry of Finance and Revenue"
 BRM_x_finance_desc:0 "Taxes, customs, banks and the budget. Without sound finance no plan can succeed."
 BRM_x_gatt:0 "A Founding Member of GATT"
 BRM_x_gatt_desc:0 "Burma is one of the twenty-three countries that sign the General Agreement on Tariffs and Trade in 1947."
 BRM_x_wto:0 "The World Trade Organization"
 BRM_x_wto_desc:0 "We are among the founding members of the WTO in 1995."
 BRM_x_afta:0 "The ASEAN Free Trade Area"
 BRM_x_afta_desc:0 "On joining ASEAN we commit to cutting our tariffs on goods from our neighbours."
 BRM_x_rcep:0 "The Regional Comprehensive Economic Partnership"
 BRM_x_rcep_desc:0 "Fifteen economies from Japan to Australia form the largest trade bloc in the world."
 BRM_x_myanma_insurance:0 "The State Insurance Corporation"
 BRM_x_myanma_insurance_desc:0 "A state insurer covers ships, cargoes, buildings and lives."
 BRM_x_meb:0 "Myanma Economic Bank"
 BRM_x_meb_desc:0 "The state's main commercial bank has branches in every township, handling salaries, pensions and savings."
 BRM_x_mftb:0 "Myanma Foreign Trade Bank"
 BRM_x_mftb_desc:0 "A single state bank handles all our foreign exchange and trade payments."
 BRM_x_micb:0 "Myanma Investment and Commercial Bank"
 BRM_x_micb_desc:0 "A new state bank lends to private businesses and foreign joint ventures."
 BRM_x_sme_bank:0 "The Small and Medium Industrial Development Bank"
 BRM_x_sme_bank_desc:0 "A development bank for the small workshops and factories that employ most of our industrial workers."
 BRM_x_commercial_tax:0 "The Commercial Tax Law"
 BRM_x_commercial_tax_desc:0 "The 1990 law taxes the sale of goods and services across the country."
 BRM_x_vat:0 "A Value Added Tax"
 BRM_x_vat_desc:0 "Replacing the commercial tax with a modern VAT would double the revenue from consumption, and anger every shopkeeper."
 BRM_x_aml_law:0 "The Anti-Money Laundering Law"
 BRM_x_aml_law_desc:0 "Laws against money laundering in 2002 and 2014 take aim at the drug money hidden in property and banks."
 BRM_x_customs_automation:0 "Automated Customs Clearance"
 BRM_x_customs_automation_desc:0 "A Japanese-built system clears cargo electronically, cutting the time, and the bribes, at the ports."
 BRM_x_single_window:0 "A National Single Window"
 BRM_x_single_window_desc:0 "Traders file all their import and export papers once, online."
 BRM_x_mpu:0 "The Myanmar Payment Union"
 BRM_x_mpu_desc:0 "A national card network links the ATMs and card machines of every bank."
 BRM_x_credit_bureau:0 "The Credit Bureau"
 BRM_x_credit_bureau_desc:0 "Banks can finally see a borrower's credit history, and lend without demanding land as collateral."
 BRM_x_accountancy:0 "The Myanmar Accountancy Council"
 BRM_x_accountancy_desc:0 "International accounting standards for listed and large companies."
 BRM_x_debt_relief:0 "Paris Club Debt Relief"
 BRM_x_debt_relief_desc:0 "In 2013 the Paris Club writes off half of our arrears and Japan cancels billions of yen of old loans."
 BRM_x_world_bank_return:0 "Return to the World Bank"
 BRM_x_world_bank_return_desc:0 "With our arrears cleared, the World Bank and the Asian Development Bank lend to Burma again after twenty-five years."
 BRM_x_ppp:0 "Public-Private Partnerships"
 BRM_x_ppp_desc:0 "Private investors build and run power plants, toll roads and ports under long-term contracts with the state."
 BRM_x_national_export_strategy:0 "The National Export Strategy"
 BRM_x_national_export_strategy_desc:0 "A five-year strategy to diversify our exports beyond gas, jade and rice."
 BRM_x_sound_money:0 "Sound Money"
 BRM_x_sound_money_desc:0 "Low inflation, a stable kyat and a budget that adds up: the foundations of lasting growth."
 BRM_x_society:0 "The Ministries of Education and Health"
 BRM_x_society_desc:0 "A free people must be able to read, and a strong nation must be healthy. Schools and clinics come before palaces."
 BRM_x_sea_games:0 "Host the Southeast Asian Games"
 BRM_x_sea_games_desc:0 "Rangoon hosts the SEAP Games in 1961 and 1969. In 2013 Naypyidaw hosts the SEA Games."
 BRM_x_mass_education:0 "The Mass Education Council"
 BRM_x_mass_education_desc:0 "From 1949 volunteers teach adults to read and write in the evenings, in monasteries and village halls."
 BRM_x_language_commission:0 "The Myanmar Language Commission"
 BRM_x_language_commission_desc:0 "Founded in 1971, the commission standardises spelling and publishes the official dictionary of the Burmese language."
 BRM_x_monastic_schools:0 "Monastic Schools"
 BRM_x_monastic_schools_desc:0 "For centuries the monasteries taught every Burmese boy to read. Supporting them reaches the villages the state cannot."
 BRM_x_literacy_campaign:0 "The National Literacy Campaign"
 BRM_x_literacy_campaign_desc:0 "University students spend their holidays teaching in the villages. Township after township is declared literate."
 BRM_x_unesco_prize:0 "The UNESCO Literacy Prize"
 BRM_x_unesco_prize_desc:0 "In 1971 UNESCO awards Burma a prize for its literacy campaign, one of the most successful in the developing world."
 BRM_x_basic_education_law:0 "The Basic Education Law"
 BRM_x_basic_education_law_desc:0 "A single system of state schools, from the village primary school to the high school, for every child in the Union."
 BRM_x_technical_schools:0 "Technical High Schools"
 BRM_x_technical_schools_desc:0 "Schools that teach carpentry, mechanics and electrical work give young people a trade."
 BRM_x_gtis:0 "Government Technical Institutes"
 BRM_x_gtis_desc:0 "Technical institutes in every region train the technicians our factories and power stations need."
 BRM_x_university_act:0 "The University Education Act"
 BRM_x_university_act_desc:0 "The 1964 act reorganises higher education into separate universities and institutes for arts, sciences, medicine and engineering."
 BRM_x_institutes_of_medicine:0 "The Institutes of Medicine"
 BRM_x_institutes_of_medicine_desc:0 "Two Institutes of Medicine in Rangoon and one in Mandalay train the doctors of the nation."
 BRM_x_distance_education:0 "Distance Education"
 BRM_x_distance_education_desc:0 "The University of Distance Education lets students study from home, using radio, books and later the internet."
 BRM_x_dispersed_universities:0 "A University in Every Region"
 BRM_x_dispersed_universities_desc:0 "New universities are founded in every state and region, far from the city centres where students once protested."
 BRM_x_nel_2014:0 "The National Education Law"
 BRM_x_nel_2014_desc:0 "The 2014 law extends basic education to twelve years and gives universities more freedom."
 BRM_x_free_primary:0 "Free Compulsory Primary Education"
 BRM_x_free_primary_desc:0 "From 2015 primary school is free for every child, with textbooks and uniforms provided."
 BRM_x_ethnic_languages:0 "Teaching in Ethnic Languages"
 BRM_x_ethnic_languages_desc:0 "Karen, Shan, Kachin, Mon and other languages may now be taught in state schools."
 BRM_x_nesp:0 "The National Education Strategic Plan"
 BRM_x_nesp_desc:0 "A five-year plan for teacher training, new curricula and school buildings."
 BRM_x_public_health:0 "Public Health"
 BRM_x_public_health_desc:0 "Malaria, tuberculosis and cholera kill more Burmese than the civil war."
 BRM_x_malaria:0 "Malaria Eradication"
 BRM_x_malaria_desc:0 "Teams spray the villages with DDT and hand out medicine. Malaria deaths fall sharply in the 1950s."
 BRM_x_rural_health:0 "Rural Health Centres"
 BRM_x_rural_health_desc:0 "A health centre with a doctor, a midwife and a dispensary in every township."
 BRM_x_nursing_schools:0 "Nursing and Midwifery Schools"
 BRM_x_nursing_schools_desc:0 "Nurses and midwives trained in every state capital staff the new township health centres."
 BRM_x_peoples_health_plan:0 "The People's Health Plan"
 BRM_x_peoples_health_plan_desc:0 "The 1978 plan puts primary health care, clean water and vaccination at the centre of health policy."
 BRM_x_traditional_medicine:0 "The Institute of Traditional Medicine"
 BRM_x_traditional_medicine_desc:0 "Traditional healers are trained and licensed alongside doctors of Western medicine."
 BRM_x_mmcwa:0 "The Maternal and Child Welfare Association"
 BRM_x_mmcwa_desc:0 "Volunteers in every township care for mothers and newborn children."
 BRM_x_aids_programme:0 "The National AIDS Programme"
 BRM_x_aids_programme_desc:0 "Testing, treatment and prevention for HIV, which spreads fast along the jade and trucking routes."
 BRM_x_new_hospitals:0 "New General Hospitals"
 BRM_x_new_hospitals_desc:0 "General hospitals are built in every state and region capital."
 BRM_x_uhc:0 "Universal Health Coverage by 2030"
 BRM_x_uhc_desc:0 "The National Health Plan aims to give every citizen access to basic health services without falling into debt."
 BRM_x_labour:0 "Labour Law"
 BRM_x_labour_desc:0 "Factory acts, trade disputes and wages: the laws that govern work."
 BRM_x_labour_law_2011:0 "The Labour Organisation Law"
 BRM_x_labour_law_2011_desc:0 "For the first time in fifty years workers may form independent unions and go on strike."
 BRM_x_social_security_2012:0 "The Social Security Law"
 BRM_x_social_security_2012_desc:0 "Health care, sickness pay and pensions for workers in registered firms."
 BRM_x_minimum_wage:0 "The Minimum Wage"
 BRM_x_minimum_wage_desc:0 "The first national minimum wage, 3,600 kyat a day, comes into force in September 2015."
 BRM_x_overseas_workers:0 "Overseas Workers and Remittances"
 BRM_x_overseas_workers_desc:0 "Millions of Burmese work in Thailand, Malaysia and beyond. The money they send home keeps whole villages alive."
 BRM_x_women_workers:0 "Women in the Workforce"
 BRM_x_women_workers_desc:0 "Women make up most of the workers in garments, food processing and trade."
 BRM_x_census_2014:0 "The 2014 Census"
 BRM_x_census_2014_desc:0 "The first full census in thirty years counts fifty-one million people."
 BRM_x_educated_union:0 "An Educated and Healthy Union"
 BRM_x_educated_union_desc:0 "A generation that can read, count and use a computer, and that lives longer than any before it."
 BRM_x_cities:0 "Cities of the Golden Land"
 BRM_x_cities_desc:0 "Rangoon, Mandalay and Moulmein grow faster than their roads, drains and water pipes."
 BRM_x_rebuild_rangoon:0 "Rebuild Rangoon"
 BRM_x_rebuild_rangoon_desc:0 "The capital was bombed by both sides in the war. Its wharves, markets and waterworks must be rebuilt."
 BRM_x_satellite_towns:0 "The Satellite Towns"
 BRM_x_satellite_towns_desc:0 "The caretaker government moves the squatters of Rangoon to new towns at Okkalapa and Thaketa."
 BRM_x_ycdc:0 "The City Development Committees"
 BRM_x_ycdc_desc:0 "Development committees take charge of the roads, markets and water of Yangon and Mandalay."
 BRM_x_new_yangon_city:0 "New Yangon City"
 BRM_x_new_yangon_city_desc:0 "A new city of factories and homes is planned across the river from Yangon."
 BRM_x_mandalay_city:0 "Mandalay, the Royal City"
 BRM_x_mandalay_city_desc:0 "The old royal capital is rebuilt around its palace walls and moat."
 BRM_x_secondary_cities:0 "Secondary Cities"
 BRM_x_secondary_cities_desc:0 "Moulmein, Taunggyi, Bassein and Myitkyina receive new roads, markets and power."
 BRM_x_affordable_housing:0 "Affordable Housing"
 BRM_x_affordable_housing_desc:0 "Low-cost apartments for workers and civil servants rise on the edge of the cities."
 BRM_x_clean_water:0 "Clean Water for the Cities"
 BRM_x_clean_water_desc:0 "New treatment plants and pipes bring safe water to millions in Yangon and Mandalay."
 BRM_x_yangon_metro:0 "The Yangon Metro"
 BRM_x_yangon_metro_desc:0 "An urban railway is planned to carry Yangon's growing millions under and over its traffic jams."
 BRM_x_smart_cities:0 "ASEAN Smart Cities"
 BRM_x_smart_cities_desc:0 "Yangon, Mandalay and Naypyidaw join the ASEAN Smart Cities Network."
 BRM_x_tourism:0 "Tourism"
 BRM_x_tourism_desc:0 "The Shwedagon, Pagan and Inle Lake could draw visitors from all over the world."
 BRM_x_hotel_law:0 "The Hotel and Tourism Law"
 BRM_x_hotel_law_desc:0 "The 1993 law opens the hotel trade to private and foreign investors."
 BRM_x_inle_lake:0 "Inle Lake"
 BRM_x_inle_lake_desc:0 "The floating gardens and leg-rowing fishermen of Inle become famous around the world."
 BRM_x_ngapali:0 "The Beaches of Ngapali"
 BRM_x_ngapali_desc:0 "Resorts open on the white sand of the Rakhine coast."
 BRM_x_tourism_master_plan:0 "The Tourism Master Plan"
 BRM_x_tourism_master_plan_desc:0 "A plan for 2013 to 2020 promises responsible tourism that benefits local communities."
 BRM_x_e_visa:0 "Electronic Visas"
 BRM_x_e_visa_desc:0 "From 2014 visitors can apply for their visa online."
 BRM_x_tourism_boom:0 "The Tourism Boom"
 BRM_x_tourism_boom_desc:0 "Visitor numbers rise from under a million in 2010 to several million a few years later."
 BRM_x_yangon_heritage:0 "The Yangon Heritage Trust"
 BRM_x_yangon_heritage_desc:0 "The colonial buildings of downtown Yangon, the finest in Southeast Asia, are protected from demolition."
 BRM_x_bagan_heritage:0 "Bagan, a World Heritage Site"
 BRM_x_bagan_heritage_desc:0 "In 2019 the thousands of temples of Bagan are inscribed on the UNESCO World Heritage List."
 BRM_x_mrauk_u:0 "Mrauk U"
 BRM_x_mrauk_u_desc:0 "The temples of the old Arakanese royal capital are restored for visitors."
 BRM_x_nation_of_cities:0 "A Nation of Cities"
 BRM_x_nation_of_cities_desc:0 "One in three Burmese now lives in a town or city. The cities are where the new economy is made."
 BRM_x_army_expansion:0 "The Tatmadaw Expansion"
 BRM_x_army_expansion_desc:0 "After 1988 the army doubles in size, from under two hundred thousand to about four hundred thousand men."
 BRM_x_china_arms_1990:0 "The 1990 Arms Deal with China"
 BRM_x_china_arms_1990_desc:0 "A deal worth more than a billion dollars brings Chinese tanks, armoured carriers, artillery, aircraft and ships."
 BRM_x_type69_battalions:0 "Type 69 Tank Battalions"
 BRM_x_type69_battalions_desc:0 "Chinese Type 69 tanks form the first real armoured regiments of the Tatmadaw."
 BRM_x_sp_artillery:0 "Self-Propelled Artillery"
 BRM_x_sp_artillery_desc:0 "Self-propelled howitzers from Serbia and China give the artillery mobility."
 BRM_x_rocket_launchers:0 "Multiple Rocket Launchers"
 BRM_x_rocket_launchers_desc:0 "Rocket artillery batteries are formed for each regional command."
 BRM_x_mocs:0 "Military Operations Commands"
 BRM_x_mocs_desc:0 "Divisions of ten battalions, the Military Operations Commands, are raised for the border regions."
 BRM_x_special_ops_bureaus:0 "Bureaus of Special Operations"
 BRM_x_special_ops_bureaus_desc:0 "Senior generals take charge of several regional commands at once, under the War Office."
 BRM_x_reserve_law:0 "The People's Military Service Law"
 BRM_x_reserve_law_desc:0 "The 2010 law allows conscription of men and women for up to five years. It lies unused until 2024."
 BRM_x_dsta:0 "The Defence Services Technological Academy"
 BRM_x_dsta_desc:0 "An engineering academy at Pyin Oo Lwin trains officers to design and build weapons at home."
 BRM_x_ndc:0 "The National Defence College"
 BRM_x_ndc_desc:0 "Senior officers study strategy, economics and diplomacy."
 BRM_x_officers_russia:0 "Officers Trained in Russia"
 BRM_x_officers_russia_desc:0 "From 2001 thousands of officers study engineering and science at Russian military academies."
 BRM_x_drone_factories:0 "Drone Factories"
 BRM_x_drone_factories_desc:0 "Ka Pa Sa factories build reconnaissance and attack drones."
 BRM_x_cyber_unit:0 "The Cyber Warfare Unit"
 BRM_x_cyber_unit_desc:0 "A unit to defend military networks and watch the internet."
 BRM_x_dsgh:0 "The Defence Services General Hospital"
 BRM_x_dsgh_desc:0 "A thousand-bed military hospital at Mingaladon treats soldiers and their families."
 BRM_x_professional_army:0 "A Professional Army"
 BRM_x_professional_army_desc:0 "Well-trained, well-equipped and loyal to the constitution."
 BRM_x_air_expansion:0 "Air Force Expansion"
 BRM_x_air_expansion_desc:0 "The Chinese arms deal gives the air force more aircraft than it has ever had."
 BRM_x_g4_trainers:0 "G-4 Super Galeb Trainers"
 BRM_x_g4_trainers_desc:0 "Yugoslav jet trainers arrive in the early 1990s, among the last exports of Yugoslavia."
 BRM_x_k8_trainers:0 "K-8 Karakorum Trainers"
 BRM_x_k8_trainers_desc:0 "Chinese-Pakistani K-8 trainers become the standard jet trainer of the air force."
 BRM_x_yak130:0 "Yak-130 Combat Trainers"
 BRM_x_yak130_desc:0 "Russian Yak-130s train pilots for the MiG-29 and the Su-30."
 BRM_x_jf17:0 "JF-17 Thunder Fighters"
 BRM_x_jf17_desc:0 "Burma becomes the first foreign buyer of the Chinese-Pakistani JF-17."
 BRM_x_mi35:0 "Mi-35 Gunships"
 BRM_x_mi35_desc:0 "Russian Mi-35 helicopter gunships for counter-insurgency in the hills."
 BRM_x_mi17:0 "Mi-17 Transport Helicopters"
 BRM_x_mi17_desc:0 "Russian Mi-17s become the workhorses of the air force in the hills."
 BRM_x_y8_transports:0 "Y-8 Transport Aircraft"
 BRM_x_y8_transports_desc:0 "Chinese Y-8 transports carry troops and supplies to the remote northern bases."
 BRM_x_new_air_bases:0 "New Air Bases"
 BRM_x_new_air_bases_desc:0 "New air bases are built at Shante, Taungoo and Homalin."
 BRM_x_sam_network:0 "A Surface-to-Air Missile Network"
 BRM_x_sam_network_desc:0 "Russian and Chinese missile batteries protect Naypyidaw and the main bases."
 BRM_x_aerospace_university:0 "The Aerospace Engineering University"
 BRM_x_aerospace_university_desc:0 "A university at Meiktila trains aerospace engineers."
 BRM_x_navy_expansion:0 "Naval Expansion"
 BRM_x_navy_expansion_desc:0 "The navy grows from a river force into a coastal navy."
 BRM_x_houxin_boats:0 "Houxin Missile Boats"
 BRM_x_houxin_boats_desc:0 "Six Chinese-built missile boats give the navy its first anti-ship missiles."
 BRM_x_hainan_chasers:0 "Hainan-Class Submarine Chasers"
 BRM_x_hainan_chasers_desc:0 "Chinese submarine chasers patrol the Andaman Sea."
 BRM_x_kyansittha_frigates:0 "Kyansittha-Class Frigates"
 BRM_x_kyansittha_frigates_desc:0 "Stealthy frigates built at home in Yangon, armed with missiles and a helicopter."
 BRM_x_tabinshwehti:0 "The Corvette Tabinshwehti"
 BRM_x_tabinshwehti_desc:0 "A new class of missile corvettes built in our own yards."
 BRM_x_moattama:0 "The Landing Platform Dock Moattama"
 BRM_x_moattama_desc:0 "An Indonesian-built landing ship can carry a battalion, its vehicles and helicopters."
 BRM_x_type035b:0 "The Submarine Minye Kyaw Htin"
 BRM_x_type035b_desc:0 "A Chinese Type 035B submarine joins the Indian-supplied Minye Theinkhathu."
 BRM_x_naval_yards:0 "Expand the Naval Dockyards"
 BRM_x_naval_yards_desc:0 "The naval dockyards at Sinmalaik and Thanlyin are extended to build frigates."
 BRM_x_coast_guard:0 "A Coast Guard"
 BRM_x_coast_guard_desc:0 "A coast guard takes over policing of fisheries, smuggling and the sea lanes."
 BRM_x_peace_process:0 "The Peace Process"
 BRM_x_peace_process_desc:0 "Seventy years of war have ruined the borderlands. Every government must eventually sit down with the armed groups."
 BRM_x_arms_for_democracy:0 "Arms for Democracy"
 BRM_x_arms_for_democracy_desc:0 "In 1958 thousands of rebels hand in their weapons in return for an amnesty and the right to take part in elections."
 BRM_x_peace_parley_1963:0 "The Peace Parley of 1963"
 BRM_x_peace_parley_1963_desc:0 "The Revolutionary Council invites every armed group to Rangoon. Only one accepts its terms."
 BRM_x_four_cuts:0 "The Four Cuts"
 BRM_x_four_cuts_desc:0 "Cut the rebels off from food, funds, intelligence and recruits: villages are moved, and those that refuse are burned."
 BRM_x_cpb_collapse:0 "The Collapse of the Communist Party of Burma"
 BRM_x_cpb_collapse_desc:0 "In 1989 the Wa and Kokang troops of the Communist Party mutiny against their Burman leaders. The party collapses within weeks."
 BRM_x_wa_agreement:0 "The Wa Agreement"
 BRM_x_wa_agreement_desc:0 "The United Wa State Army agrees a ceasefire. It keeps its weapons and its territory."
 BRM_x_border_areas:0 "The Ministry for Border Areas"
 BRM_x_border_areas_desc:0 "A ministry for the progress of the border areas and national races builds roads, schools and clinics in the ceasefire zones."
 BRM_x_kachin_ceasefire:0 "The Kachin Ceasefire of 1994"
 BRM_x_kachin_ceasefire_desc:0 "After thirty-three years of war, the Kachin Independence Organisation agrees a ceasefire."
 BRM_x_mon_ceasefire:0 "The Mon Ceasefire of 1995"
 BRM_x_mon_ceasefire_desc:0 "The New Mon State Party signs a ceasefire and opens Mon schools in its zones."
 BRM_x_karenni_ceasefire:0 "The Karenni Ceasefire"
 BRM_x_karenni_ceasefire_desc:0 "A ceasefire with the Karenni National Progressive Party."
 BRM_x_national_races_development:0 "Development for the National Races"
 BRM_x_national_races_development_desc:0 "Bridges, schools and hospitals in the hills are the price of peace."
 BRM_x_karen_ceasefire:0 "The Karen Ceasefire of 2012"
 BRM_x_karen_ceasefire_desc:0 "The Karen National Union, which has fought since 1949, signs a ceasefire."
 BRM_x_shan_talks:0 "Talks with the Shan State Army"
 BRM_x_shan_talks_desc:0 "The Restoration Council of Shan State agrees a ceasefire."
 BRM_x_chin_ceasefire:0 "The Chin Ceasefire"
 BRM_x_chin_ceasefire_desc:0 "The Chin National Front signs a ceasefire."
 BRM_x_arakan_talks:0 "Talks with the Arakan Army"
 BRM_x_arakan_talks_desc:0 "The Arakan Army has become one of the strongest armed groups in the country. Without it there is no peace in Rakhine."
 BRM_x_joint_monitoring:0 "The Joint Monitoring Committee"
 BRM_x_joint_monitoring_desc:0 "Officers of the army and the armed groups sit together to investigate breaches of the ceasefire."
 BRM_x_peace_dividend:0 "The Peace Dividend"
 BRM_x_peace_dividend_desc:0 "Where the guns fall silent, investors, traders and tourists arrive."
 BRM_x_ddr:0 "Disarmament and Reintegration"
 BRM_x_ddr_desc:0 "Fighters who lay down their weapons receive land, training and a place in the police or the army."
 BRM_x_federal_army:0 "A Federal Army"
 BRM_x_federal_army_desc:0 "The resistance and the ethnic armies agree to form a single federal army under civilian control."
 BRM_x_truth_commission:0 "A Truth and Reconciliation Commission"
 BRM_x_truth_commission_desc:0 "The crimes of the war are recorded and acknowledged, so that they are not repeated."
 BRM_x_lasting_peace:0 "A Lasting Peace"
 BRM_x_lasting_peace_desc:0 "For the first time since independence, no one in the Union is at war."
 BRM_x_foreign_ministry:0 "The Foreign Ministry"
 BRM_x_foreign_ministry_desc:0 "A small country between India and China must have a large diplomacy."
 BRM_x_india_friendship:0 "The Treaty of Friendship with India"
 BRM_x_india_friendship_desc:0 "In 1951 the two neighbours sign a treaty of friendship. Nehru and U Nu become close friends."
 BRM_x_nam_founder:0 "A Founder of the Non-Aligned Movement"
 BRM_x_nam_founder_desc:0 "At Belgrade in 1961, Burma is one of the founding members of the Non-Aligned Movement."
 BRM_x_leave_nam:0 "Leave the Non-Aligned Movement"
 BRM_x_leave_nam_desc:0 "In 1979 Burma walks out of the movement, accusing Cuba of leading it into the Soviet camp."
 BRM_x_stay_nam:0 "Stay in the Non-Aligned Movement"
 BRM_x_stay_nam_desc:0 "The movement is not perfect, but it is still the best voice the small countries have."
 BRM_x_rejoin_nam:0 "Rejoin the Non-Aligned Movement"
 BRM_x_rejoin_nam_desc:0 "In 1992 Burma rejoins the movement it left thirteen years earlier."
 BRM_x_japan_friend:0 "Japan, Our Chief Friend"
 BRM_x_japan_friend_desc:0 "No country gives more aid to Burma than Japan, the old occupier turned friend."
 BRM_x_korea_partnership:0 "Partnership with South Korea"
 BRM_x_korea_partnership_desc:0 "Daewoo builds factories and finds gas offshore. Korean aid trains engineers and civil servants."
 BRM_x_thai_partnership:0 "Partnership with Thailand"
 BRM_x_thai_partnership_desc:0 "Thailand buys our gas, employs millions of our workers and invests in Dawei."
 BRM_x_china_partnership:0 "Comprehensive Strategic Partnership with China"
 BRM_x_china_partnership_desc:0 "In 2011 the two countries raise their relationship to a comprehensive strategic cooperative partnership."
 BRM_x_russia_partnership:0 "Strategic Partnership with Russia"
 BRM_x_russia_partnership_desc:0 "Moscow becomes a friend that asks no questions."
 BRM_x_gms:0 "The Greater Mekong Subregion"
 BRM_x_gms_desc:0 "Six countries of the Mekong basin plan roads, power lines and trade together with the Asian Development Bank."
 BRM_x_asean_observer:0 "ASEAN Observer"
 BRM_x_asean_observer_desc:0 "Burma attends ASEAN meetings as an observer from 1996, a year before it joins."
 BRM_x_bimstec:0 "BIMSTEC"
 BRM_x_bimstec_desc:0 "A bridge between South and Southeast Asia: cooperation with Bangladesh, India, Sri Lanka, Thailand, Nepal and Bhutan."
 BRM_x_mekong_ganga:0 "Mekong-Ganga Cooperation"
 BRM_x_mekong_ganga_desc:0 "India and the five Mekong countries cooperate in tourism, culture, education and transport."
 BRM_x_look_east_india:0 "India Looks East"
 BRM_x_look_east_india_desc:0 "India's Look East policy turns its attention to Burma, its land bridge to Southeast Asia."
 BRM_x_obama_visit:0 "The Visit of the American President"
 BRM_x_obama_visit_desc:0 "In November 2012 Barack Obama becomes the first American president to visit Burma."
 BRM_x_eu_dialogue:0 "Dialogue with Europe"
 BRM_x_eu_dialogue_desc:0 "In April 2012 the European Union suspends its sanctions; an EU delegation opens in Yangon the next year."
 BRM_x_asean_chair_2014:0 "Chair of ASEAN in 2014"
 BRM_x_asean_chair_2014_desc:0 "Seventeen years after joining, Burma chairs ASEAN for the first time and hosts its summits in Naypyidaw."
 BRM_x_independent_policy:0 "An Independent and Active Foreign Policy"
 BRM_x_independent_policy_desc:0 "Friends with all, aligned with none: the old neutrality of U Nu, for a new century."
 BRM_xi_eight_year_plan:0 "The Eight-Year Plan"
 BRM_xi_eight_year_plan_desc:0 "Public investment under the Eight-Year Development Programme speeds up every building site in the Union."
 BRM_xi_four_year_plan:0 "The Four-Year Plan"
 BRM_xi_four_year_plan_desc:0 "A smaller plan, focused on projects that can be finished and that earn foreign exchange."
 BRM_xi_samb_monopoly:0 "The State Rice Monopoly"
 BRM_xi_samb_monopoly_desc:0 "The State Agricultural Marketing Board buys paddy cheaply and sells rice dearly. The profit funds the state; the farmers resent it."
 BRM_xi_twenty_year_plan:0 "The Twenty-Year Plan"
 BRM_xi_twenty_year_plan_desc:0 "Four-Year Plans set the targets for every corporation until 1994."
 BRM_xi_export_tiger:0 "The Irrawaddy Export Economy"
 BRM_xi_export_tiger_desc:0 "Factories built for export markets, an open currency and a government that clears the way for business."
 BRM_xi_buddhist_economics:0 "Buddhist Economics"
 BRM_xi_buddhist_economics_desc:0 "Right livelihood and the middle way: an economy measured by well-being, not only by output."
 BRM_xi_middle_way:0 "The Middle Way"
 BRM_xi_middle_way_desc:0 "Neither capitalism nor communism, but a mixed economy that grows while leaving no family behind."
 BRM_xi_democratic_dividend:0 "The Democratic Dividend"
 BRM_xi_democratic_dividend_desc:0 "Investors trust our courts, donors trust our budget, and our people trust their government."
 BRM_xi_msdp:0 "The Sustainable Development Plan"
 BRM_xi_msdp_desc:0 "Every ministry's budget is tied to the goals of peace, prosperity and a healthy environment."
 BRM_xi_open_door_economy:0 "The Open Door"
 BRM_xi_open_door_economy_desc:0 "Foreign trade and investment are welcome again after a quarter of a century."
 BRM_xi_military_conglomerates:0 "Military Conglomerates"
 BRM_xi_military_conglomerates_desc:0 "The army owns banks, breweries, mines and factories. They serve the officers first."
 BRM_xi_reform_momentum:0 "Reform Momentum"
 BRM_xi_reform_momentum_desc:0 "New laws, new investors and new hope."
 BRM_xi_sanctions_economy:0 "The Sanctions Economy"
 BRM_xi_sanctions_economy_desc:0 "Cut off from the West, the economy depends on China, Russia and the neighbours."
 BRM_xi_peoples_economy:0 "The Planned Economy"
 BRM_xi_peoples_economy_desc:0 "The plan decides what every factory makes. Steel comes before soap."
 BRM_xi_federal_fiscal:0 "Fiscal Federalism"
 BRM_xi_federal_fiscal_desc:0 "The states raise their own revenue and share in the wealth of their land."
 BRM_xi_energy_security:0 "Energy Security"
 BRM_xi_energy_security_desc:0 "Reliable power for every factory, all year round."
