 BRM_x_eth_tt_karenni_ceasefire:0 "If the §YKarenni§! armed groups are at war, they agree to a §Gceasefire§!. Relations with them improve."
 BRM_x_eth_tt_mon_ceasefire:0 "If the §YMon§! armed groups are at war, they agree to a §Gceasefire§!. Relations with them improve."
 BRM_x_eth_tt_arakan_ceasefire:0 "If the §YArakanese§! armed groups are at war, they agree to a §Gceasefire§!. Relations with them improve."
 BRM_x_eth_tt_shan_ceasefire:0 "If the §YShan§! armed groups are at war, they agree to a §Gceasefire§!. Relations with them improve."
 BRM_x_eth_tt_kachin_ceasefire:0 "If the §YKachin§! armed groups are at war, they agree to a §Gceasefire§!. Relations with them improve."
 BRM_x_eth_tt_chin_ceasefire:0 "If the §YChin§! armed groups are at war, they agree to a §Gceasefire§!. Relations with them improve."
 BRM_x_eth_tt_wa_ceasefire:0 "If the §YWa§! armed groups are at war, they agree to a §Gceasefire§!. Relations with them improve."
 BRM_x_eth_tt_arms_for_democracy:0 "Every armed group still at war loses §G1§! strength as fighters accept the amnesty."
 BRM_x_eth_tt_peace_parley:0 "Relations with all ethnic armed groups §Gimprove§!."
 BRM_x_eth_tt_four_cuts:0 "Every armed group still at war loses §G2§! strength, but §Rloses any goodwill§! towards the government."
 BRM_x_eth_tt_cpb_collapse:0 "The §YWa§! forces of the old Communist Party agree to a §Gceasefire§!. The §YShan§! and §YKachin§! rebels lose §G1§! strength."
 BRM_x_eth_tt_border_areas:0 "Every group in a §Yceasefire§! receives development projects, so its strength §Grecovers more slowly§!."
 BRM_x_eth_tt_ethnic_languages:0 "Relations with all ethnic armed groups §Gimprove§!."
 BRM_x_eth_tt_resource_sharing:0 "Every group not at war receives an §Gautonomy and revenue-sharing deal§!."
 BRM_x_eth_tt_ddr:0 "Every group in a ceasefire with §Y4§! strength or less §Gdisarms and makes peace§!."
 BRM_x_eth_tt_federal_army:0 "Every ethnic armed group at war joins the federal side and agrees to a §Gceasefire§!."
 BRM_x_eth_tt_lasting_peace:0 "Every group in a ceasefire §Gmakes a lasting peace§!."
 BRM_x_upgrade_state_tt:0 "One of our states rises by §Gone development level§!."
