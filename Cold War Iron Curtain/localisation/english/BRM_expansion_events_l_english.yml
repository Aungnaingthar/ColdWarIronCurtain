l_english:
 brmx.1.t:0 "The Engineers' Plan"
 brmx.1.d:0 "The Knappen Tippetts Abbett report is on the Prime Minister's desk: dams, ports, mills, roads and a steel works, more than thirty projects in all. Together they would cost more than the Union earns in eight years. The planners want to know where to begin."
 brmx.1.a:0 "Build everything at once. Burma cannot wait."
 brmx.1.b:0 "Start with power and transport."
 brmx.1.c:0 "Let our own engineers set the pace."
 brmx.2.t:0 "Rice Piles Up at the Docks"
 brmx.2.d:0 "With the Korean War over, the buyers who paid any price for rice have vanished. A million and a half tons lie unsold in the warehouses of Rangoon and Bassein, and the State Agricultural Marketing Board has stopped paying farmers on time."
 brmx.2.a:0 "Sell at whatever price we can get."
 brmx.2.b:0 "Barter it with the socialist countries."
 brmx.2.c:0 "Store it, and cut the plan to fit."
 brmx.3.t:0 "Cement in the Rain"
 brmx.3.d:0 "Soviet and Czech cement has arrived far faster than anyone can use it. Sacks stacked on the Rangoon wharves have hardened in the monsoon rain, and the newspapers ask what else the barter deals have bought us."
 brmx.3.a:0 "Protest to Moscow and renegotiate."
 brmx.3.b:0 "Use what we can on roads and dykes."
 brmx.3.c:0 "Sell the rest to private builders."
 brmx.4.t:0 "The Ali-Baba Licences"
 brmx.4.d:0 "Import licences reserved for Burmese nationals are being sold, quietly, to the old Indian and Chinese trading houses. The Burmese name on the licence is Ali; the merchant who does the business is Baba. Everyone in the bazaar knows it."
 brmx.4.a:0 "Revoke every licence that has been sold."
 brmx.4.b:0 "Look the other way. Trade must flow."
 brmx.5.t:0 "The Americans Pack Up"
 brmx.5.d:0 "The American aid mission is leaving. Half-built roads, hospitals and a technical institute are left without money or engineers. The cabinet must decide who, if anyone, will finish them."
 brmx.5.a:0 "We will finish them ourselves."
 brmx.5.b:0 "Ask Moscow and Beijing for help."
 brmx.5.c:0 "Turn to the Colombo Plan partners."
 brmx.10.t:0 "Compensation for the Banks"
 brmx.10.d:0 "The foreign banks are now numbered branches of the People's Bank. Their former owners in London, Calcutta and Hong Kong demand to know what Burma will pay for them."
 brmx.10.a:0 "Pay fair compensation."
 brmx.10.b:0 "Pay in long-term government bonds."
 brmx.10.c:0 "Pay nothing. The banks were built on Burmese sweat."
 brmx.11.t:0 "The Merchants Leave"
 brmx.11.d:0 "With their shops and trading houses nationalised, tens of thousands of Indian and Pakistani families are leaving for good. Many have lived in Burma for generations. They ask to take their savings with them."
 brmx.11.a:0 "Let them take their savings."
 brmx.11.b:0 "Their money stays in Burma."
 brmx.12.t:0 "Queues at the Banks"
 brmx.12.d:0 "Holders of the cancelled fifty and hundred kyat notes may claim compensation if they can prove the money was honestly earned. The queues outside the banks stretch around the block."
 brmx.12.a:0 "Compensate the small savers."
 brmx.12.b:0 "No exceptions."
 brmx.13.t:0 "Rice Shortages"
 brmx.13.d:0 "The rice bowl of Asia is short of rice. Farmers hold back their paddy from the state buyers, queues form at the People's Shops, and in Rangoon there is rioting."
 brmx.13.a:0 "Raise the price we pay farmers."
 brmx.13.b:0 "Import rice to calm the cities."
 brmx.13.c:0 "Strict rationing, enforced by the army."
 brmx.14.t:0 "The Strikes of 1974"
 brmx.14.d:0 "Workers at the Thamaing textile mill and the Sinmalaik dockyard have downed tools. They want more rice and fairer wages, and the strike is spreading to other state factories."
 brmx.14.a:0 "Raise rations and wages."
 brmx.14.b:0 "Send in the army."
 brmx.14.c:0 "Let the workers' councils negotiate."
 brmx.15.t:0 "U Thant's Funeral"
 brmx.15.d:0 "U Thant, our countryman and for ten years Secretary-General of the United Nations, has died in New York. The government planned a quiet burial. Students have seized his coffin and carried it to the university, where they want to build him a mausoleum."
 brmx.15.a:0 "Allow a mausoleum at the university."
 brmx.15.b:0 "Retake the coffin and impose martial law."
 brmx.15.c:0 "Bury him with honours at the foot of the Shwedagon."
 brmx.16.t:0 "A Record Harvest"
 brmx.16.d:0 "The new rice varieties have worked. Granaries in the delta are full for the first time in years, and the Trade Corporation asks what to do with the surplus."
 brmx.16.a:0 "Export it."
 brmx.16.b:0 "Build up the national reserve."
 brmx.16.c:0 "Pay the farmers more next year."
 brmx.17.t:0 "The Donors' Conditions"
 brmx.17.d:0 "The World Bank and the donor countries are ready to lend. In return they want the trade corporations opened up, more freedom for private farmers and a realistic exchange rate."
 brmx.17.a:0 "Accept their reforms."
 brmx.17.b:0 "Take only project aid, without conditions."
 brmx.18.t:0 "The Students Take to the Streets"
 brmx.18.d:0 "Students at the Rangoon Institute of Technology have lost their savings, and their school fees, overnight. They are smashing windows and marching into the city. Other campuses are joining them."
 brmx.18.a:0 "Close the universities."
 brmx.18.b:0 "Compensate depositors."
 brmx.18.c:0 "Promise real economic reform."
 brmx.20.t:0 "The Motorcycle Plant"
 brmx.20.d:0 "A Japanese manufacturer wants to assemble motorcycles near Rangoon. It asks for a ten-year tax holiday; our planners would rather require more Burmese-made parts every year."
 brmx.20.a:0 "Give them the tax holiday."
 brmx.20.b:0 "Insist on local parts."
 brmx.21.t:0 "The Garment Girls"
 brmx.21.d:0 "Young women from the villages work twelve-hour shifts in the new garment factories. A labour newspaper calls it the new colonialism; the exporters say the jobs are better than the paddy fields."
 brmx.21.a:0 "Set a minimum wage."
 brmx.21.b:0 "Keep labour cheap to win orders."
 brmx.22.t:0 "Schumacher Returns"
 brmx.22.d:0 "The economist E. F. Schumacher, who first came to Rangoon in 1955, is back as an adviser. He urges us to put village industries first. Our engineers want dams and steel mills."
 brmx.22.a:0 "Village industries first."
 brmx.22.b:0 "Dams and mills first."
 brmx.23.t:0 "Trouble in the Communes"
 brmx.23.d:0 "The communes of the delta are short of food. Peasants slaughter their buffaloes rather than hand them over, and cadres report harvests that never existed."
 brmx.23.a:0 "Retreat to smaller cooperatives."
 brmx.23.b:0 "Press on. The masses will learn."
 brmx.30.t:0 "The First Investors"
 brmx.30.d:0 "Under the new Foreign Investment Law, offers arrive at once. Western oil companies want offshore exploration blocks; Thai companies want to log the border forests. Both pay in hard currency."
 brmx.30.a:0 "Offshore blocks for the oil companies."
 brmx.30.b:0 "Logging rights for the Thai companies."
 brmx.30.c:0 "Keep our resources for the state."
 brmx.31.t:0 "Landslide at Hpakant"
 brmx.31.d:0 "A mountain of mine waste has collapsed on the shacks of informal jade pickers at Hpakant. More than a hundred people are buried. The mining companies say they cannot be blamed."
 brmx.31.a:0 "Enforce real safety rules."
 brmx.31.b:0 "Production must continue."
 brmx.32.t:0 "Run on the Banks"
 brmx.32.d:0 "Informal finance companies have collapsed, and depositors are queuing outside every private bank in Yangon to take out their savings. The banks are running out of cash."
 brmx.32.a:0 "Guarantee all deposits."
 brmx.32.b:0 "Cap withdrawals until it passes."
 brmx.32.c:0 "Let the weak banks fail."
 brmx.33.t:0 "The Factories Close"
 brmx.33.d:0 "With the American market closed to our clothes, more than a hundred garment factories have shut and tens of thousands of young women have lost their jobs."
 brmx.33.a:0 "Help the workers find new jobs."
 brmx.33.b:0 "Find new buyers in Japan and Korea."
 brmx.34.t:0 "Who Buys the State?"
 brmx.34.d:0 "Hundreds of state factories, buildings and fuel stations are for sale. The generals' friends are first in line, but an open auction would raise more money."
 brmx.34.a:0 "Sell to our friends."
 brmx.34.b:0 "Hold open auctions."
 brmx.36.t:0 "The Forests Are Disappearing"
 brmx.36.d:0 "Satellite pictures show the teak forests of the border hills shrinking by the year. The monsoon floods are worse, and the logging money goes to a few."
 brmx.36.a:0 "Ban the export of raw logs."
 brmx.36.b:0 "Keep cutting while the prices are high."
 brmx.37.t:0 "The IMF Team Arrives"
 brmx.37.d:0 "The International Monetary Fund's mission has its programme ready: devalue the kyat, end the price controls and cut the budget, all at once."
 brmx.37.a:0 "Shock therapy. Get it over with."
 brmx.37.b:0 "Gradual reform, at our own pace."
 brmx.40.t:0 "The Kyat Floats"
 brmx.40.d:0 "For the first time in decades the kyat trades at a market rate. In its first week it falls, and importers are panicking."
 brmx.40.a:0 "Defend the kyat with our reserves."
 brmx.40.b:0 "Let it find its level."
 brmx.41.t:0 "Protests at Letpadaung"
 brmx.41.d:0 "Farmers and monks have camped at the copper mine for weeks. At dawn the police cleared the camp with smoke bombs that left dozens of monks with terrible burns. The country is angry."
 brmx.41.a:0 "Order an independent inquiry."
 brmx.41.b:0 "Clear the protest for good."
 brmx.41.c:0 "Share the mine's profits with the villages."
 brmx.42.t:0 "The Minimum Wage Dispute"
 brmx.42.d:0 "Garment workers want the minimum wage raised to keep up with prices. Factory owners warn that buyers will move their orders to Cambodia and Bangladesh."
 brmx.42.a:0 "Raise the minimum wage."
 brmx.42.b:0 "Keep it low to keep the orders."
 brmx.43.t:0 "Who Builds New Yangon?"
 brmx.43.d:0 "A Chinese state company offers to build the first phase of New Yangon City on generous terms. Others urge an open international tender."
 brmx.43.a:0 "Accept the Chinese offer."
 brmx.43.b:0 "Hold an open international tender."
 brmx.44.t:0 "COVID-19 Reaches Burma"
 brmx.44.d:0 "The first cases of the new coronavirus have been confirmed in Yangon. Hospitals have few ventilators, and millions of workers live day to day."
 brmx.44.a:0 "Strict lockdown."
 brmx.44.b:0 "Keep the factories open."
 brmx.44.c:0 "Cash for the poorest households."
 brmx.45.t:0 "The Corridor's Price"
 brmx.45.d:0 "The Kyaukphyu deep-sea port alone would cost more than seven billion dollars, most of it borrowed from China. Critics warn of a debt trap; the Chinese say the corridor will make Burma rich."
 brmx.45.a:0 "Cut the port down to a size we can afford."
 brmx.45.b:0 "Accept the full plan."
 brmx.50.t:0 "The Kyat Collapses"
 brmx.50.d:0 "The kyat has lost half its value since the coup. Importers cannot pay for fuel or medicine, and the black-market rate changes by the hour."
 brmx.50.a:0 "Enforce a fixed official rate."
 brmx.50.b:0 "Let the market decide."
 brmx.51.t:0 "Cyclone Mocha"
 brmx.51.d:0 "The strongest storm in a decade has struck Rakhine State. Sittwe is under water, camps for displaced people have been flattened, and hundreds of thousands need food and shelter."
 brmx.51.a:0 "Let the aid agencies in."
 brmx.51.b:0 "Relief through our own channels only."
 brmx.52.t:0 "Spending the Spring Bonds"
 brmx.52.d:0 "The Spring Revolution bonds have sold out. The cabinet must decide where the money goes first."
 brmx.52.a:0 "Humanitarian aid for the displaced."
 brmx.52.b:0 "Weapons for the defence forces."
 brmx.52.c:0 "Schools and clinics in the liberated areas."
 brmx.53.t:0 "The Solar Tender"
 brmx.53.d:0 "Bids for the solar farms are in. Chinese companies are cheapest; Japanese and European bidders offer better technology and training for our engineers."
 brmx.53.a:0 "Choose the Chinese bids."
 brmx.53.b:0 "Choose the Japanese and European bids."
 brmx.60.t:0 "Oil at Mann"
 brmx.60.d:0 "The new wells at Mann are flowing far better than the geologists hoped. The question is whether to sell the crude abroad or refine it at home."
 brmx.60.a:0 "Export the crude."
 brmx.60.b:0 "Refine it here, for our own factories."
 brmx.61.t:0 "Villagers Against the Dams"
 brmx.61.d:0 "Shan and Karen villagers whose valleys would be flooded by the Salween dams are marching, and the armed groups in the area have threatened the survey teams."
 brmx.61.a:0 "Compensate and resettle them properly."
 brmx.61.b:0 "Proceed. The country needs the power."
 brmx.62.t:0 "India Shuts Its Market"
 brmx.62.d:0 "India has restricted imports of pulses to protect its own farmers. Beans are piling up in the warehouses of Mandalay and prices have collapsed."
 brmx.62.a:0 "Support our farmers until it passes."
 brmx.62.b:0 "Sell to China instead."
 brmx.63.t:0 "The Kaladan Road Stalls"
 brmx.63.d:0 "Fighting around Paletwa has stopped work on the road that should link the new Sittwe port to India. The Indian engineers have gone home."
 brmx.63.a:0 "Talk to the Arakan Army."
 brmx.63.b:0 "Send army escorts with the convoys."
 brmx.64.t:0 "Poison in the Rivers"
 brmx.64.d:0 "Rare earth mines in the Kachin hills pour acid into the streams. Downstream, fish die and fields turn yellow."
 brmx.64.a:0 "Close the illegal mines."
 brmx.64.b:0 "Tax them instead."
 brmx.70.t:0 "The Student Volunteers"
 brmx.70.d:0 "Thousands of students want to spend their holidays teaching in the villages. Some officials want every student to serve; others warn that forced volunteers teach badly."
 brmx.70.a:0 "Every student must teach."
 brmx.70.b:0 "Volunteers only."
 brmx.71.t:0 "Ceasefire Capitalism"
 brmx.71.d:0 "The ceasefire holds, and the Kachin leaders ask for jade and timber concessions in the areas they control. Refuse, and the ceasefire may not last."
 brmx.71.a:0 "Grant the concessions."
 brmx.71.b:0 "No business deals, only peace."
 brmx.72.t:0 "Mutiny in Panghsang"
 brmx.72.d:0 "Wa and Kokang soldiers have stormed the headquarters of the Communist Party of Burma and sent its old leaders into exile in China. The mutineers want to talk."
 brmx.72.a:0 "Offer them a ceasefire and development aid."
 brmx.72.b:0 "Strike while they are divided."
 brmx.73.t:0 "The Poppy Fields"
 brmx.73.d:0 "In the Wa hills, opium is the only crop that pays. Farmers will give it up only if something else will feed their families."
 brmx.73.a:0 "Pay farmers to switch crops."
 brmx.73.b:0 "Destroy the fields."
 BRM_x_economy_category:0 "Economic Zones and Trade"
 BRM_x_economy_category_desc:0 "Special economic zones, the gem trade, the border trade gates and the development of the regions."
 BRM_x_cost_BRM_x_sez_thilawa_1:0 "£pol_power  §Y50§!  £dollar2  §Y0.30B§!"
 BRM_x_sez_thilawa_1:0 "Thilawa: Clear Zone A"
 BRM_x_sez_thilawa_1_desc:0 "Farmland south of Yangon is cleared and drained, and roads, power and water are laid for the first factories."
 BRM_x_cost_BRM_x_sez_thilawa_2:0 "£pol_power  §Y50§!  £dollar2  §Y0.20B§!"
 BRM_x_sez_thilawa_2:0 "Thilawa: Bring in the Investors"
 BRM_x_sez_thilawa_2_desc:0 "Japanese trading houses market the zone to manufacturers across Asia. Every factory that opens pays rent and customs duty."
 BRM_x_cost_BRM_x_sez_thilawa_3:0 "£pol_power  §Y75§!  £dollar2  §Y0.40B§!"
 BRM_x_sez_thilawa_3:0 "Thilawa: Open Zone B"
 BRM_x_sez_thilawa_3_desc:0 "The zone doubles in size, with a logistics park and housing for its workers."
 BRM_x_cost_BRM_x_sez_kyaukphyu_1:0 "£pol_power  §Y50§!  £dollar2  §Y0.40B§!"
 BRM_x_sez_kyaukphyu_1:0 "Kyaukphyu: The Deep-Sea Port"
 BRM_x_sez_kyaukphyu_1_desc:0 "Deep water close to shore makes Kyaukphyu the best natural harbour on our coast."
 BRM_x_cost_BRM_x_sez_kyaukphyu_2:0 "£pol_power  §Y50§!  £dollar2  §Y0.30B§!"
 BRM_x_sez_kyaukphyu_2:0 "Kyaukphyu: The Industrial Park"
 BRM_x_sez_kyaukphyu_2_desc:0 "Factories beside the port make goods for the markets of China and South Asia."
 BRM_x_cost_BRM_x_sez_kyaukphyu_3:0 "£pol_power  §Y50§!  £dollar2  §Y0.30B§!"
 BRM_x_sez_kyaukphyu_3:0 "Kyaukphyu: The Pipeline Terminal"
 BRM_x_sez_kyaukphyu_3_desc:0 "Oil and gas for Yunnan pass through Kyaukphyu. The transit fees are paid to the Union every month."
 BRM_x_cost_BRM_x_sez_dawei_1:0 "£pol_power  §Y50§!  £dollar2  §Y0.20B§!"
 BRM_x_sez_dawei_1:0 "Dawei: The Road to Bangkok"
 BRM_x_sez_dawei_1_desc:0 "A highway over the Tenasserim hills links Dawei to the Thai border and to Bangkok beyond."
 BRM_x_cost_BRM_x_sez_dawei_2:0 "£pol_power  §Y50§!  £dollar2  §Y0.40B§!"
 BRM_x_sez_dawei_2:0 "Dawei: The Deep-Sea Port"
 BRM_x_sez_dawei_2_desc:0 "Ships from India and the Middle East can unload at Dawei instead of sailing round Singapore."
 BRM_x_cost_BRM_x_sez_dawei_3:0 "£pol_power  §Y75§!  £dollar2  §Y0.30B§!"
 BRM_x_sez_dawei_3:0 "Dawei: The Industrial Estate"
 BRM_x_sez_dawei_3_desc:0 "Heavy industry, from steel to petrochemicals, settles around the new port."
 BRM_x_gems_auction:0 "Hold a Jade and Gems Auction"
 BRM_x_gems_auction_desc:0 "Buyers from Hong Kong, Bangkok and Beijing bid for the jade of Hpakant and the rubies of Mogok."
 BRM_x_cost_BRM_x_gems_crackdown:0 "£pol_power  §Y50§!  £dollar2  §Y0.05B§!"
 BRM_x_gems_crackdown:0 "Crack Down on Gem Smuggling"
 BRM_x_gems_crackdown_desc:0 "Customs officers and police close the smuggling routes to Ruili and Mae Sai. For two years, more of the stones are sold at our auctions."
 BRM_x_cost_BRM_x_gate_muse:0 "£pol_power  §Y50§!  £dollar2  §Y0.05B§!"
 BRM_x_gate_muse:0 "Open the Muse Border Gate"
 BRM_x_gate_muse_desc:0 "The road from Mandalay through Lashio reaches China at Muse. Legal trade there would replace the smugglers."
 BRM_x_cost_BRM_x_gate_tachileik:0 "£pol_power  §Y50§!  £dollar2  §Y0.05B§!"
 BRM_x_gate_tachileik:0 "Open the Tachileik Border Gate"
 BRM_x_gate_tachileik_desc:0 "Across the bridge from Mae Sai, Tachileik could be our gateway to northern Thailand."
 BRM_x_cost_BRM_x_gate_myawaddy:0 "£pol_power  §Y50§!  £dollar2  §Y0.05B§!"
 BRM_x_gate_myawaddy:0 "Open the Myawaddy Border Gate"
 BRM_x_gate_myawaddy_desc:0 "The busiest crossing to Thailand, opposite Mae Sot. It needs peace with the Karen."
 BRM_x_cost_BRM_x_gate_tamu:0 "£pol_power  §Y50§!  £dollar2  §Y0.05B§!"
 BRM_x_gate_tamu:0 "Open the Tamu Border Gate"
 BRM_x_gate_tamu_desc:0 "Tamu faces Moreh in Manipur. A trade agreement with India would open it to legal trade."
 BRM_x_cost_BRM_x_gate_maungdaw:0 "£pol_power  §Y50§!  £dollar2  §Y0.05B§!"
 BRM_x_gate_maungdaw:0 "Open the Maungdaw Border Gate"
 BRM_x_gate_maungdaw_desc:0 "Across the Naf River lies Teknaf in Bangladesh. Trade could help one of the poorest corners of the country."
 BRM_x_cost_BRM_x_develop_dry_zone:0 "£pol_power  §Y50§!  £dollar2  §Y0.40B§!"
 BRM_x_develop_dry_zone:0 "Develop the Dry Zone"
 BRM_x_develop_dry_zone_desc:0 "Irrigation, roads and schools for Magway, Mandalay and Sagaing, the old heartland of the Burmese kings."
 BRM_x_cost_BRM_x_develop_delta:0 "£pol_power  §Y50§!  £dollar2  §Y0.40B§!"
 BRM_x_develop_delta:0 "Develop the Delta"
 BRM_x_develop_delta_desc:0 "Embankments, rice mills and towns for the Irrawaddy delta, Bago and Yangon."
 BRM_x_cost_BRM_x_develop_hills:0 "£pol_power  §Y50§!  £dollar2  §Y0.50B§!"
 BRM_x_develop_hills:0 "Develop the Hill States"
 BRM_x_develop_hills_desc:0 "Roads, clinics and schools for the Shan, Kachin, Chin and Karenni hills, wherever the guns are silent."
 BRM_x_cost_BRM_x_develop_coast:0 "£pol_power  §Y50§!  £dollar2  §Y0.40B§!"
 BRM_x_develop_coast:0 "Develop the Coast"
 BRM_x_develop_coast_desc:0 "Ports, fisheries and roads for Tanintharyi, Mon State and Rakhine, wherever the guns are silent."
 BRM_x_tt_lit_1:0 "Literacy rises by §G1§! points in every state."
 BRM_x_tt_gems_auction:0 "Treasury gains §G$40 million§! (until 1988), §G$120 million§! (1988 to 2010) or §G$240 million§! (after 2010), and §G50%§! more for two years after a crackdown on smuggling."
 BRM_x_tt_gate_muse:0 "Customs income of about §G$1.5 million§! a month, rising to §G$4.5 million§! after 1988 and §G$9 million§! after 2010."
 BRM_x_tt_gate_tachileik:0 "Customs income of about §G$1 million§! a month, rising to §G$3 million§! after 1988 and §G$6 million§! after 2010."
 BRM_x_tt_gate_myawaddy:0 "Customs income of about §G$1.5 million§! a month, rising to §G$4.5 million§! after 1988 and §G$9 million§! after 2010."
 BRM_x_tt_gate_tamu:0 "Customs income of about §G$0.8 million§! a month, rising to §G$2.4 million§! after 1988 and §G$4.8 million§! after 2010."
 BRM_x_tt_gate_maungdaw:0 "Customs income of about §G$0.5 million§! a month, rising to §G$1.5 million§! after 1988 and §G$3 million§! after 2010."
 BRM_x_tt_BRM_x_develop_dry_zone:0 "Each of these states rises one development level, if it is ours and can be upgraded: §YMagway, Mandalay, Sagaing§!."
 BRM_x_tt_BRM_x_develop_delta:0 "Each of these states rises one development level, if it is ours and can be upgraded: §YAyeyarwady, Bago, Yangon§!."
 BRM_x_tt_BRM_x_develop_hills:0 "Each of these states rises one development level, if it is ours and can be upgraded: §YShan (if not at war), Kachin (if not at war), Northern Kachin (if not at war), Chin (if not at war), Karenni (if not at war)§!."
 BRM_x_tt_BRM_x_develop_coast:0 "Each of these states rises one development level, if it is ours and can be upgraded: §YTanintharyi, Mon (if not at war), Rakhine (if not at war)§!."
 BRM_x_tt_gems_clean:0 "For two years our gem auctions earn §G50%§! more."
