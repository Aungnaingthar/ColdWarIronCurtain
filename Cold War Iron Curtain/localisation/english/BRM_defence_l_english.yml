l_english:
 BRM_defence_category:0 "Defence Industry (Ka Pa Sa)"
 BRM_defence_category_desc:0 "The Directorate of Defence Industries, known as Ka Pa Sa, makes the Tatmadaw's rifles, mortars and ammunition. Build it up, develop our own weapons and sell them abroad.[BRM_kps_contract_line]"
 BRM_kps_establish:0 "Establish the Directorate of Defence Industries"
 BRM_kps_establish_desc:0 "Found Ka Pa Sa: state factories for rifles, machine guns and ammunition, so the army no longer depends on foreign suppliers. Builds two arms factories."
 BRM_kps_ba63:0 "Licence-Build the G3 (BA-63)"
 BRM_kps_ba63_desc:0 "Buy a licence from West Germany to build the G3 rifle in Burma as the BA-63. Speeds up our next two infantry weapon technologies."
 BRM_kps_ma_family:0 "Develop the MA Rifle Family"
 BRM_kps_ma_family_desc:0 "Design our own rifles, the MA series, and machine guns in Ka Pa Sa's workshops. Speeds up two infantry weapon and support technologies, and turns Ka Pa Sa into an exporter."
 BRM_kps_export_contract:0 "Sign an Arms Export Contract"
 BRM_kps_export_contract_desc:0 "Sell 4,000 rifles from our stockpile to a friendly or neighbouring country, or one at war: §G$0.08B§! now and §G$0.015B§! a month for a year. The buyer will like us more."
 BRM_kps_cost_05:0 "£dollar2  §Y0.5B§!"
 BRM_kps_cost_04:0 "£dollar2  §Y0.4B§!"
 BRM_kps_cost_02:0 "£dollar2  §Y0.2B§!"
 BRM_kapasa_1:0 "Directorate of Defence Industries"
 BRM_kapasa_1_desc:0 "Ka Pa Sa's state factories supply the Tatmadaw with rifles, mortars and ammunition."
 BRM_kapasa_2:0 "Ka Pa Sa Arms Exporter"
 BRM_kapasa_2_desc:0 "Burmese-designed MA rifles and machine guns equip our army and are sold abroad."
 BRM_kps_ba63_bonus:0 "BA-63 Licence"
 BRM_kps_ma_family_bonus:0 "MA Rifle Family"
 BRM_arms_customer:0 "Buys Burmese Arms"
 brmkps.1.t:0 "Arms Export Contract Signed"
 brmkps.1.d:0 "[BRM_kps_buyer.GetName] has signed a contract for 4,000 Burmese MA rifles, with ammunition and training. The first payment of $0.08 billion has arrived; the rest will be paid in monthly instalments of $0.015 billion over the next year."
 brmkps.1.a:0 "Ka Pa Sa delivers."
 BRM_kps_contract_on:0 "\n\nActive export contract: §G$0.015B§! a month, [?BRM_kps_contract_months|0] months left."
 BRM_kps_contract_off:0 ""
