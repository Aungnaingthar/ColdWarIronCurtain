 BRM_eth_tt_peace_conference:0 "Groups under ceasefire lose §Y1§! strength. §YAutonomy deals§! can be offered."
 BRM_eth_tt_federal_constitution:0 "Every group under ceasefire receives §Gautonomy§! in the new federal union and lays down its arms."
 BRM_eth_tt_federal_democracy_charter:0 "Every group under ceasefire joins the federal union with §Gautonomy§!."
 BRM_eth_tt_national_peace:0 "§GEvery armed conflict ends§!: all groups lay down their arms with autonomy."
 BRM_eth_tt_rakhine_commission:0 "The §YArakanese§! insurgency loses §Y2§! strength, and agrees to a ceasefire if it is weak."
