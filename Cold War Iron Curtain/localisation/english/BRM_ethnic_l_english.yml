 BRM_eth_karen_talks:0 "Ceasefire Talks: Karen (KNU)"
 BRM_eth_karen_talks_desc:0 "Invite the Karen National Union to the negotiating table. A weak group, federal promises and the ceasefire era after 1989 all make agreement more likely.\n\nKNU strength: §Y[?BRM_eth_karen_str|1]§! / 10"
 BRM_eth_karen_offensive:0 "Campaign against the KNU"
 BRM_eth_karen_offensive_desc:0 "Send the Tatmadaw into the hills against the Karen National Union. Costs §Y$0.15B§! and 3,000 men. Success weakens the group; failure strengthens it and hurts civilians.\n\nKNU strength: §Y[?BRM_eth_karen_str|1]§! / 10"
 BRM_eth_karen_autonomy:0 "Grant Autonomy: Karen"
 BRM_eth_karen_autonomy_desc:0 "Turn the ceasefire into a lasting peace: the Karen gain self-government within the Union, and the Karen National Union lays down its arms. Requires federal talks (Panglong Spirit, Federal Seminar, Peace Conference or a federal constitution) and civilian rule."
 BRM_eth_karen_bgf:0 "Border Guard Force: Karen"
 BRM_eth_karen_bgf_desc:0 "Demand that the Karen National Union turns its fighters into a Border Guard Force under Tatmadaw command. If it accepts, the conflict ends; if it refuses, war resumes."
 BRM_eth_karen_development:0 "Development Fund: Karen Areas"
 BRM_eth_karen_development_desc:0 "Build roads, schools and clinics in the Karen ceasefire areas. For five years the ceasefire cannot break down by itself, and the group loses §Y1§! strength."
