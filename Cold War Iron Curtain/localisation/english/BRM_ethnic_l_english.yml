 BRM_ethnic_category:0 "Ethnic Affairs"
 BRM_ethnic_category_desc:0 "Burma's ethnic armed groups have fought the central government since independence. Talk, fight, or offer autonomy.\n\nKaren (KNU): [BRM_eth_karen_status] (strength [?BRM_eth_karen_str|1])\nKarenni (KNPP): [BRM_eth_karenni_status] (strength [?BRM_eth_karenni_str|1])\nMon (NMSP): [BRM_eth_mon_status] (strength [?BRM_eth_mon_str|1])\nArakanese (Arakan insurgents): [BRM_eth_arakan_status] (strength [?BRM_eth_arakan_str|1])\nShan (SSA): [BRM_eth_shan_status] (strength [?BRM_eth_shan_str|1])\nKachin (KIA): [BRM_eth_kachin_status] (strength [?BRM_eth_kachin_str|1])\nChin (CNF): [BRM_eth_chin_status] (strength [?BRM_eth_chin_str|1])[BRM_eth_wa_line]\n\nArmed conflicts cost §R1%§! stability, §R0.015§! political power a day, §R2%§! construction speed and §R$0.01B§! a month each. Ceasefires bring §G$0.01B§! a month each in jade, timber and border trade."
 brmeth.1.a:0 "Send the army to the Shan States."
 brmeth.1.t:0 "The Shan Take Up Arms"
 brmeth.1.d:0 "Shan princes and students, angry at the army's conduct in the Shan States and the government's refusal to honour the right of secession promised at Panglong, have formed armed bands in the hills. The Shan State Army is born."
 brmeth.2.a:0 "A dangerous rebellion."
 brmeth.2.t:0 "The Kachin Independence Army"
 brmeth.2.d:0 "In the Kachin hills, veterans and students have founded the Kachin Independence Army. Many Kachin soldiers of the Burma Army are deserting to join it."
 brmeth.3.a:0 "Offer them a ceasefire and business deals."
 brmeth.3.b:0 "They are rebels like any other."
 brmeth.3.t:0 "The Communist Party of Burma Collapses"
 brmeth.3.d:0 "The Wa and Kokang soldiers of the Communist Party of Burma have mutinied against their Burman leaders and driven them into China. The United Wa State Army and the Kokang MNDAA now hold the northeastern hills, heavily armed and rich from border trade."
 brmeth.4.a:0 "Sign the ceasefire."
 brmeth.4.b:0 "No deals with rebels."
 brmeth.4.t:0 "The KIA Offers a Ceasefire"
 brmeth.4.d:0 "After three decades of war, the Kachin Independence Army is ready to sign a ceasefire, in return for control of its areas and a share of the jade trade."
 brmeth.5.a:0 "Agree."
 brmeth.5.b:0 "Fight on."
 brmeth.5.t:0 "The New Mon State Party Seeks Peace"
 brmeth.5.d:0 "The New Mon State Party asks for a ceasefire, worn down by years of fighting and the loss of its bases along the Thai border."
 brmeth.6.a:0 "Crush the Kokang."
 brmeth.6.b:0 "Back down."
 brmeth.6.t:0 "The Border Guard Force Crisis"
 brmeth.6.d:0 "The army demands that every ceasefire group turns its troops into a Border Guard Force under Tatmadaw command. The Kokang leadership refuses, and fighting breaks out in Laukkai; tens of thousands of refugees flee into China."
 brmeth.7.a:0 "Another war in the north."
 brmeth.7.t:0 "The Kachin Ceasefire Collapses"
 brmeth.7.d:0 "Fighting has broken out near a Chinese-built dam in Kachin State. The seventeen-year ceasefire with the KIA is over."
 brmeth.8.a:0 "Send reinforcements to Rakhine."
 brmeth.8.t:0 "The Arakan Army Strikes"
 brmeth.8.d:0 "The Arakan Army, founded a decade ago in Kachin State, has opened a full-scale war in Rakhine State, overrunning police posts across the north."
 brmeth.9.a:0 "The Tatmadaw will prevail."
 brmeth.9.t:0 "The Hills Rise Against the Coup"
 brmeth.9.d:0 "The army's seizure of power has driven young people from the cities into the hills, where the Karen, Karenni, Kachin and Chin armed groups train and arm them. The old ceasefires are dead."
 brmeth.10.a:0 "A catastrophe."
 brmeth.10.t:0 "Operation 1027"
 brmeth.10.d:0 "The Three Brotherhood Alliance (the Kokang MNDAA, the Ta'ang TNLA and the Arakan Army) has launched a coordinated offensive in northern Shan State, seizing towns, border crossings and hundreds of army posts in days."
 brmeth.100.a:0 "Peace, for now."
 brmeth.100.t:0 "Ceasefire with the KNU"
 brmeth.100.d:0 "After weeks of talks, the Karen National Union has agreed to a ceasefire. Its fighters keep their weapons and their territory, but the shooting has stopped."
 brmeth.110.a:0 "We will try again later."
 brmeth.110.t:0 "Talks with the KNU Fail"
 brmeth.110.d:0 "The talks with the Karen National Union have broken down over the old questions: federalism, the army's presence and who controls the land and its resources."
 brmeth.120.a:0 "Another front."
 brmeth.120.t:0 "The KNU Takes Up Arms Again"
 brmeth.120.d:0 "The ceasefire with the Karen National Union has collapsed after clashes between its fighters and army patrols. The war in the Karen areas has resumed."
 brmeth.130.a:0 "Well done."
 brmeth.130.t:0 "Victory against the KNU"
 brmeth.130.d:0 "Our offensive has overrun several camps of the Karen National Union and cut its supply routes. The group is much weaker."
 brmeth.140.a:0 "The hills are patient."
 brmeth.140.t:0 "Stalemate in the Karen Hills"
 brmeth.140.d:0 "Our columns met little resistance: the Karen National Union simply melted into the jungle and waited. We gained little."
 brmeth.150.a:0 "A setback."
 brmeth.150.t:0 "The Campaign against the KNU Fails"
 brmeth.150.d:0 "The offensive against the Karen National Union was ambushed in the hills. Villages were burned in the fighting, and new recruits are flocking to the rebels."
 brmeth.160.a:0 "Accept their surrender of the field."
 brmeth.160.t:0 "The KNU Is Forced to Talks"
 brmeth.160.d:0 "With its bases lost and its leaders on the run, the Karen National Union has asked for a ceasefire."
 brmeth.170.a:0 "Repair the damage."
 brmeth.170.t:0 "KNU Raid"
 brmeth.170.d:0 "Fighters of the Karen National Union have attacked a convoy and an army post, and blown up a bridge."
