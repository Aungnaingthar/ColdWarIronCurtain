 BRM_eth_tt_kachin_chin_hills:0 "The §YKachin§! and §YChin§! hills are won over: they will not take up arms unless provoked."
 BRM_eth_tt_shan_states:0 "The §YShan§! princes are reassured: a Shan rebellion becomes unlikely."
 BRM_eth_tt_nationalities_settlement:0 "Every insurgency with a strength of §Y6§! or less agrees to a §Gceasefire§!."
 BRM_eth_tt_state_religion:0 "§RThe largely Christian Kachin and Chin feel betrayed: a Kachin rebellion becomes likely.§!"
 BRM_eth_tt_counterinsurgency:0 "Every active insurgency loses §Y1§! strength."
 BRM_eth_tt_end_civil_war:0 "Every active insurgency loses §Y2§! strength; the weakest accept a §Gceasefire§!."
 BRM_eth_tt_panglong_spirit:0 "The Panglong promise is honoured: §YShan, Kachin and Chin§! goodwill, and every insurgency loses §Y1§! strength. Autonomy talks become possible."
 BRM_eth_tt_ceasefire_deals:0 "Every insurgency with a strength of §Y7§! or less signs a §Gceasefire§! in return for business concessions."
