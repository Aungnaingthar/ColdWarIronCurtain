 BRMX_int_intel:0 "Head of Intelligence"
 BRMX_int_intel_desc:0 "Knows every plot before it begins."
 BRMX_int_reformer:0 "Reformist Interior Minister"
 BRMX_int_reformer_desc:0 "Rule of law and honest police."
 BRMX_int_order:0 "Law-and-Order Hardliner"
 BRMX_int_order_desc:0 "Curfews, checkpoints and a strong hand."
 BRMX_int_anticorruption:0 "Anti-Corruption Crusader"
 BRMX_int_anticorruption_desc:0 "Cleans out the ministries."
 BRMX_int_reconcile:0 "Minister for National Reconciliation"
 BRMX_int_reconcile_desc:0 "Brings minorities and rebels to the table."
 BRM_adv_kodaw_hmaing:0 "Thakin Kodaw Hmaing"
 BRM_adv_kodaw_hmaing_desc:0 "Beloved nationalist poet and peace campaigner."
 BRM_adv_maung_maung:0 "Dr. Maung Maung"
 BRM_adv_maung_maung_desc:0 "Constitutional scholar and jurist."
 BRMX_def_industry:0 "Defence Industrialist"
 BRMX_def_industry_desc:0 "Factories that build the nation's weapons."
 BRMX_def_mobilise:0 "Mobilisation Planner"
 BRMX_def_mobilise_desc:0 "A plan to call up every reservist."
 BRMX_def_logistics:0 "Logistics Expert"
 BRMX_def_logistics_desc:0 "An army marches on its supply lines."
 BRMX_def_civil:0 "Civil Defence Planner"
 BRMX_def_civil_desc:0 "Shelters, drills and a ready population."
 BRMX_army_offensive:0 "Offensive-Minded General"
 BRMX_army_offensive_desc:0 "Attack is the best defence."
 BRMX_army_defensive:0 "Defensive Doctrine General"
 BRMX_army_defensive_desc:0 "Hold the line, make them pay."
 BRMX_army_organiser:0 "Army Organiser"
 BRMX_army_organiser_desc:0 "Order, discipline, training."
 BRMX_army_guerrilla:0 "Guerrilla Warfare Expert"
 BRMX_army_guerrilla_desc:0 "Fights where the enemy cannot follow."
 BRMX_army_planner:0 "Staff Planner"
 BRMX_army_planner_desc:0 "Every operation planned to the hour."
 BRM_adv_smith_dun:0 "Smith Dun"
 BRM_adv_smith_dun_desc:0 "Karen general, first commander of the Tatmadaw."
 BRMX_air_superiority:0 "Air Superiority Advocate"
 BRMX_air_superiority_desc:0 "Control the skies first."
 BRMX_air_cas:0 "Close Air Support Proponent"
 BRMX_air_cas_desc:0 "Aircraft exist to help the infantry."
 BRMX_air_missions:0 "Air Operations Planner"
 BRMX_air_missions_desc:0 "Every sortie counts."
 BRMX_air_safety:0 "Air Training Reformer"
 BRMX_air_safety_desc:0 "Fewer accidents, better pilots."
 BRM_adv_tommy_clift:0 "Tommy Clift"
 BRM_adv_tommy_clift_desc:0 "Air Commodore, first commander of the Air Force."
 BRMX_navy_coastal:0 "Coastal Defence Admiral"
