 BRMX_navy_bluewater:0 "Blue-Water Admiral"
 BRMX_navy_bluewater_desc:0 "A navy that sails far from home."
 BRMX_navy_submarine:0 "Submarine Warfare Expert"
 BRMX_navy_submarine_desc:0 "Strike unseen from below."
 BRM_adv_than_pe:0 "Than Pe"
 BRM_adv_than_pe_desc:0 "Commodore, founder of the Burma Navy."
 BRMX_theory_land:0 "Land Warfare Theorist"
 BRMX_theory_land_desc:0 "Writes the army's doctrine."
 BRMX_theory_air:0 "Air Power Theorist"
 BRMX_theory_air_desc:0 "Writes the air force's doctrine."
 BRMX_theory_naval:0 "Naval Theorist"
 BRMX_theory_naval_desc:0 "Writes the navy's doctrine."
 BRM_adv_tin_pe:0 "Tin Pe"
 BRM_adv_tin_pe_desc:0 "Brigadier and staff planner."
 economy_minister:0 "Economy Minister"
 foreign_minister:0 "Foreign Minister"
 defence_minister:0 "Defence Minister"
 chief_of_army:0 "Chief of the Army"
 chief_of_air:0 "Chief of the Air Force"
 chief_of_navy:0 "Chief of the Navy"
 brmdip.ok:0 "Understood."
 brmdip.10.t:0 "Burma Asks for Economic Aid"
 brmdip.10.d:0 "The government of [From.GetName] asks us for $0.5 billion in development aid for roads, power stations and schools."
 brmdip.10.a:0 "Send the aid."
 brmdip.10.b:0 "Refuse."
 brmdip.11.t:0 "[From.GetName] Sends Aid"
 brmdip.11.d:0 "\"We are glad to help a friendly nation develop.\"\n\n$0.5 billion has been added to our treasury."
 brmdip.12.t:0 "[From.GetName] Refuses Aid"
 brmdip.12.d:0 "\"Our taxpayers will not fund a government that stands against everything we believe in, or that ignores the rights of its people.\""
 brmdip.13.t:0 "[From.GetName] Cannot Help"
 brmdip.13.d:0 "\"Our own budget is stretched, and we must put our own people first this year.\""
 brmdip.20.t:0 "Burma Asks for Military Aid"
 brmdip.20.d:0 "The government of [From.GetName] asks us for rifles, mortars and military advisers to fight the insurgents in its hills and jungles."
 brmdip.20.a:0 "Send weapons and advisers."
 brmdip.20.b:0 "Refuse."
 brmdip.21.t:0 "[From.GetName] Sends Weapons"
 brmdip.21.d:0 "\"A stable [Root.GetName] is in our interest.\"\n\nRifles and equipment have arrived, along with advisers to train our soldiers."
 brmdip.22.t:0 "[From.GetName] Refuses to Send Weapons"
 brmdip.22.d:0 "\"We will not send weapons that might be turned against civilians, or that would anger our neighbours.\""
 brmdip.30.t:0 "Burma Proposes an Alliance"
 brmdip.30.d:0 "The government of [From.GetName] proposes a defensive alliance: an attack on one would be treated as an attack on both."
 brmdip.30.a:0 "Agree to the alliance."
 brmdip.30.b:0 "Decline."
 brmdip.31.t:0 "[From.GetName] Agrees to an Alliance"
 brmdip.31.d:0 "\"Our nations stand together.\" Each of us now guarantees the other's independence, or we have joined their bloc."
 brmdip.32.t:0 "[From.GetName] Rejects an Alliance"
 brmdip.32.d:0 "\"Our political systems are too different. We cannot commit our soldiers to defend a government that does not share our values.\""
 brmdip.33.t:0 "[From.GetName] Declines for Now"
 brmdip.33.d:0 "\"We value our friendship, but we are not ready to commit to a military alliance.\""
 brmdip.40.t:0 "Burma Asks Us to Lift Sanctions"
 brmdip.40.d:0 "The government of [From.GetName] asks us to lift our sanctions."
 brmdip.40.a:0 "Lift the sanctions."
 brmdip.40.b:0 "Keep the sanctions."
 brmdip.41.t:0 "Sanctions Lifted"
 brmdip.41.d:0 "\"We welcome the reforms in [Root.GetName]. Our sanctions are lifted, and we look forward to trade and investment.\""
 brmdip.42.t:0 "Sanctions Remain"
 brmdip.42.d:0 "\"As long as the army rules without the consent of the people, our sanctions will stay in place.\""
 brmdip.50.t:0 "Washington Invites Us into SEATO"
 brmdip.50.d:0 "The United States invites Burma to join the new South-East Asia Treaty Organization against communism. Joining would bring American aid and protection - and anger Beijing, whose border is next to ours."
 brmdip.50.a:0 "Join the Western alliance."
 brmdip.50.b:0 "Burma stays neutral."
 brmdip.51.t:0 "A Soviet Arms Offer"
 brmdip.51.d:0 "Moscow offers rifles and mortars at a fraction of their price, on easy credit. 'Friendship between peoples,' the Soviet ambassador says."
 brmdip.51.a:0 "Accept the weapons ($0.2 billion)."
 brmdip.51.b:0 "Politely decline."
 brmdip.52.t:0 "Western Sanctions"
 brmdip.52.d:0 "After the army's seizure of power and the crackdown on protesters, the United States and its allies have imposed sanctions on Burma: no new investment, no arms sales, frozen aid."
 brmdip.52.a:0 "We will survive without them."
 brmdip.54.t:0 "China Offers Infrastructure Loans"
 brmdip.54.d:0 "Beijing offers $1 billion in loans for roads, bridges and ports, at 2% interest. It would bring development - and leave us owing China for years."
 brmdip.54.a:0 "Accept the loans."
 brmdip.54.b:0 "Refuse - we will not be in debt to Beijing."
 brmdip.55.t:0 "A Japanese Investment Mission"
 brmdip.55.d:0 "Japanese trading houses want to open offices and factories in Rangoon."
 brmdip.55.a:0 "Welcome them."
 brmdip.55.b:0 "Not now."
 brmdip.56.t:0 "Border Trade Boom"
 brmdip.56.d:0 "Trade across the Thai and Chinese borders is booming: jade, timber and consumer goods change hands at every crossing."
 brmdip.56.a:0 "Collect the customs revenue."
 brmdip.57.t:0 "Sanctions Lifted"
 brmdip.57.d:0 "With civilian government restored, the United States and its allies have lifted their sanctions."
 brmdip.57.a:0 "A new chapter."
