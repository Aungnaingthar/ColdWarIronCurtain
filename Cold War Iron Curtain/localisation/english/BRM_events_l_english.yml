l_english:
 brm.1.t:0 "The Siege of Insein"
 brm.1.d:0 "Karen National Defence Organisation fighters have taken Insein, just nine miles from Rangoon. Foreign newspapers already call us the 'Rangoon Government'. The capital itself is in danger."
 brm.1.a:0 "Rush every available unit to Insein!"
 brm.1.b:0 "Hold the line and open talks with the KNDO."
 brm.2.t:0 "Ne Win Appointed Commander-in-Chief"
 brm.2.d:0 "With General Smith Dun, a Karen, removed from command, Lieutenant-General Ne Win takes over the armed forces. He is able and ambitious, and the army is loyal to him."
 brm.2.a:0 "Give the general everything he needs."
 brm.2.b:0 "Keep the army firmly under civilian control."
 brm.4.t:0 "Recognising the People's Republic"
 brm.4.d:0 "The Communists have won the Chinese Civil War. Burma shares a long border with the new People's Republic and could be among the first countries outside the Soviet bloc to recognise it."
 brm.4.a:0 "Recognise Beijing at once."
 brm.4.b:0 "Wait and see what the West does."
 brm.5.t:0 "The Pyidawtha Conference"
 brm.5.d:0 "Ministers, officials and foreign advisers meet in Rangoon to plan 'Pyidawtha', the Happy Land: houses, schools, clinics and factories for the whole country."
 brm.5.a:0 "A welfare state for every citizen."
 brm.5.b:0 "Industry first; welfare will follow."
 brm.6.t:0 "The Kuomintang Question at the UN"
 brm.6.d:0 "Burma has taken its complaint about the Kuomintang troops to the United Nations. Washington and Taipei offer to evacuate some of them."
 brm.6.a:0 "Demand a full withdrawal."
 brm.6.b:0 "Accept a partial evacuation."
 brm.7.t:0 "The Japanese Reparations Treaty"
 brm.7.d:0 "Japan offers 200 million dollars in reparations over ten years, mostly as goods, machinery and engineering services."
 brm.7.a:0 "Sign the treaty."
 brm.7.b:0 "Press Tokyo for better terms."
 brm.8.t:0 "The Sixth Buddhist Council"
 brm.8.d:0 "Monks from across the Buddhist world gather at the Kaba Aye Pagoda in Rangoon for the Sixth Buddhist Council, the first in nearly a century."
 brm.8.a:0 "A great honour for the Golden Land."
 brm.8.b:0 "A celebration of all the Union's faiths."
 brm.9.t:0 "The Bandung Conference"
 brm.9.d:0 "Twenty-nine nations of Asia and Africa meet at Bandung in Indonesia. Prime Minister U Nu helped to organise the conference."
 brm.9.a:0 "Burma speaks for the new nations."
 brm.10.t:0 "Khrushchev and Bulganin in Rangoon"
 brm.10.d:0 "Soviet leaders Nikita Khrushchev and Nikolai Bulganin are cheered by huge crowds in Rangoon and offer to buy our surplus rice and to build us a technological institute."
 brm.10.a:0 "Welcome Soviet friendship."
 brm.10.b:0 "Thank them politely, and stay neutral."
 brm.11.t:0 "The AFPFL Splits"
 brm.11.d:0 "The ruling Anti-Fascist People's Freedom League has split into U Nu's 'Clean' faction and Ba Swe and Kyaw Nyein's 'Stable' faction. Parliament is deadlocked."
 brm.11.a:0 "Back U Nu and the Clean AFPFL."
 brm.11.b:0 "Back Ba Swe and the Stable AFPFL."
 brm.11.c:0 "Ask the army to restore order."
 brm.12.t:0 "The Boundary Treaty with China"
 brm.12.d:0 "After years of talks, Beijing offers to settle the whole Sino-Burmese border: a fair exchange of a few villages and the end of an old colonial dispute."
 brm.12.a:0 "Sign the treaty."
 brm.13.t:0 "U Thant Elected Secretary-General"
 brm.13.d:0 "U Thant, a Burmese diplomat and former headmaster from Pantanaw, has been chosen as Secretary-General of the United Nations, the first Asian to hold the post."
 brm.13.a:0 "A proud day for Burma."
 brm.14.t:0 "The SEAP Games in Rangoon"
 brm.14.d:0 "Athletes from across Southeast Asia gather at Aung San Stadium for the Southeast Asian Peninsular Games."
 brm.14.a:0 "Let the games begin!"
 brm.15.t:0 "The Pagan Earthquake"
 brm.15.d:0 "A strong earthquake has struck Pagan, damaging hundreds of the ancient temples built by the kings of the first Burmese empire."
 brm.15.a:0 "The state will rebuild the temples."
 brm.15.b:0 "Leave the work to the monks and the people."
 brm.16.t:0 "The Saffron Revolution"
 brm.16.d:0 "Fuel prices have suddenly risen fivefold. Thousands of Buddhist monks, their alms bowls turned upside down, are marching through Yangon."
 brm.16.a:0 "Restore order by force."
 brm.16.b:0 "Open a dialogue with the Sangha."
 brm.17.t:0 "Cyclone Nargis"
 brm.17.d:0 "Cyclone Nargis has hit the Irrawaddy Delta. A storm surge several metres high destroyed whole villages. About 140,000 people are dead or missing, and more than two million need help."
 brm.17.a:0 "Open the country to international aid."
 brm.17.b:0 "We will rebuild with our own resources."
 brm.18.t:0 "Aung San Suu Kyi Released"
 brm.18.d:0 "After fifteen of the last twenty-one years under house arrest, Aung San Suu Kyi is free. Thousands gather outside her house on University Avenue."
 brm.18.a:0 "A new chapter begins."
 brm.19.t:0 "The SEA Games in Naypyidaw"
 brm.19.d:0 "For the first time in 44 years, Myanmar hosts the Southeast Asian Games, in a new stadium in Naypyidaw."
 brm.19.a:0 "A festival for the whole region."
 brm.20.t:0 "Myanmar Chairs ASEAN"
 brm.20.d:0 "For the first time, Myanmar holds the chairmanship of ASEAN and hosts the leaders of Southeast Asia."
 brm.20.a:0 "Show the region a new Myanmar."
 brm.21.t:0 "Operation 1027"
 brm.21.d:0 "The Three Brotherhood Alliance has launched a major offensive in northern Shan State and captured dozens of military posts and border towns. Other resistance forces are attacking across the country."
 brm.21.a:0 "Seek a ceasefire through Chinese mediation."
 brm.21.b:0 "Fight on."
 brm.50.t:0 "The Fritz Werner Delegation"
 brm.50.d:0 "Engineers from Fritz Werner of West Germany have toured our arsenals. They can help us build a rifle factory or a modern ammunition plant, but not both at once."
 brm.50.a:0 "Build the rifle factory."
 brm.50.b:0 "Build the ammunition plant."
 brm.51.t:0 "The Burmah Oil Company"
 brm.51.d:0 "The British-owned Burmah Oil Company wants to rebuild the oil fields, if it can keep control of them. Many in Rangoon would rather the nation owned its own oil."
 brm.51.a:0 "Nationalise the oil fields."
 brm.51.b:0 "Form a joint venture with the company."
 BRM_buy_industrial_park:0 "Build an Industrial Park"
 BRM_buy_industrial_park_desc:0 "Pay for a new Industrial Park (civilian factory). Costs §R$0.4 billion§!."
 BRM_cost_BRM_buy_industrial_park:0 "£dollar2  §Y0.4B§!"
 BRM_buy_office_park:0 "Build an Office Park"
 BRM_buy_office_park_desc:0 "Pay for a new Office Park: banks, trading houses and offices that earn far more than they cost. Costs §R$0.6 billion§!."
 BRM_cost_BRM_buy_office_park:0 "£dollar2  §Y0.6B§!"
 BRM_buy_agri_complex:0 "Build an Agri-Industrial Complex"
 BRM_buy_agri_complex_desc:0 "Pay for rice mills, granaries and modern farms. Costs §R$0.25 billion§!."
 BRM_cost_BRM_buy_agri_complex:0 "£dollar2  §Y0.25B§!"
 BRM_buy_arms_factory:0 "Build an Arms Factory"
 BRM_buy_arms_factory_desc:0 "Pay for a new arms factory for the Tatmadaw. Costs §R$0.45 billion§!."
 BRM_cost_BRM_buy_arms_factory:0 "£dollar2  §Y0.45B§!"
 BRM_buy_power_plant:0 "Build a Power Station"
 BRM_buy_power_plant_desc:0 "Pay for a power station to supply factories and towns with electricity. Costs §R$0.35 billion§!."
 BRM_cost_BRM_buy_power_plant:0 "£dollar2  §Y0.35B§!"
 BRM_buy_water_infra:0 "Build Water Infrastructure"
 BRM_buy_water_infra_desc:0 "Pay for irrigation canals, wells and clean water. Costs §R$0.15 billion§!."
 BRM_cost_BRM_buy_water_infra:0 "£dollar2  §Y0.15B§!"
 BRM_buy_roads:0 "Build Roads and Bridges"
 BRM_buy_roads_desc:0 "Pay for new roads and bridges. Costs §R$0.12 billion§!."
 BRM_cost_BRM_buy_roads:0 "£dollar2  §Y0.12B§!"
 BRM_buy_municipal_infra:0 "Build Municipal Infrastructure"
 BRM_buy_municipal_infra_desc:0 "Pay for town water, sewers, schools and clinics. Costs §R$0.15 billion§!."
 BRM_cost_BRM_buy_municipal_infra:0 "£dollar2  §Y0.15B§!"
 BRM_buy_foreign_arms:0 "Purchase Foreign Arms"
 BRM_buy_foreign_arms_desc:0 "Buy rifles, mortars and trucks from abroad. Costs §R$0.25 billion§!."
 BRM_cost_BRM_buy_foreign_arms:0 "£dollar2  §Y0.25B§!"
 BRM_buy_aircraft:0 "Buy Aircraft Abroad"
 BRM_buy_aircraft_desc:0 "Buy aircraft and the training to fly them. Costs §R$0.35 billion§!."
 BRM_cost_BRM_buy_aircraft:0 "£dollar2  §Y0.35B§!"
 BRM_buy_patrol_boats:0 "Buy Patrol Boats"
 BRM_buy_patrol_boats_desc:0 "Buy patrol boats for the rivers and the coast. Costs §R$0.2 billion§!."
 BRM_cost_BRM_buy_patrol_boats:0 "£dollar2  §Y0.2B§!"
 BRM_fund_monasteries:0 "Donations to the Sangha"
 BRM_fund_monasteries_desc:0 "Fund the repair of monasteries and pagodas across the country. Costs §R$0.03 billion§!."
 BRM_cost_BRM_fund_monasteries:0 "£dollar2  §Y0.03B§!"
 BRM_rural_development:0 "Rural Development Fund"
 BRM_rural_development_desc:0 "Wells, schools and clinics for the villages. Costs §R$0.1 billion§!."
 BRM_cost_BRM_rural_development:0 "£dollar2  §Y0.1B§!"
 BRM_fund_research:0 "Research Grants"
 BRM_fund_research_desc:0 "Fund the universities and research institutes. Costs §R$0.2 billion§!."
 BRM_cost_BRM_fund_research:0 "£dollar2  §Y0.2B§!"
 BRM_sell_rice_reserves:0 "Sell the Rice Reserves"
 BRM_sell_rice_reserves_desc:0 "Sell part of the state rice reserve on the world market. Brings §G$0.2 billion§! into the treasury."
 BRM_development_category:0 "Burmese Development"
 BRM_development_category_desc:0 "Spend money from the national treasury on factories, offices, power, water, roads, arms and the welfare of the people. Prices are in Iron Curtain dollars (a state upgrade costs $1B)."
 BRM_finance_category:0 "International Finance"
 BRM_finance_category_desc:0 "Lend money to other countries and earn interest, or borrow from foreign governments.\n\nOwed to us: §G[?BRM_total_receivable|2]B§!  (repayments: §G[?BRM_loan_income|3]B§! per month)\nWe owe: §R[?BRM_total_payable|2]B§!  (repayments: §R[?BRM_loan_payments|3]B§! per month)\n\nAll loans run for 10 years. A country that misses 6 payments in a row defaults.\n\nExports last month: §G$[?trade_income|2]B§! (of which natural resources §G$[?resource_income|2]B§!). Countries pay us every month for the oil, tungsten, rubber and other resources they buy from us."
 BRM_loan_info_lent:0 "§GLENT§! to [From.GetName]: owes us $[?FROM.BRM_owed_to_burma|2]B"
 BRM_loan_info_lent_desc:0 "We lent §Y$[?FROM.BRM_lent_by_burma|2] billion§! at §Y[?FROM.BRM_rate_to_burma|0]%§! interest a year.\nStill owed to us: §G$[?FROM.BRM_owed_to_burma|2] billion§!\nThey pay us §G$[?FROM.BRM_pay_to_burma|3] billion§! a month.\nMissed payments in a row: [?FROM.BRM_missed_to_burma|0] (6 = default)"
 BRM_loan_info_borrowed:0 "§RBORROWED§! from [From.GetName]: we owe $[?FROM.BRM_burma_owes|2]B"
 BRM_loan_info_borrowed_desc:0 "We borrowed §Y$[?FROM.BRM_burma_borrowed|2] billion§! at §Y[?FROM.BRM_burma_rate|0]%§! interest a year.\nStill to repay: §R$[?FROM.BRM_burma_owes|2] billion§!\nWe pay §R$[?FROM.BRM_burma_pay|3] billion§! a month.\nMissed payments in a row: [?FROM.BRM_burma_missed|0] (6 = default)"
 BRM_offer_loan:0 "Offer a Loan to [From.GetName]"
 BRM_offer_loan_desc:0 "Lend money to [From.GetName] at §Y5%§! interest a year, repaid monthly over 10 years. They will like us more while they owe us."
 BRM_request_loan:0 "Request a Loan from [From.GetName]"
 BRM_request_loan_desc:0 "Ask [From.GetName] for a government loan, repaid monthly over 10 years. Friendly countries lend at §G3%§!, others at §Y6%§!."
 BRM_arms_imports:0 "Foreign Arms Imports"
 BRM_arms_imports_desc:0 "Imported weapons are reaching the front."
 brmfin.1.t:0 "A Loan for [BRM_loan_partner.GetName]"
 brmfin.1.d:0 "How much should we offer [BRM_loan_partner.GetName]? The loan carries 5% interest a year and is repaid monthly over 10 years, so they will pay back half as much again as they borrow.

The money leaves our treasury §Ynow§!. If they refuse, it comes back."
 brmfin.1.a:0 "Offer $0.5 billion."
 brmfin.1.b:0 "Offer $1 billion."
 brmfin.1.c:0 "Offer $2 billion."
 brmfin.1.e:0 "On second thought, keep the money."
 brmfin.2.t:0 "Burma Offers a Loan"
 brmfin.2.d:0 "The government of [From.GetName] offers us a loan of §Y$[?FROM.BRM_pending_amount|2] billion§! at 5% interest, to be repaid at §Y$[?FROM.BRM_pending_payment|3] billion§! a month over 10 years."
 brmfin.2.a:0 "We accept."
 brmfin.2.b:0 "We do not need it."
 brmfin.3.t:0 "Loan Accepted"
 brmfin.3.d:0 "[From.GetName] has accepted our loan of $[?BRM_pending_amount|2] billion. They will repay $[?BRM_pending_payment|3] billion every month for 10 years."
 brmfin.3.a:0 "A sound investment."
 brmfin.4.t:0 "Loan Declined"
 brmfin.4.d:0 "[From.GetName] has politely declined our offer of a loan. The $[?BRM_pending_amount|2] billion has been returned to our treasury."
 brmfin.4.a:0 "Their loss."
 brmfin.5.t:0 "[From.GetName] Defaults"
 brmfin.5.d:0 "[From.GetName] has missed six repayments in a row and has stopped paying. The rest of the loan is lost."
 brmfin.5.a:0 "We will remember this."
 brmfin.6.t:0 "Loan Repaid"
 brmfin.6.d:0 "[From.GetName] has repaid its loan in full, with interest."
 brmfin.6.a:0 "Excellent."
 brmfin.10.t:0 "A Loan from [BRM_loan_partner.GetName]"
 brmfin.10.d:0 "How much should we ask [BRM_loan_partner.GetName] to lend us? They are likely to offer §Y[?BRM_pending_rate|0]%§! interest a year. The loan is repaid monthly over 10 years."
 brmfin.10.a:0 "Ask for $0.5 billion."
 brmfin.10.b:0 "Ask for $1 billion."
 brmfin.10.c:0 "Ask for $2 billion."
 brmfin.10.e:0 "Ask for $5 billion."
 brmfin.11.t:0 "Burma Requests a Loan"
 brmfin.11.d:0 "The government of [From.GetName] asks us for a loan of §Y$[?FROM.BRM_pending_amount|2] billion§! at [?FROM.BRM_pending_rate|0]% interest. They would repay §Y$[?FROM.BRM_pending_payment|3] billion§! a month over 10 years."
 brmfin.11.a:0 "Agree to the loan."
 brmfin.11.b:0 "Refuse."
 brmfin.12.t:0 "Loan Granted"
 brmfin.12.d:0 "[From.GetName] has lent us $[?BRM_pending_amount|2] billion at [?BRM_pending_rate|0]% interest. We must repay $[?BRM_pending_payment|3] billion every month for 10 years."
 brmfin.12.a:0 "Put it to good use."
 brmfin.13.t:0 "Loan Refused"
 brmfin.13.d:0 "[From.GetName] has refused to lend us money."
 brmfin.13.a:0 "We will look elsewhere."
 brmfin.14.t:0 "Burma Defaults"
 brmfin.14.d:0 "We have missed six repayments in a row to [From.GetName] and have stopped paying. Our reputation abroad has suffered."
 brmfin.14.a:0 "We had no choice."
 brmfin.15.t:0 "Debt Repaid"
 brmfin.15.d:0 "We have repaid our loan to [From.GetName] in full."
 brmfin.15.a:0 "Free of debt."
 BRM_loan_partner:0 "Loan from Burma"
 BRM_loan_default:0 "Defaulted on a Loan"
